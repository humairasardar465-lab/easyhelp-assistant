<video id="webcam" autoplay playsinline muted></video>

<script>
const video=document.getElementById('webcam');
const statusEl=document.getElementById('status');
const langSel=document.getElementById('voiceLanguage');
let stream=null, isLive=false, model=null, lastSpoken="", lastSpeakTime=0, audioCtx=null, lastAvg=0;
let lastAnnouncedCategory = null; 

const translations = {
  'ur-PK': {
    loading: 'سنسور آن ہو رہا ہے۔',
    started: 'اسمارٹ کین آن ہو گیا ہے۔ اب میں بتاتی رہوں گی راستہ کیسا ہے۔',

    clearPath: 'رستہ صاف ہے، آگے بڑھیں۔',
    camError: 'کیمرہ کی اجازت دیں',
    netError: 'انٹرنیٹ آن کریں، ماڈل لوڈ نہیں ہوا۔'
  },
  'en-US': {
    loading: 'Sensor is turning on.',
    started: 'Smart Cane is on. I will keep informing you about the path.',
    stopClose: 'Stop, obstacle ahead.',
    clearPath: 'Path is clear, move ahead.',
    camError: 'Please allow camera permissions',
    netError: 'Turn on internet, model failed to load.'
  },
  'hi-IN': {
    loading: 'सेंसर चालू हो रहा है।',
    started: 'स्मार्ट केन चालू हो गया है। अब मैं रास्ते के बारे में बताती रहूंगी।',
    stopClose: 'रुक जाइए, सामने रुकावट है।',
    clearPath: 'रास्ता साफ़ है, आगे बढ़ें।',
    camError: 'कृपया कैमरे की अनुमति दें',
    netError: 'इंटरनेट चालू करें, मॉडल लोड नहीं हुआ।'
  },
  'ar-SA': {
    loading: 'جاري تشغيل المستشعر.',
    started: 'تم تشغيل العصا الذكية. سأستمر في إعلامك بالطريق.',
    stopClose: 'توقف، توجد عقبة أمامك.',
    clearPath: 'الطريق نظيف، تقدم للأمام.',
    camError: 'يرجى السماح بإذن الكاميرا',
    netError: 'قم بتشغيل الإنترنت، لم يتم تحميل النموذج.'
  },
  'pa-IN': {
    loading: 'ਸੈਂਸਰ ਚਾਲੂ ਹੋ ਰਿਹਾ ਹੈ।',
    started: 'ਸਮਾਰਟ ਕੈਨ ਚਾਲੂ ਹੋ ਗਿਆ ਹੈ। ਮੈਂ ਰਸਤੇ ਬਾਰੇ ਦੱਸਦੀ ਰਹਾਂਗੀ।',
    stopClose: 'ਰੁਕ ਜਾਓ, ਸਾਹਮਣੇ ਰੁਕਾਵਟ ਹੈ।',
    clearPath: 'ਰਸਤਾ ਸਾਫ਼ ਹੈ, ਅੱਗੇ ਵਧੋ।',
    camError: 'ਕਿਰਪਾ ਕਰਕੇ ਕੈਮਰੇ ਦੀ ਇਜਾਜ਼ਤ ਦਿਓ',
    netError: 'ਇੰਟਰਨੈਟ ਚਾਲੂ ਕਰੋ, ਮਾਡਲ ਲੋਡ ਨਹੀਂ ਹੋਇਆ।'
  },
  'ps-PK': {
    loading: 'سنډر چالان کیږي.',
    started: 'سمارټ کین چالان شو. زه به تاسو ته د لارې په اړه خبر درکړم.',
    stopClose: 'وګرځئ، مخکې خنډ شته.',
    clearPath: 'لاره پاکه ده، مخکې لاړ شئ.',
    camError: 'مهرباني وکړئ د کامرې اجازه ورکړئ',
    netError: 'انټرنیټ چالان کړئ، ماډل بار نشو.'
  },
  'sd-PK': {
    loading: 'سينسر چالو ٿي رهيو آهي.',
    started: 'سمارٽ ڪين چالو ٿي ويو آهي. مان توهان کي رستي بابت ٻڌائيندي رهندس.',
    stopClose: 'بيهي وڃو، سامهون رڪاوٽ آهي.',
    clearPath: 'رستو صاف آهي، اڳيان وڌو.',
    camError: 'مهرباني ڪري ڪمري جي اجازت ڏيو',
    netError: 'انٽرنيٽ چالو ڪريو، ماڊل لوڊ نه ٿيو.'
  }
};

function getMsg(key) {
  const lang = langSel.value;
  if(translations[lang] && translations[lang][key]) {
    return translations[lang][key];
  }
  return translations['en-US'][key] || key;
}

function speakText(t){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=langSel.value; 
  u.rate=1.0;
  window.speechSynthesis.speak(u);
}

function playHurdleTone(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.3);
    o.start(); o.stop(audioCtx.currentTime+0.3);
  }catch(e){}
}

// Extremely loud, sharp high-gain beep for clear path alert
function playClearTone(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=750;
    o.type='triangle';
    g.gain.setValueAtTime(0.85, audioCtx.currentTime); // Maximum volume loudness
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.45);
    o.start(); o.stop(audioCtx.currentTime+0.45);
  }catch(e){}
}

function vibrateHurdle(){
  if(!navigator.vibrate) return;
  navigator.vibrate([300,100,300]);
}

async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream; await video.play(); return true;
  }catch(e){
    try{ 
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); 
      video.srcObject = stream; await video.play(); return true; 
    }catch(e2){
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream; await video.play(); return true;
      }catch(e3){
        speakText(getMsg('camError')); return false;
      }
    }
  }
}

function getScreenInfo(){
  if(!video.videoWidth) return {variance:100, change:0};
  const c=document.createElement('canvas'); c.width=60; c.height=45;
  const ctx=c.getContext('2d'); ctx.drawImage(video,0,0,60,45);
  const d=ctx.getImageData(0,0,60,45).data;
  let avg=0; for(let i=0;i<d.length;i+=4){ avg+=(d[i]+d[i+1]+d[i+2])/3; } avg=avg/(60*45);
  let variance=0; for(let i=0;i<d.length;i+=4){ variance+=Math.abs((d[i]+d[i+1]+d[i+2])/3 - avg); } variance=variance/(60*45);
  let change=Math.abs(avg - lastAvg); lastAvg=avg;
  return {variance, change};
}

async function detectLoop(){
  if(!isLive || !model || !video.videoWidth) {
    if(isLive) requestAnimationFrame(detectLoop);
    return;
  }

  let found = [];
  try{
    const preds = await model.detect(video);
    found = preds.filter(p => p.score > 0.35);
  }catch(e){}

  const info = getScreenInfo();
  const isWall = info.variance < 20;
  let speakMsg = "", currentCategory = "clear", hasHurdle = false;

  if(found.length > 0 || isWall || info.change > 15){
    speakMsg = getMsg('stopClose');
    currentCategory = "hurdle";
    hasHurdle = true;
  } else {
    speakMsg = getMsg('clearPath');
    currentCategory = "clear";
    hasHurdle = false;
  }

  // Instant response as soon as window/category changes (hurdle <-> clear path)
  if (currentCategory !== lastAnnouncedCategory) {
    lastAnnouncedCategory = currentCategory;
    lastSpoken = speakMsg;
    
    if(hasHurdle){
      playHurdleTone();
      vibrateHurdle();
    } else {
      playClearTone(); // Extremely loud distinct tone for clear path
    }
    speakText(speakMsg);
  }

  if(isLive) {
    setTimeout(() => requestAnimationFrame(detectLoop), 250); // Ultra-fast loop for immediate detection update
  }
}

document.getElementById('startBtn').addEventListener('click', async ()=>{
  statusEl.innerText="STATUS: LOADING...";
  speakText(getMsg('loading'));
  if(!await ensureCamera()) return;
  try{ if(!model) model = await cocoSsd.load(); }
  catch(e){ speakText(getMsg('netError')); return; }
  isLive = true;
  statusEl.innerText="STATUS: LIVE";
  document.getElementById('startBtn').style.display="none";
  document.getElementById('stopBtn').style.display="block";
  speakText(getMsg('started'));
  requestAnimationFrame(detectLoop);
});

document.getElementById('stopBtn').addEventListener('click', ()=>{
  isLive = false; 
  if(stream) stream.getTracks().forEach(t => t.stop());
  stream = null; video.srcObject = null;
  window.speechSynthesis.cancel();
  statusEl.innerText="STATUS: OFF";
  document.getElementById('startBtn').style.display="block";
  document.getElementById('stopBtn').style.display="none";
});

document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q = document.getElementById('destinationInput').value.trim();
  if(!q){ speakText('Pehle upar likhen kahan jana hai.'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
