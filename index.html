<script>
const video = document.getElementById('webcam');
const statusEl = document.getElementById('status');
const langSel = document.getElementById('voiceLanguage');
const micBtn = document.getElementById('micBtn');

let stream = null, isLive = false, audioCtx = null;
let lastSpokenTime = 0;
let waitingForUserReady = false;

const translations = {
  'ur-PK': {
    loading: 'سنسور آن ہو رہا ہے۔',
    started: 'اسمارٹ کین آن ہو گیا ہے۔ رکاوٹیں تلاش کی جا رہی ہیں۔',
    camError: 'کیمرہ کی اجازت دیں',
    clear: 'رستہ بالکل صاف ہے، آگے بڑھیں۔',
    readyPrompt: 'کیا آپ چلنے کے لیے تیار ہیں؟ مائیک کا بٹن دبائیں اور بولیں۔',
    safeLeft: 'بائیں طرف راستہ صاف ہے، بائیں طرف موڑ لیں۔',
    safeRight: 'دائیں طرف راستہ صاف ہے، دائیں طرف موڑ لیں۔',
    safeStraight: 'آگے رستہ صاف ہے، آگے بڑھیں۔',
    obstacleAlert: 'تنبيه! سامنے رکاوٹ یا قریبی دیوار موجود ہے، رک جائیں۔'
  },
  'en-US': {
    loading: 'Sensor is turning on.',
    started: 'Smart Cane is on. Scanning obstacles.',
    camError: 'Please allow camera permissions',
    clear: 'Path is clear, move ahead.',
    readyPrompt: 'Are you ready to walk? Press mic button and speak.',
    safeLeft: 'Left side is clear, turn left.',
    safeRight: 'Right side is clear, turn right.',
    safeStraight: 'Path ahead is clear, move straight.',
    obstacleAlert: 'Warning! Close obstacle or wall ahead, stop.'
  }
};

function getMsg(key) {
  const lang = langSel.value;
  if(translations[lang] && translations[lang][key]) {
    return translations[lang][key];
  }
  return translations['en-US'][key] || key;
}

function speakText(t){
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = langSel.value; 
  u.rate = 1.0;
  window.speechSynthesis.speak(u);
}

function playHurdleTone(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
    o.start(); o.stop(audioCtx.currentTime + 0.4);
  }catch(e){}
}

function playClearTone(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 750;
    o.type = 'triangle';
    g.gain.setValueAtTime(0.5, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    o.start(); o.stop(audioCtx.currentTime + 0.3);
  }catch(e){}
}

function vibrateHurdle(){
  if(!navigator.vibrate) return;
  navigator.vibrate([400, 150, 400]);
}

async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream; await video.play(); return true;
  }catch(e){
    try{ 
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); 
      video.srcObject = stream; await video.play(); return true; 
    }catch(e2){
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream; await video.play(); return true;
      }catch(e3){
        speakText(getMsg('camError')); return false;
      }
    }
  }
}

function getScreenInfo(){
  if(!video.videoWidth) return {leftAvg: 100, rightAvg: 100, centerBrightness: 100};
  const c = document.createElement('canvas'); c.width = 60; c.height = 45;
  const ctx = c.getContext('2d'); ctx.drawImage(video, 0, 0, 60, 45);
  const d = ctx.getImageData(0, 0, 60, 45).data;
  
  let leftSum = 0, rightSum = 0, centerSum = 0;

  for(let y = 0; y < 45; y++){
    for(let x = 0; x < 60; x++){
      let idx = (y * 60 + x) * 4;
      let brightness = (d[idx] + d[idx+1] + d[idx+2]) / 3;
      if(x < 22) leftSum += brightness;
      else if(x > 38) rightSum += brightness;
      else centerSum += brightness;
    }
  }

  return {
    leftAvg: leftSum / (22 * 45),
    rightAvg: rightSum / (22 * 45),
    centerBrightness: centerSum / (16 * 45)
  };
}

function startVoiceRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    speakText("Speech recognition not supported.");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = langSel.value;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    const speechResult = event.results[0][0].transcript.toLowerCase();
    statusEl.innerText = "HEARD: " + speechResult;
    waitingForUserReady = false;
    micBtn.style.display = "none";
    
    const info = getScreenInfo();
    if (info.leftAvg > info.rightAvg + 12) {
      speakText(getMsg('safeLeft'));
      statusEl.innerText = "SAFE SIDE: LEFT";
    } else if (info.rightAvg > info.leftAvg + 12) {
      speakText(getMsg('safeRight'));
      statusEl.innerText = "SAFE SIDE: RIGHT";
    } else {
      speakText(getMsg('safeStraight'));
      statusEl.innerText = "SAFE SIDE: STRAIGHT";
    }
  };

  recognition.onerror = () => {
    waitingForUserReady = false;
    micBtn.style.display = "none";
  };

  recognition.start();
}

micBtn.addEventListener('click', () => {
  startVoiceRecognition();
});

async function detectLoop(){
  if(!isLive) return;

  if(!video.videoWidth) {
    requestAnimationFrame(detectLoop);
    return;
  }

  if (waitingForUserReady) {
    if(isLive) setTimeout(() => requestAnimationFrame(detectLoop), 500);
    return;
  }

  const info = getScreenInfo();
  let now = Date.now();

  // اگر کیمرے کے سامنے ہاتھ رکھا جائے، دروازہ یا دیوار بالکل قریب ہو (سینٹر ڈارک یا بلاک ہو جائے)
  let isCloseObstacle = (info.centerBrightness < 35);

  if (isCloseObstacle && now - lastSpokenTime > 3500) {
    let alertText = getMsg('obstacleAlert');
    lastSpokenTime = now;
    playHurdleTone();
    vibrateHurdle();
    speakText(alertText);
    statusEl.innerText = "OBSTACLE DETECTED: STOP";

    waitingForUserReady = true;
    micBtn.style.display = "block";
    setTimeout(() => {
      speakText(getMsg('readyPrompt'));
    }, 2000);

  } else if (!isCloseObstacle && now - lastSpokenTime > 4000) {
    let clearText = getMsg('clear');
    lastSpokenTime = now;
    playClearTone();
    speakText(clearText);
    statusEl.innerText = "STATUS: GO AHEAD - CLEAR";
  }

  if(isLive) {
    setTimeout(() => requestAnimationFrame(detectLoop), 250);
  }
}

document.getElementById('startBtn').addEventListener('click', async () => {
  statusEl.innerText = "STATUS: LOADING...";
  speakText(getMsg('loading'));
  
  if(!await ensureCamera()) {
    statusEl.innerText = "STATUS: OFF";
    return;
  }

  isLive = true;
  statusEl.innerText = "STATUS: LIVE";
  document.getElementById('startBtn').style.display = "none";
  document.getElementById('stopBtn').style.display = "block";
  speakText(getMsg('started'));
  requestAnimationFrame(detectLoop);
});

document.getElementById('stopBtn').addEventListener('click', () => {
  isLive = false; 
  if(stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  stream = null; 
  video.srcObject = null;
  window.speechSynthesis.cancel();
  waitingForUserReady = false;
  micBtn.style.display = "none";
  statusEl.innerText = "STATUS: OFF";
  document.getElementById('startBtn').style.display = "block";
  document.getElementById('stopBtn').style.display = "none";
});

document.getElementById('openMapsBtn').addEventListener('click', () => {
  const q = document.getElementById('destinationInput').value.trim();
  if(!q){ 
    speakText('Pehle upar likhen kahan jana hai.'); 
    return; 
  }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, '_blank');
});
</script>
