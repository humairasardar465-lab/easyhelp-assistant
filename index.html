<script>
const video = document.getElementById('webcam');
const statusEl = document.getElementById('status');
const langSel = document.getElementById('voiceLanguage');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const openMapsBtn = document.getElementById('openMapsBtn');
const destinationInput = document.getElementById('destinationInput');

let stream = null, isLive = false, objectDetector = null, lastSpoken = "", lastSpeakTime = 0;

const translations = {
  'ur-PK': {
    loading: 'سنسور آن ہو رہا ہے۔',
    started: 'اسمارٹ کین آن ہے۔',
    stopClose: 'رک جائیں، رکاوٹ!',
    clearPath: 'رستہ صاف ہے!',
    camError: 'کیمرہ کی اجازت دیں',
    netError: 'انٹرنیٹ یا ماڈل لوڈنگ کا مسئلہ'
  },
  'en-US': {
    loading: 'Sensor turning on.',
    started: 'Smart Cane is on.',
    stopClose: 'Stop, obstacle!',
    clearPath: 'Path is clear!',
    camError: 'Allow camera access',
    netError: 'Internet or model loading issue'
  },
  'hi-IN': {
    loading: 'सेंसर चालू हो रहा है।',
    started: 'स्मार्ट केन चालू है।',
    stopClose: 'रुकिए, रुकावट!',
    clearPath: 'रास्ता साफ़ है!',
    camError: 'कैमरा अनुमति दें',
    netError: 'इंटरनेट या मॉडल समस्या'
  },
  'ar-SA': {
    loading: 'جاري تشغيل المستشعر.',
    started: 'العصا الذكية تعمل.',
    stopClose: 'توقف، عقبة!',
    clearPath: 'الطريق نظيف!',
    camError: 'السماح بالكاميرا',
    netError: 'مشكلة في الإنترنت أو النموذج'
  },
  'pa-IN': {
    loading: 'ਸੈਂਸਰ ਚਾਲੂ ਹੋ ਰਿਹਾ ਹੈ।',
    started: 'ਸਮਾਰਟ ਕੇਨ ਚਾਲੂ ਹੈ।',
    stopClose: 'ਰੁਕ ਜਾਓ, ਰੁਕਾਵਟ!',
    clearPath: 'ਰਸਤਾ ਸਾਫ਼ ਹੈ!',
    camError: 'ਕੈਮਰਾ ਅਨੁਮਤੀ ਦਿਓ',
    netError: 'ਇੰਟਰਨੈਟ ਜਾਂ ਮਾਡਲ ਸਮੱਸਿਆ'
  }
};

function getT(key) {
  const lang = langSel.value;
  if (translations[lang] && translations[lang][key]) {
    return translations[lang][key];
  }
  return translations['en-US'][key] || key;
}

function speak(text) {
  if (!text) return;
  const now = Date.now();
  if (text === lastSpoken && now - lastSpeakTime < 4000) return;
  lastSpoken = text;
  lastSpeakTime = now;

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = langSel.value;
    window.speechSynthesis.speak(utterance);
  }
}

async function initDetector() {
  if (objectDetector) return;
  try {
    statusEl.innerText = getT('loading');
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm"
    );
    objectDetector = await ObjectDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
        delegate: "GPU"
      },
      scoreThreshold: 0.5,
      runningMode: "VIDEO"
    });
  } catch (err) {
    console.error(err);
    statusEl.innerText = getT('netError');
  }
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      isLive = true;
      statusEl.innerText = getT('started');
      speak(getT('started'));
      startBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      window.requestAnimationFrame(predictWebcam);
    };
  } catch (err) {
    console.error(err);
    statusEl.innerText = getT('camError');
    speak(getT('camError'));
  }
}

let lastVideoTime = -1;
async function predictWebcam() {
  if (!isLive || !objectDetector) return;

  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;
    try {
      const startTimeMs = performance.now();
      const detections = objectDetector.detectForVideo(video, startTimeMs);

      if (detections && detections.detections && detections.detections.length > 0) {
        const closest = detections.detections[0];
        const category = closest.categories[0].categoryName;
        const confidence = Math.round(closest.categories[0].score * 100);
        
        if (confidence > 45) {
          statusEl.innerText = `${getT('stopClose')} (${category})`;
          speak(`${getT('stopClose')} ${category}`);
        }
      } else {
        statusEl.innerText = getT('clearPath');
      }
    } catch (e) {
      console.error(e);
    }
  }

  if (isLive) {
    window.requestAnimationFrame(predictWebcam);
  }
}

function stopCamera() {
  isLive = false;
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
  statusEl.innerText = "STATUS: OFF";
  startBtn.style.display = 'block';
  stopBtn.style.display = 'none';
}

startBtn.addEventListener('click', async () => {
  await initDetector();
  await startCamera();
});

stopBtn.addEventListener('click', () => {
  stopCamera();
});

openMapsBtn.addEventListener('click', () => {
  const dest = destinationInput.value.trim();
  if (dest) {
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank');
  } else {
    window.open(`https://www.google.com/maps`, '_blank');
  }
});
</script>
