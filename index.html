<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart King Assistant</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0f1e;color:#fff;margin:0;padding:16px}
.top{max-width:620px;margin:auto;background:#111827;padding:22px;border-radius:16px;text-align:left}
h2{text-align:center;color:#00ffcc;margin:0;font-size:24px}
.creator{text-align:center;font-size:12px;color:#94a3b8;margin:6px 0 16px}
label{display:block;color:#00ffcc;font-size:13px;font-weight:700;margin:14px 0 6px;text-transform:uppercase}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
video{width:100%;height:300px;border-radius:12px;background:#000;object-fit:cover;margin-top:12px;border:2px solid #00ffcc}
button{border:none;padding:13px;font-size:15px;border-radius:10px;cursor:pointer;margin-top:10px;font-weight:700;width:100%}
.btn-main{background:#00ffcc;color:#000}
.btn-map{background:#0284c7;color:#fff}
.btn-voice{background:#d97706;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
#output{margin-top:14px;padding:12px;background:#1f2937;border-radius:10px;min-height:60px;font-size:15px;text-align:right;white-space:pre-wrap}
.status{text-align:center;margin:10px 0;font-size:13px;font-weight:700}
#debug{font-size:11px;color:#fbbf24;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="top">
<h2>👑 SMART KING ASSISTANT</h2>
<div class="creator">Created by Humaira Sardar | EasyHelp Smart Cane & GPS</div>
<div class="status"><span id="liveStatus">OFF</span></div>

<label>Select Language</label>
<select id="voiceLanguage">
<option value="ur-PK" selected>Urdu - اردو</option>
<option value="en-US">English</option>
<option value="hi-IN">Hindi - हिंदी</option>
<option value="ar-SA">Arabic - العربية</option>
<option value="pa-IN">Punjabi - ਪੰਜਾਬੀ</option>
<option value="sd-PK">Sindhi - سنڌي</option>
<option value="ps-PK">Pashto - پښتو</option>
<option value="bal-PK">Balochi - بلوچی</option>
<option value="fa-IR">Persian - فارسی</option>
<option value="bn-BD">Bengali - বাংলা</option>
<option value="tr-TR">Turkish - Türkçe</option>
<option value="fr-FR">French - Français</option>
<option value="de-DE">German - Deutsch</option>
<option value="es-ES">Spanish - Español</option>
<option value="zh-CN">Chinese - 中文</option>
<option value="ja-JP">Japanese - 日本語</option>
<option value="ko-KR">Korean - 한국어</option>
</select>

<label>Destination Search</label>
<input type="text" id="destinationInput" placeholder="Enter destination...">
<button id="openMapsBtn" class="btn-map">Open Maps</button>

<hr style="border:0;border-top:1px solid #374151;margin:18px 0">

<label>Live Camera</label>
<button id="startBtn" class="btn-main">Start Live Mode</button>
<button id="voiceBtn" class="btn-voice">Voice Command</button>
<button id="stopBtn" class="btn-stop" style="display:none;">Stop Live</button>

<video id="webcam" autoplay playsinline muted></video>
<div id="debug">Camera yahan nazar aayega</div>
<canvas id="canvas" style="display:none;"></canvas>
<div id="output"></div>
</div>

<script>
const video=document.getElementById('webcam');
const canvas=document.getElementById('canvas');
const output=document.getElementById('output');
const debug=document.getElementById('debug');
const voiceLanguageSelect=document.getElementById('voiceLanguage');
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
const liveStatus=document.getElementById('liveStatus');
let autoTimer=null, stream=null, isLive=false, isPaused=false, isThinking=false;

const API_KEY = "AIzaSyDI5btsG8Wu77sAj8gI9Ug8E_9Lr_FvN5A";

function getLangName(){
  const sel=voiceLanguageSelect;
  return sel.options[sel.selectedIndex].text.split(' - ')[0];
}
function getLangCode(){ return voiceLanguageSelect.value; }

function speakText(text){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=getLangCode();
  u.rate=0.95;
  // Is zuban ki awaz dhoondo
  const voices=window.speechSynthesis.getVoices();
  let v=voices.find(v=>v.lang===getLangCode());
  if(!v) v=voices.find(v=>v.lang && v.lang.startsWith(getLangCode().split('-')[0]));
  if(v) u.voice=v;
  window.speechSynthesis.speak(u);
  output.innerText=text;
}
window.speechSynthesis.onvoiceschanged=()=>{};

async function ensureCameraOn(){
  if(stream && video.srcObject) return true;
  try{
    debug.innerText="Camera on kar rahi hoon... Allow dabayein";
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
    catch(e){ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    video.srcObject=stream;
    await video.play();
    debug.innerText="Camera ON hai - ab aapko video me sab nazar aayega";
    return true;
  }catch(e){
    debug.innerText="Camera BLOCK hai! Chrome ke upar Lock par click kar ke Camera Allow karein";
    speakText('Camera block hai, please Chrome me Lock par click kar ke Camera Allow karein');
    return false;
  }
}

async function askGemini(question, withImage=null){
  const langName=getLangName();
  let prompt="";
  if(withImage){
    // BEST PROMPT - Isi wajah se ab wohi zuban bolega
    prompt=`You are Smart King Assistant. CRITICAL RULE: You MUST answer ONLY in ${langName} language. You are FORBIDDEN to use English. If user selected ${langName}, your entire answer must be in ${langName}, 100%. No English word at all. Now look at this LIVE camera image for a blind person. Tell in 1 short line in ${langName} what is in front. Describe ANY object - person, bike, car, wall, stairs, dog, hole, table, tree, shop, road. If obstacle close, say STOP in ${langName}. If clear, say CLEAR in ${langName}.`;
  } else {
    prompt=`You are Smart King Assistant, created by Humaira Sardar. CRITICAL RULE: You MUST answer ONLY in ${langName}. FORBIDDEN to use English if language is ${langName}. Your entire answer must be in ${langName}. User asked: "${question}". Answer in ${langName} in 1-2 short lines, spoken style. If user asks what can you do, say in ${langName}: I can guide you with camera, tell what is in front, give directions, open maps, and talk with you. Never mention Google or Gemini.`;
  }
  let parts=[{text:prompt}];
  if(withImage) parts.push({inline_data:{mime_type:"image/jpeg",data:withImage}});
  try{
    // Model badal diya - 1.5-flash har Key par chalta hai
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts}]})
    });
    const data=await res.json();
    if(data.error){
      debug.innerText="API Error: "+data.error.message;
      return null;
    }
    if(data.candidates && data.candidates[0].content){
      return data.candidates[0].content.parts[0].text;
    }
    return null;
  }catch(e){ debug.innerText="Internet Error: "+e.message; return null; }
}

async function analyzeCamera(){
  if(!isLive || isPaused || isThinking) return;
  const camOk=await ensureCameraOn();
  if(!camOk) return;
  isThinking=true;
  debug.innerText="Camera dekh rahi hoon...";
  canvas.width=video.videoWidth||640;
  canvas.height=video.videoHeight||480;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const base64Image=canvas.toDataURL('image/jpeg',0.7).split(',')[1];
  const ans=await askGemini("What is in front?", base64Image);
  if(ans){
    debug.innerText="Camera dekh liya - jawab aa gaya";
    speakText(ans);
  } else {
    debug.innerText="Jawab nahi aaya - dobara koshish kar rahi hoon";
    speakText(getLangName()==='Urdu' ? 'Thora ruk jayein, dobara dekh rahi hoon.' : 'Wait, checking again.');
  }
  isThinking=false;
}

async function startAutoLive(){
  if(isLive) return;
  const camOk=await ensureCameraOn();
  if(!camOk) return;
  isLive=true; isPaused=false;
  liveStatus.innerText="LIVE - "+getLangName();
  startBtn.style.display="none"; stopBtn.style.display="block";
  const langName=getLangName();
  if(langName==='Urdu') speakText('Live on ho gaya hai, ab main camera se dekh kar bataungi samne kya hai.');
  else if(langName==='Arabic') speakText('تم تشغيل الوضع المباشر، سأخبرك بما أراه أمامك.');
  else if(langName==='Hindi') speakText('Live on ho gaya hai, ab main camera se dekh kar bataungi.');
  else speakText('Live is on in '+langName);
  setTimeout(analyzeCamera, 1000);
  autoTimer=setInterval(analyzeCamera, 5000);
}

function stopLive(){
  isLive=false; if(autoTimer) clearInterval(autoTimer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null;
  window.speechSynthesis.cancel();
  liveStatus.innerText="OFF";
  startBtn.style.display="block"; stopBtn.style.display="none";
  debug.innerText="Camera band hai";
}
startBtn.addEventListener('click', startAutoLive);
stopBtn.addEventListener('click', stopLive);

document.getElementById('voiceBtn').addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ speakText('Please use Chrome'); return; }
  const rec=new SR();
  // Aap Urdu bolengi to woh Urdu hi sunega, chahe upar Arabic laga ho
  rec.lang='ur-PK';
  rec.onresult=async (e)=>{
    const q=e.results[0][0].transcript;
    const lower=q.toLowerCase();
    output.innerText='Aap ne kaha: '+q;
    if(lower.includes('رک') || lower.includes('stop') || lower.includes('ruk')){
      isPaused=true; speakText(getLangName()==='Urdu' ? 'Theek hai, main ruk gayi hoon.' : 'Okay, I stopped.'); return;
    }
    if(lower.includes('چلو') || lower.includes('start') || lower.includes('chalo')){
      isPaused=false; speakText(getLangName()==='Urdu' ? 'Theek hai, phir chalte hain.' : 'Okay, lets go.'); return;
    }
    if(lower.includes('سامنے') || lower.includes('samne') || lower.includes('what') || lower.includes('کیا ہے') || lower.includes('kya hai') || lower.includes('dekho') || lower.includes('batao')){
      if(!isLive){ isLive=true; liveStatus.innerText="LIVE - "+getLangName(); startBtn.style.display="none"; stopBtn.style.display="block"; }
      isPaused=false;
      debug.innerText="Camera dekh rahi hoon...";
      setTimeout(analyzeCamera, 700);
      return;
    }
    output.innerText='Jawab la rahi hoon...';
    const ans=await askGemini(q);
    if(ans){ speakText(ans); }
    else{ speakText('Dobara bolein, internet slow hai.'); }
  };
  rec.start();
  speakText(getLangName()==='Urdu' ? 'Ji bolein, main sun rahi hoon.' : 'Yes, I am listening.');
});

document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q=document.getElementById('destinationInput').value.trim();
  if(!q){ speakText('Please enter destination first.'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
</body>
</html>
