<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Cane - Mobile Is Your Eye</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@latest"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#0a0f1e;color:#fff;margin:0;padding:16px}
.top{max-width:620px;margin:auto;background:#111827;padding:22px;border-radius:16px}
h2{text-align:center;color:#00ffcc;margin:0;letter-spacing:1px}
.sub{text-align:center;font-size:12px;color:#94a3b8;margin:6px 0 14px}
label{display:block;color:#00ffcc;font-size:13px;font-weight:700;margin:14px 0 6px}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
video{width:100%;height:320px;border-radius:12px;background:#000;object-fit:cover;margin-top:12px;border:3px solid #00ffcc}
button{border:none;padding:14px;font-size:16px;border-radius:10px;cursor:pointer;margin-top:10px;font-weight:700;width:100%}
.btn-main{background:#00ffcc;color:#000}
.btn-voice{background:#d97706;color:#fff}
.btn-map{background:#0284c7;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
#status{text-align:center;margin:10px 0;font-weight:700;font-size:14px}
</style>
</head>
<body>
<div class="top">
<h2>SMART CANE</h2>
<div class="sub">MOBILE IS YOUR EYE</div>

<label>SELECT LANGUAGE</label>
<select id="voiceLanguage">
<option value="ur-PK" selected>Urdu</option>
<option value="en-US">English</option>
<option value="hi-IN">Hindi</option>
<option value="ar-SA">Arabic</option>
<option value="pa-IN">Punjabi</option>
<option value="ps-PK">Pashto</option>
<option value="sd-PK">Sindhi</option>
</select>

<label>DESTINATION</label>
<input type="text" id="destinationInput" placeholder="e.g. Okara Bazar">
<button id="openMapsBtn" class="btn-map">OPEN MAPS</button>

<div id="status">STATUS: OFF</div>

<button id="startBtn" class="btn-main">START - SENSOR ON</button>
<button id="voiceBtn" class="btn-voice">VOICE COMMAND</button>
<button id="stopBtn" class="btn-stop" style="display:none;">STOP</button>

<video id="webcam" autoplay playsinline muted></video>
</div>

<script>
const video=document.getElementById('webcam');
const statusEl=document.getElementById('status');
const langSel=document.getElementById('voiceLanguage');
let stream=null, isLive=false, model=null, timer=null, lastSpoken="", lastSpeakTime=0, audioCtx=null, lastAvg=0, rememberedObj=null, rememberedTime=0;

function speakText(t){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=langSel.value; u.rate=1.0;
  window.speechSynthesis.speak(u);
}
function playTone(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(0.18, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.3);
    o.start(); o.stop(audioCtx.currentTime+0.3);
  }catch(e){}
}
function vibrateLevel(level){
  if(!navigator.vibrate) return;
  if(level===3) navigator.vibrate([400,100,400,100,400]);
  else if(level===2) navigator.vibrate([200,100,200]);
  else if(level===1) navigator.vibrate([100]);
}
async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    video.srcObject=stream; await video.play(); return true;
  }catch(e){
    try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); video.srcObject=stream; await video.play(); return true; }
    catch(e2){ speakText('Camera ki ijazat dein'); return false; }
  }
}
function getScreenInfo(){
  if(!video.videoWidth) return {variance:100, change:0};
  const c=document.createElement('canvas'); c.width=60; c.height=45;
  const ctx=c.getContext('2d'); ctx.drawImage(video,0,0,60,45);
  const d=ctx.getImageData(0,0,60,45).data;
  let avg=0; for(let i=0;i<d.length;i+=4){ avg+=(d[i]+d[i+1]+d[i+2])/3; } avg=avg/(60*45);
  let variance=0; for(let i=0;i<d.length;i+=4){ variance+=Math.abs((d[i]+d[i+1]+d[i+2])/3 - avg); } variance=variance/(60*45);
  let change=Math.abs(avg - lastAvg); lastAvg=avg;
  return {variance, change};
}
async function detectNow(){
  if(!model) return;
  if(!video.videoWidth) return;
  const now=Date.now();
  let found=[];
  try{
    const preds=await model.detect(video);
    found=preds.filter(p=>p.score>0.35);
    found.sort((a,b)=>(b.bbox[2]*b.bbox[3])-(a.bbox[2]*a.bbox[3]));
  }catch(e){}
  const info=getScreenInfo();
  const isWall = info.variance < 20;
  let speakMsg="", level=0;
  // Yaad rakhne wala sensor - agar pehle dekhi thi to ab bhi yaad rakhega
  if(found.length>0){
    rememberedObj=found[0].class; rememberedTime=now;
    const box=found[0].bbox;
    const areaPercent=(box[2]*box[3])/(video.videoWidth*video.videoHeight)*100;
    if(areaPercent>25){ speakMsg="Ruk jayen, rukawat bahut qareeb hai, aadha meter par hai."; level=3; }
    else if(areaPercent>10){ speakMsg="Samne rukawat hai, 1 meter door hai, aahista baien ho jayen."; level=2; }
    else { speakMsg="Samne rukawat hai, 2 meter door hai, aahista chalen."; level=1; }
  } else if(isWall){
    // Qareeb wali cheez - naam nahi, sirf rukawat
    speakMsg="Ruk jayen, samne bari rukawat bilkul qareeb hai, aadha meter par hai."; level=3;
  } else if(now - rememberedTime < 5000 && rememberedObj){
    // Pehle dekhi thi, ab aadhi nazar aa rahi hai, phir bhi bhoolna nahi
    speakMsg="Wohi rukawat ab qareeb aa gayi hai, 1 meter par hai, ruk jayen."; level=2;
  } else if(info.change > 15){
    speakMsg="Ruk jayen, samne achanak koi rukawat aayi hai, 1 meter par hai."; level=2;
  } else {
    // Kuch nahi - Steps wala system, chup nahi hoga, batata rahega
    speakMsg="Rasta saaf hai, aahista seedhe chalte jayen."; level=0;
  }
  // Har 3 second me bolo, bar bar nahi
  if(speakMsg!==lastSpoken || now-lastSpeakTime>3000){
    lastSpoken=speakMsg; lastSpeakTime=now;
    if(level>0){ playTone(); vibrateLevel(level); }
    speakText(speakMsg);
  }
}
document.getElementById('startBtn').addEventListener('click', async ()=>{
  statusEl.innerText="STATUS: LOADING...";
  speakText('Sensor on ho raha hai.');
  if(!await ensureCamera()) return;
  try{ if(!model) model=await cocoSsd.load(); }
  catch(e){ speakText('Internet on karein, model load nahi hua.'); return; }
  isLive=true;
  statusEl.innerText="STATUS: LIVE";
  document.getElementById('startBtn').style.display="none";
  document.getElementById('stopBtn').style.display="block";
  speakText('Smart Cane on ho gaya hai. Ab main batati rahungi rukawat kitni door hai.');
  timer=setInterval(detectNow, 3000);
});
document.getElementById('stopBtn').addEventListener('click', ()=>{
  isLive=false; clearInterval(timer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null;
  window.speechSynthesis.cancel();
  statusEl.innerText="STATUS: OFF";
  document.getElementById('startBtn').style.display="block";
  document.getElementById('stopBtn').style.display="none";
});
document.getElementById('voiceBtn').addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  const rec=new SR(); rec.lang='ur-PK';
  rec.onresult=(e)=>{
    const q=e.results[0][0].transcript;
    if(q.includes('samne')||q.includes('kya hai')){ speakText('Rukiye, dekh kar batati hoon.'); setTimeout(detectNow,600); }
    else speakText('Main sun rahi hoon.');
  };
  rec.start(); speakText('Ji bolein.');
});
document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q=document.getElementById('destinationInput').value.trim();
  if(!q){ speakText('Pehle upar likhen kahan jana hai.'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
</body>
</html>
