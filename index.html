<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<title>Smart Cane</title>
<script type="module">
import {FilesetResolver,ObjectDetector} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/+esm";
window.FilesetResolver=FilesetResolver;window.ObjectDetector=ObjectDetector;
window.dispatchEvent(new Event('mediapipe-loaded'));
</script>
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;gap:8px;padding:10px;box-sizing:border-box;touch-action:manipulation}
h1{margin:0;text-align:center;color:#00ffcc;font-size:24px;letter-spacing:1px}
.settings{display:flex;flex-direction:column;gap:4px}
label{font-size:13px;color:#38bdf8}
select{width:100%;padding:10px;border-radius:10px;border:1px solid #374151;background:#111827;color:#fff;font-size:15px}
#status{text-align:center;font-size:17px;font-weight:700;color:#38bdf8;min-height:48px;display:flex;align-items:center;justify-content:center;background:#111;border-radius:8px;padding:5px}
video{width:96px;height:72px;object-fit:cover;align-self:center;border-radius:8px}
body.saver video{width:32px;height:24px}
.btns{flex:1;display:flex;flex-direction:column;gap:8px}
button{flex:1;border:0;border-radius:16px;font-size:22px;font-weight:700;color:#fff;cursor:pointer}
button:active{filter:brightness(1.4)}
#ok{background:#16a34a}#cancel{background:#dc2626}#back{background:#2563eb}
#ios-motion{background:#d97706;display:none;padding:12px;border-radius:12px;font-size:16px;font-weight:bold}
#note{font-size:12px;color:#94a3b8;text-align:center}
</style>
</head>
<body>
<h1>Smart Cane</h1>
<div class="settings">
  <label for="lang">Select Language / Voice:</label>
  <select id="lang" aria-label="Language"></select>
</div>
<div id="status">Smart Cane is ready. Press OK to begin.</div>
<button id="ios-motion">Enable iOS Motion Sensors</button>
<video id="cam" autoplay playsinline muted aria-hidden="true"></video>
<div class="btns">
  <button id="ok">OK / Confirm</button>
  <button id="cancel">Cancel / Stop</button>
  <button id="back">Back / Retry</button>
</div>
<div id="note">Assistive aid only. Does not replace a white cane. Real-time close-range priority.</div>

<script>
/* ===== CONFIG & OPTIMIZATION ===== */
const WASM="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm";
const MODEL="https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite";
const RANGE=2.0;   // metres: strict close-range priority (ignoring far objects)
const LANGS=[
  ['en-US','English (United States)',0],['en-GB','English (United Kingdom)',0],['en-AU','English (Australia)',0],['en-IN','English (India)',0],
  ['ur-PK','Urdu (Pakistan) - اردو',1],['ur-IN','Urdu (India) - اردو',1],
  ['hi-IN','Hindi (India) - हिन्दी',2],
  ['ar-SA','Arabic (Saudi Arabia) - العربية',3],['ar-EG','Arabic (Egypt) - العربية',3]
];

const S={
ok:['OK / Confirm'], cancel:['Cancel / Stop'], back:['Back / Retry'],
hello:['Smart Cane is ready. Press OK to begin.'],
sayStart:['Say your starting point.'],
walk:['Start walking. I am counting your steps.'],
stopQ:['Do you want to stop here? OK for yes, Cancel for no.'],
place:['What is this place?'],
saved:['Saved {p}, {n} steps.'],
more:['Keep walking to save the next place, or press Cancel to finish.'],
done:['Stopped.'],
dest:['Where do you want to go? Say the place name, or press OK to save a new path.'],
nf:['I did not catch that, or the place is not saved. Press Back to retry.'],
go:['Going to {p}. Walk {n} steps, about {m} meters.'],
turn:['In {n} steps, turn {d}.'],
turnNow:['Turn {d} now.'],
L:['left'], R:['right'], F:['front'],
arr:['You have arrived at {p}.'],
pass:['You may have passed {p}. Press Back to repeat, or Cancel to stop.'],
perm:['Please allow camera, microphone and location in browser settings.'],
sOn:['Battery saver on.'], sOff:['Battery saver off.'], low:['Battery low.'],
det:['Fast obstacle detection active.'],
ob:['{o}, {d}, about {m} meters'],
obNear:['{o}, {d}, very close. Stop.'],
clear:['Path clear.'],
noSens:['Motion sensor requires permission.'],
noStt:['Voice input is not supported in this browser.'],
https:['Open this app from an https address.']
};

const NAMES=[['person'],['chair'],['sofa'],['bed'],['table'],['plant pot'],['dog'],['cat'],['bicycle'],['car'],['motorcycle'],['large vehicle']];
const OBJ={person:[1.7,0],chair:[.9,1],couch:[.85,2],bed:[.55,3],'dining table':[.75,4],'potted plant':[.5,5],dog:[.5,6],cat:[.3,7],bicycle:[1,8],car:[1.5,9],motorcycle:[1.2,10],bus:[3,11],truck:[2.8,11]};

const $=id=>document.getElementById(id);
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const stEl=$('status'),video=$('cam'),sel=$('lang');
let code=ls.get('sc_lang')||'en-US',L=LANGS.find(l=>l[0]===code)||LANGS[0];code=L[0];
let voice=null,saver=false,state='idle',SID=0,retry=null,lastInstr='',greeted=false,forceTeach=false;
let steps=0,segStart=0,lastStepT=0,lastAsk=-1,stopAt=0,from='',turns=[],legs=[],li=0,legStart=0,idleTimer=0,motionOk=false;
let lastMT=0,lastPeakT=0;
let stream=null,det=null,camOn=false,lastProc=0,hist=[],cur=null,sawAt=0,wake=null,rec=null,ac=null,gid=null,gp=null,gs=0;
let STRIDE=+ls.get('sc_stride')||.65;
let DB;try{DB=JSON.parse(ls.get('sc_db'))}catch(e){}
if(!DB||!Array.isArray(DB.edges)||!Array.isArray(DB.places))DB={places:[],edges:[]};
const save=()=>ls.set('sc_db',JSON.stringify(DB));
const IOS=/iP(hone|ad|od)/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

const t=(k,v)=>S[k][0].replace(/\{(\w+)\}/g,(_,x)=>v[x]);
const nm=i=>NAMES[i][0];
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ===== GOOGLE TTS (Speech Services by Google) Voice Selection ===== */
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  // Prioritize Google TTS voices explicitly for instant, natural speech
  const sc=v=>{
    const l=v.lang.replace('_','-');
    let score = (l===code ? 5 : l.split('-')[0]===code.split('-')[0] ? 3 : 0);
    if(/google/i.test(v.name)) score += 5; // Direct Google TTS engine match
    if(v.localService) score += 1;
    return score;
  };
  const c=vs.map(v=>[sc(v),v]).filter(a=>a[0]>0).sort((a,b)=>b[0]-a[0]);
  voice=c.length?c[0][1]:(vs[0]||null);
}
const q=[];
function speak(s){
  const u=new SpeechSynthesisUtterance(s);
  u.lang=code; if(voice) u.voice=voice; u.rate=1.1; // Optimized speed for blind navigation
  speechSynthesis.speak(u);
}
function say(s,urgent,instr){
  if(!s)return; stEl.textContent=s; if(instr)lastInstr=s;
  if(urgent){speechSynthesis.cancel();q.length=0;speak(s)}else q.push(s);
}
setInterval(()=>{if(q.length&&!speechSynthesis.speaking&&!speechSynthesis.pending)speak(q.shift())},100);
const idle=()=>new Promise(r=>{let n=0;const i=setInterval(()=>{if((!speechSynthesis.speaking&&!q.length)||++n>80){clearInterval(i);r()}},100)});
function beep(f,d){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),gn=ac.createGain(),n=ac.currentTime;d=d||.05;o.frequency.value=f;o.connect(gn);gn.connect(ac.destination);
    gn.gain.setValueAtTime(.2,n);gn.gain.linearRampToValueAtTime(0,n+d);o.start(n);o.stop(n+d)}catch(e){}
}

/* ===== ROBUST VOICE INPUT ===== */
function listen(){
  return new Promise(async res=>{
    const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!R){say(t('noStt'),true);return res('')}
    await idle();
    const r=rec=new R(); r.lang=code; r.interimResults=false; r.maxAlternatives=1; let out='';
    r.onresult=e=>{out=e.results[0][0].transcript.trim()};
    r.onerror=()=>{}; r.onend=()=>{rec=null;res(out)};
    beep(880,.08);
    try{r.start()}catch(e){return res('')}
    setTimeout(()=>{try{r.stop()}catch(e){}},7000);
  });
}
async function ask(key,id){say(t(key),true,true);await idle();return id!==SID?null:listen()}

/* ===== SAVED PLACES ROUTING ===== */
const norm=s=>s.toLowerCase().replace(/[\s.,!?;:'"()\-،۔]+/g,'');
const lev=(a,b)=>{const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const x=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=x}}return d[b.length]};
function find(name){
  const n=norm(name);let best=null,bd=99;
  for(const p of DB.places){const d=lev(n,norm(p));if(d<bd){bd=d;best=p}}
  return best&&bd<=Math.floor(norm(best).length*.3)?best:null;
}
function route(a,b){
  const adj=Object.create(null),prev=Object.create(null),qu=[a];prev[a]=null;
  const add=(x,l)=>(adj[x]=adj[x]||[]).push(l);
  for(const e of DB.edges){add(e.a,{to:e.b,n:e.n,t:e.t});add(e.b,{to:e.a,n:e.n,t:e.t.map(([k,d])=>[e.n-k,d==='L'?'R':'L']).reverse()})}
  while(qu.length){const u=qu.shift();if(u===b)break;for(const l of adj[u]||[])if(!(l.to in prev)){prev[l.to]={from:u,l};qu.push(l.to)}}
  if(!(b in prev)||a===b)return null;
  const out=[];for(let x=b;prev[x];x=prev[x].from)out.unshift({to:x,n:prev[x].l.n,t:prev[x].l.t});
  return out;
}

/* ===== HIGH-SPEED REAL-TIME CAMERA & CLOSE-RANGE PRIORITY ===== */
async function loadDet(){
  if(!window.ObjectDetector)await new Promise((ok,no)=>{const h=setTimeout(no,15000);addEventListener('mediapipe-loaded',()=>{clearTimeout(h);ok()},{once:true})});
  const v=await FilesetResolver.forVisionTasks(WASM);
  for(const d of['GPU','CPU'])try{return await ObjectDetector.createFromOptions(v,{baseOptions:{modelAssetPath:MODEL,delegate:d},scoreThreshold:.45,maxResults:3,runningMode:'VIDEO'})}catch(e){}
  throw new Error('detector');
}
async function camStart(){
  if(camOn)return true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:320},height:{ideal:240},frameRate:{ideal:20}},audio:false})}
  catch(e){stream=null;say(t(window.isSecureContext?'perm':'https'),true);return false}
  video.srcObject=stream;try{await video.play()}catch(e){}
  camOn=true;nextFrame();
  if(!det){try{det=await loadDet()}catch(e){say(t('det'),true)}}
  return true;
}
function camStop(){camOn=false;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}video.srcObject=null;cur=null;hist=[]}
const nextFrame=()=>{if(camOn)video.requestVideoFrameCallback?video.requestVideoFrameCallback(onFrame):requestAnimationFrame(onFrame)};
function onFrame(){
  nextFrame();
  const n=performance.now();
  if(!det||video.readyState<2||n-lastProc<100)return; // Instant real-time processing interval (100ms)
  lastProc=n;
  const W=video.videoWidth,H=video.videoHeight;let best=null;
  for(const d of det.detectForVideo(video,n).detections){
    const c=d.categories[0],o=OBJ[c.categoryName];if(!o)continue;
    const b=d.boundingBox;let m=o[0]*.75*Math.max(W,H)/b.height;
    if(m>RANGE)continue; // Filter out distant objects (strict close-range priority < 2m)
    const near=m<.6,cx=(b.originX+b.width/2)/W,side=cx<.35?'L':cx>.65?'R':'F';
    m=Math.max(.4,Math.round(m*2)/2);
    if(!best||m<best.m)best={m,near,side,o:o[1],key:c.categoryName+side};
  }
  hist.push(best?best.key:0);if(hist.length>2)hist.shift();
  if(best&&hist.every(k=>k===best.key)){
    sawAt=n;
    if(!cur||cur.key!==best.key||best.m<=cur.m-.4){cur={key:best.key,m:best.m};alertObs(best)}
  }else if(cur&&n-sawAt>500){cur=null;say(t('clear'),false)}
}
function alertObs(b){
  say(t(b.near?'obNear':'ob',{o:nm(b.o),d:t(b.side),m:b.m}),true);
  beep(b.m<=1?990:660); vib(b.m<=1?[100,40,100]:50);
}

/* ===== IMPROVED ACCURATE STEP COUNTER & iOS PERMISSION ===== */
function onMotion(e){
  const a=e.accelerationIncludingGravity,r=e.rotationRate;if(!a||a.x==null)return;
  const n=performance.now(); motionOk=true;
  const mag=Math.hypot(a.x,a.y,a.z);
  // Filtered peak detection to avoid false steps from casual shaking
  if(mag>12.2&&n-lastPeakT>350){
    lastPeakT=n; steps++; onStep();
  }
  if(r&&r.alpha!=null){
    const w=r.beta*(IOS?-1:1);
    if(Math.abs(w)>40&&(state==='teach'||state==='confirmStop')){
      const d=w>0?'L':'R',at=steps-segStart,l=turns[turns.length-1];
      if(!(l&&l[1]===d&&at-l[0]<=3))turns.push([at,d]);
    }
  }
}
async function motionOn(){
  motionOk=false;
  if(IOS&&typeof DeviceMotionEvent.requestPermission==='function'){
    $('ios-motion').style.display='block';
    return;
  }
  addEventListener('devicemotion',onMotion);
}
$('ios-motion').onclick=async()=>{
  try{
    const res=await DeviceMotionEvent.requestPermission();
    if(res==='granted'){
      $('ios-motion').style.display='none';
      addEventListener('devicemotion',onMotion);
      say("Motion sensors enabled.",true);
    }
  }catch(e){}
};
const motionOff=()=>removeEventListener('devicemotion',onMotion);
const hav=(a,b)=>{const r=Math.PI/180,x=(b[0]-a[0])*r,y=(b[1]-a[1])*r,s=Math.sin(x/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(y/2)**2;return 12742000*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))};
function geoOn(){
  if(!navigator.geolocation||saver||gid!==null)return;gp=null;
  gid=navigator.geolocation.watchPosition(p=>{
    const c=p.coords;if(c.accuracy>15)return;const a=[c.latitude,c.longitude];
    if(!gp){gp=a;gs=steps;return}
    const d=hav(gp,a),n=steps-gs;
    if(d>=25&&n>=15){const s=d/n;if(s>.4&&s<1.1){STRIDE=+(STRIDE*.7+s*.3).toFixed(3);ls.set('sc_stride',STRIDE)}gp=a;gs=steps}
  },()=>{},{enableHighAccuracy:false,maximumAge:5000});
}
const geoOff=()=>{if(gid!==null){navigator.geolocation.clearWatch(gid);gid=null}};
async function lock(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.onrelease=()=>{wake=null}}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}

/* ===== BATTERY SAVER MODE ===== */
function setSaver(on,why){
  if(on===saver)return;saver=on;document.body.classList.toggle('saver',on);
  if(why)say(t('low')+' '+t(on?'sOn':'sOff'),false);else say(t(on?'sOn':'sOff'),false);
  if(on)geoOff();else if(state==='teach'||state==='nav')geoOn();
}
if(navigator.getBattery)navigator.getBattery().then(b=>{const f=()=>setSaver(!b.charging&&b.level<=.2,true);b.onlevelchange=f;b.onchargingchange=f;f()}).catch(()=>{});

/* ===== CORE NAVIGATION FLOWS ===== */
async function begin(){
  const id=++SID;state='askStart';retry=begin;
  const name=await ask('sayStart',id);if(id!==SID)return;
  state='idle';if(!name){say(t('nf'),true,true);return}
  const start=find(name)||name;
  if(DB.edges.some(e=>e.a===start||e.b===start))return destFlow(start,id);
  retry=null;return teach(start,id);
}
async function destFlow(start,id){
  id=id||++SID;state='askDest';retry=()=>destFlow(start);forceTeach=false;
  const name=await ask('dest',id);if(id!==SID)return;
  if(forceTeach){retry=null;return teach(start,id)}
  state='idle';const dst=name&&find(name),legsX=dst&&route(start,dst);
  if(!legsX){say(t('nf'),true,true);return}
  retry=null;return nav(legsX,id);
}
async function activate(id){await camStart();if(id!==SID)return false;lock(true);motionOn();geoOn();return true}
async function teach(start,id){
  state='teach';from=start;if(!DB.places.includes(start))DB.places.push(start);save();
  steps=0;segStart=0;turns=[];lastAsk=-1;
  if(!await activate(id))return;
  say(t('walk'),true,true);clearInterval(idleTimer);idleTimer=setInterval(teachTick,500);
}
function teachTick(){
  const n=performance.now();
  if(state==='teach'&&steps-segStart>=4&&steps>lastAsk&&n-lastStepT>3500){state='confirmStop';lastAsk=steps;stopAt=steps;say(t('stopQ'),true,true)}
  else if(state==='confirmStop'&&steps-stopAt>=2)state='teach';
}
async function nameHere(){
  const id=++SID;state='askName';retry=nameHere;
  const name=await ask('place',id);if(id!==SID)return;
  if(!name){say(t('nf'),true,true);return}
  const p=find(name)||name,n=steps-segStart;
  if(p===from){say(t('nf'),true,true);return}
  DB.edges=DB.edges.filter(e=>!(e.a===from&&e.b===p));DB.edges.push({a:from,b:p,n,t:turns});
  if(!DB.places.includes(p))DB.places.push(p);save();
  say(t('saved',{p,n})+' '+t('more'),true,true);
  from=p;segStart=steps;turns=[];lastAsk=steps;state='teach';retry=null;
}
async function nav(legsX,id){
  state='nav';legs=legsX.map(l=>({to:l.to,n:l.n,passed:0,t:l.t.map(([at,d])=>({at,d,s:0}))}));li=0;steps=0;legStart=0;
  if(!await activate(id))return;
  announceLeg();
}
const announceLeg=()=>{const l=legs[li];say(t('go',{p:l.to,n:l.n,m:Math.round(l.n*STRIDE)}),true,true)};
function onStep(){
  lastStepT=performance.now();
  if(state!=='nav')return;
  const l=legs[li],c=steps-legStart;
  for(const x of l.t){
    if(x.s<1&&x.at-c>0&&x.at-c<=4){x.s=1;say(t('turn',{n:x.at-c,d:t(x.d)}),false,true)}
    if(x.s<2&&c>=x.at){x.s=2;say(t('turnNow',{d:t(x.d)}),true,true)}
  }
  if(c>=l.n){
    say(t('arr',{p:l.to}),true,true);
    if(li<legs.length-1){li++;legStart=steps;announceLeg()}else setTimeout(()=>stopAll(false),4000);
  }else if(c>l.n+Math.max(6,l.n*.3)&&!l.passed){l.passed=1;say(t('pass',{p:l.to}),true,true)}
}
function stopAll(talk){
  SID++;state='idle';retry=null;clearInterval(idleTimer);
  try{rec&&rec.abort()}catch(e){}
  speechSynthesis.cancel();q.length=0;camStop();motionOff();geoOff();lock(false);
  if(talk)say(t('done'),true);
}

/* ===== STARTUP PERMISSIONS ===== */
async function perms(){
  try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});s.getTracks().forEach(x=>x.stop())}catch(e){}
  await new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(r,()=>{r()},{timeout:6000,maximumAge:6e5}):r());
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
}

/* ===== UI & CONTROLS ===== */
function render(){
  $('ok').textContent=t('ok');$('cancel').textContent=t('cancel');$('back').textContent=t('back');
  $('note').textContent='Assistive aid only. Real-time close-range priority.';
}
$('ok').onclick=async()=>{
  vib(30);
  if(state==='idle')begin();
  else if(state==='confirmStop')nameHere();
  else if(state==='askDest'){forceTeach=true;try{rec&&rec.stop()}catch(e){}}
};
$('cancel').onclick=()=>{vib(30);if(state==='confirmStop'){state='teach';stopAt=steps}else stopAll(true)};
$('back').onclick=async()=>{
  vib(30);
  if(camOn&&!det){try{det=await loadDet()}catch(e){}}
  if(retry)retry();else if(lastInstr)say(lastInstr,true);
};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  const k={Enter:'ok',Escape:'cancel',Backspace:'back'}[e.key];if(k){e.preventDefault();$(k).click()}
});

sel.innerHTML=LANGS.map((l,i)=>`<option value="${i}">${l[1]}</option>`).join('');
sel.value=LANGS.indexOf(L);
sel.onchange=()=>{
  L=LANGS[+sel.value]; code=L[0]; ls.set('sc_lang',code);
  pickVoice(); say(t('hello'),true,true);
};

speechSynthesis.onvoiceschanged=pickVoice;
pickVoice(); stEl.textContent=t('hello'); lastInstr=t('hello');
perms();
</script>
</body>
</html>
