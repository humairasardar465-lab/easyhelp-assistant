<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test - English</title>
</head>
<body>

<h2>Test - English</h2>

<input id="cameraInput" type="file" accept="image/*" capture="environment">
<br><br>
<button id="describeButton" type="button">Describe Image</button>
<p id="status"></p>

<!-- Load API key from keys.js -->
<script src="keys.js"></script>

<script>
const GEMINI_MODEL = "gemini-2.5-flash";

async function sendToGemini(imageBase64) {
  // Get API key from keys.js
  const key = GEMINI_KEYS[0];

  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + GEMINI_MODEL + ":generateContent?key=" + key;

  const response = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      contents: [{
        parts: [
          { text: "Describe this image in simple English. What is in front? Tell clearly in 1-2 lines." },
          { inlineData: { mime_type: "image/jpeg", data: imageBase64 } }
        ]
      }]
    })
  });

  if (!response.ok) {
    throw new Error("Gemini error: " + response.status);
  }

  const data = await response.json();
  const text = data.candidates[0].content.parts.map(p => p.text || "").join("").trim();
  return text;
}

function speakEnglish(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  window.speechSynthesis.speak(u);
}

async function describeImageFile(file) {
  const dataUrl = await new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(new Error("Failed to read image"));
    reader.readAsDataURL(file);
  });
  const imageBase64 = String(dataUrl).split(",")[1];
  const description = await sendToGemini(imageBase64);
  speakEnglish(description);
  return description;
}

document.getElementById("describeButton").addEventListener("click", async () => {
  const input = document.getElementById("cameraInput");
  const status = document.getElementById("status");
  const file = input.files?.[0];

  if (!file) {
    status.textContent = "Please select an image first.";
    return;
  }
  try {
    status.textContent = "Loading...";
    const description = await describeImageFile(file);
    status.textContent = description;
  } catch (e) {
    status.textContent = "Error: " + e.message;
  }
});
</script>

</body>
</html>
