<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyHelp Smart Cane & GPS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .creator {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: right;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #00ffcc;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        video, canvas {
            width: 100%;
            max-height: 260px;
            border-radius: 8px;
            background: #000;
            object-fit: cover;
            margin-top: 10px;
        }
        button {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #00cc99;
        }
        #output {
            margin-top: 15px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
            min-height: 40px;
            text-align: right;
            direction: rtl;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Live Camera Assistant & GPS</h2>
    <div class="creator">Created by Humaira Sardar</div>

    <!-- 1. لینگویج سلیکٹر -->
    <div class="control-group">
        <label for="voiceLanguage">زبان اور اسکرین ریڈر کی زبان (Language)</label>
        <select id="voiceLanguage">
            <option value="ur-PK" selected>Urdu (اردو)</option>
            <option value="ar-SA">Arabic (العربية)</option>
            <option value="hi-IN">Hindi (हिंदी)</option>
            <option value="en-US">English (United States)</option>
            <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
        </select>
    </div>

    <!-- 2. صاف ستھری اور خالی سرچ بار میپ کے لیے -->
    <div class="control-group">
        <label for="destinationInput">منزل کا نام لکھیں (Destination Search)</label>
        <input type="text" id="destinationInput" placeholder="">
        <button id="openMapsBtn" style="background-color: #0284c7; color: #fff;">🗺️ گوگل نقشہ کھولیں (Open Maps)</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

    <p>لائیو کیمرہ اور اے آئی اسسٹنٹ سے بات کرنے کے لیے نیچے دیے گئے بٹن پر کلک کریں:</p>
    
    <!-- کیمرہ ویو (آپ کے دیے ہوئے کوڈ کے مطابق) -->
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <button id="startBtn">لائیو کیمرہ اور اسسٹنٹ شروع کریں</button>
    
    <div id="output">پروگرام تیار ہے...</div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const video = document.getElementById('webcam');
    const output = document.getElementById('output');
    const voiceLanguageSelect = document.getElementById('voiceLanguage');
    const destinationInput = document.getElementById('destinationInput');
    const openMapsBtn = document.getElementById('openMapsBtn');

    // ٹیکسٹ ٹو اسپیچ (Speech Synthesis) فنکشن جو سلیکٹ کردہ زبان میں بولے گا
    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const lang = voiceLanguageSelect.value;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
        output.innerText = text;
    }

    // کیمرہ آن کرنے کا فنکشن (آپ کے کوڈ کی بنیاد پر ود ایگزیکٹ انوائرمنٹ فال بیک)
    async function startCamera() {
        try {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { exact: "environment" } }, 
                audio: true 
            });
            video.srcObject = stream;
            speakText("پچھلا لائیو کیمرہ اور اسسٹنٹ فعال ہو چکے ہیں۔");
        } catch (e1) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: true 
                });
                video.srcObject = stream;
                speakText("لائیو کیمرہ اور اسسٹنٹ فعال ہو چکے ہیں۔");
            } catch (err) {
                const errMsg = "کیمرہ یا مائیکروفون کی اجازت نہیں ملی: " + err.message;
                output.innerText = errMsg;
                speakText("براہ کرم کیمرے اور مائیکروفون کی پرمشن الاؤ کریں۔");
            }
        }
    }

    startBtn.addEventListener('click', () => {
        startCamera();
    });

    // گوگل میپ سرچ برج (پرفیکٹ اور سمپل)
    openMapsBtn.addEventListener('click', () => {
        const query = destinationInput.value.trim();
        const lang = voiceLanguageSelect.value;
        
        if (!query) {
            const emptyMsg = lang.startsWith('ur') ? "براہ کرم پہلے منزل کا نام لکھیں۔" : "Please enter a destination first.";
            speakText(emptyMsg);
            return;
        }
        
        const mapMsg = lang.startsWith('ur') ? `${query} کا گوگل نقشہ کھولا جا رہا ہے۔` : `Opening Google Maps for ${query}.`;
        speakText(mapMsg);
        
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}&hl=${lang.substring(0, 2)}`;
        window.open(mapsUrl, '_blank');
    });
</script>

</body>
</html>
