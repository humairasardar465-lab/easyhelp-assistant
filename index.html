function isWallDoorStairsBlocked() {
  try {
    if (!video || !video.videoWidth) return false;
    const now = Date.now();
    if (now - lastWallCheck < 80) return wallConfirmCount >= WALL_CONFIRM_NEEDED;
    lastWallCheck = now;
    if (!wallCanvas) { wallCanvas = document.createElement('canvas'); wallCanvas.width = 32; wallCanvas.height = 24; }
    const ctx = wallCanvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, 32, 24);
    const d = ctx.getImageData(0, 0, 32, 24).data;
    function getStats(x0, x1, y0, y1) {
      let min = 255, max = 0, sum = 0, count = 0;
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const idx = (y * 32 + x) * 4;
          const g = (d[idx] + d[idx+1] + d[idx+2]) / 3;
          sum += g; count++; if (g < min) min = g; if (g > max) max = g;
        }
      }
      return { range: max - min, avg: sum / count };
    }
    let top = getStats(8, 24, 0, 6);
    let centre = getStats(8, 24, 6, 18);
    let bottom = getStats(8, 24, 18, 24);
    let allAvg = (top.avg + centre.avg + bottom.avg) / 3;
    let isMoving = false;
    if (lastFrameAvg !== -1) { if (Math.abs(allAvg - lastFrameAvg) > 25) isMoving = true; }
    lastFrameAvg = allAvg;
    if (isMoving) { wallConfirmCount = 0; return false; }
    // FIX: Andheray me ghalat alarm na aaye, is liye avg 15 se 30 kar diya
    let isWall = false;
    if (centre.range < 70 && bottom.range < 90 && centre.avg > 30) isWall = true;
    if (top.range < 80 && centre.range < 70 && bottom.range < 90 && centre.avg > 30) isWall = true;
    if (centre.range < 45 && centre.avg > 30) isWall = true;
    if (isWall) { wallConfirmCount++; } else { wallConfirmCount = 0; }
    return wallConfirmCount >= WALL_CONFIRM_NEEDED;
  } catch(e) { return false; }
}
// FIX: Neeche garha / nali check - neeche wala hissa upar se bohat kala ho to garha
function isPotholeBlocked() {
  try {
    if (!video || !video.videoWidth) return false;
    if (!wallCanvas) { wallCanvas = document.createElement('canvas'); wallCanvas.width = 32; wallCanvas.height = 24; }
    const ctx = wallCanvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, 32, 24);
    const d = ctx.getImageData(0, 0, 32, 24).data;
    function getAvg(x0, x1, y0, y1) {
      let sum = 0, count = 0;
      for (let y = y0; y < y1; y++) {
        for (let x = x0; x < x1; x++) {
          const idx = (y * 32 + x) * 4;
          sum += (d[idx] + d[idx+1] + d[idx+2]) / 3; count++;
        }
      }
      return sum / count;
    }
    let midAvg = getAvg(8, 24, 8, 16);
    let bottomAvg = getAvg(8, 24, 18, 24);
    // Neeche achanak bohat kala = garha ya nali ho sakti hai
    if (midAvg > 40 && bottomAvg < midAvg - 35) { potholeConfirmCount++; } else { potholeConfirmCount = 0; }
    return potholeConfirmCount >= 3;
  } catch(e) { return false; }
}
function alertWallDoorStairs() { handleObstacle(getObstacleText(getT('frontWord'), 1)); }
function handleObstacle(fullObstacleText) {
  statusEl.innerText = fullObstacleText;
  currentMode = "obstacle";
  stopClearTone();
  // FIX: Agar wohi rukawat hai to bhi 4 second baad dobara bolay ga, taake awaz miss na ho
  if (lastObstacleName !== fullObstacleText || Date.now() - lastSpeakTime > 4000) {
    lastObstacleName = fullObstacleText;
    triggerVibration(); speak(fullObstacleText, true);
  }
  const now = Date.now();
  if (now - lastBeepTime > 800) { lastBeepTime = now; playBeep('obstacle'); }
}
function handleClearPath() {
  currentMode = "clear";
  lastObstacleName = "";
  lastObstacleSpokenText = "";
  statusEl.innerText = getT('clearPath');
  startClearTone();
  const now = Date.now();
  // Aap ka rakha hua 4 second wala rule waisa hi hai
  if (now - lastClearSpeakTime > 4000) {
    lastClearSpeakTime = now;
    speakClearForce();
  }
  if (totalWalkedMeters - lastAnnouncedWalkedMeters >= 50 && now - lastWalkAnnounceTime > 10000) {
    lastAnnouncedWalkedMeters = totalWalkedMeters;
    lastWalkAnnounceTime = now;
    speak(getT('walkedWord') + " " + Math.round(totalWalkedMeters) + " " + getT('walkedWord2'), false);
  }
}
async function waitForMediapipe() {
  if (window.FilesetResolver && window.ObjectDetector) return true;
  return new Promise(function(resolve) {
    let done = false;
    const t = setTimeout(function() { if (!done) { done = true; resolve(false); } }, 15000);
    window.addEventListener('mediapipe-loaded', function() { if (!done) { done = true; clearTimeout(t); resolve(true); } }, { once: true });
  });
}
async function initDetector() {
  if (objectDetector) return true;
  if (isDetectorLoading) return false;
  isDetectorLoading = true;
  try {
    statusEl.innerText = getT('loading');
    const ok = await waitForMediapipe();
    if (!ok) { throw new Error('mediapipe timeout'); }
    const vision = await window.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm");
    const detectorPromise = window.ObjectDetector.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite", delegate: "CPU" }, scoreThreshold: 0.42, runningMode: "VIDEO" });
    const timeoutPromise = new Promise(function(_, reject) { setTimeout(function() { reject(new Error('model timeout')); }, 15000); });
    objectDetector = await Promise.race([detectorPromise, timeoutPromise]);
    isDetectorLoading = false;
    return true;
  } catch (err) {
    console.error(err);
    isDetectorLoading = false;
    objectDetector = null;
    if (isLive) { statusEl.innerText = getT('netError'); speak(getT('netError'), false); }
    return false;
  }
}
async function startCamera() {
  try {
    if (isLive || stream) return;
    statusEl.innerText = getT('loading');
    startBtn.innerText = 'PLEASE WAIT...';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { statusEl.innerText = getT('camError'); speak(getT('camError'), false); startBtn.innerText = 'START'; return; }
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = stream;
    startGPS();
    startWatchdog();
    video.onloadedmetadata = async () => {
      try { await video.play(); } catch(e) {}
      isLive = true; statusEl.innerText = getT('started'); speak(getT('started'), false);
      startBtn.style.display = 'none'; stopBtn.style.display = 'block';
      window.requestAnimationFrame(predictWebcam);
      const ok = await initDetector();
      if (!ok && isLive) { statusEl.innerText = getT('netError'); }
    };
  } catch (err) {
    console.error(err);
    startBtn.innerText = 'START';
    statusEl.innerText = getT('camError'); speak(getT('camError'), false);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
}
// FIX: Watchdog - agar system atak jaye to khud se dobara chal pare ga
function startWatchdog() {
  if (watchdogTimer) clearInterval(watchdogTimer);
  watchdogTimer = setInterval(function(){
    if (!isLive) return;
    const now = Date.now();
    // Agar 3 second se frame hi nahi aaya to loop dobara chalao
    if (lastFrameTime && (now - lastFrameTime > 3000)) {
      lastFrameTime = now;
      window.requestAnimationFrame(predictWebcam);
    }
    // Agar bolna atak gaya ho to us ko kholo
    if (isSpeakingObstacle && (now - lastSpeakTime > 5000)) {
      try { window.speechSynthesis.cancel(); } catch(e){}
      isSpeakingObstacle = false;
    }
  }, 2000);
}
let lastVideoTime = -1;
async function predictWebcam() {
  if (!isLive) return;
  lastFrameTime = Date.now();
  if (!objectDetector) {
    if (isLive) { window.requestAnimationFrame(predictWebcam); }
    return;
  }
  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime; frameCount++;
    try {
      const startTimeMs = performance.now();
      const detections = objectDetector.detectForVideo(video, startTimeMs);
      const hasObjectDetected = detections && detections.detections && detections.detections.length > 0;
      if (!hasObjectDetected) {
        wallConfirmCount = wallConfirmCount;
        // Pehle garha check karo
        if (isPotholeBlocked()) {
          handleObstacle(getT('potholeWord'));
        } else if (isWallDoorStairsBlocked()) {
          obstacleConfirmCount = 0;
          alertWallDoorStairs();
        } else {
          handleClearPath();
        }
      } else {
        wallConfirmCount = 0;
        let closest = detections.detections[0]; let maxArea = 0;
        for (let det of detections.detections) { const area = det.boundingBox.width * det.boundingBox.height; if (area > maxArea) { maxArea = area; closest = det; } }
        const confidence = Math.round(closest.categories[0].score * 100);
        if (confidence >= REQUIRED_CONFIDENCE) {
          const videoWidth = video.videoWidth || 640;
          const videoArea = videoWidth * (video.videoHeight || 480);
          const sizeRatio = maxArea / videoArea;
          const cxRatio = (closest.boundingBox.originX + closest.boundingBox.width / 2) / videoWidth;
          const sideWord = getSideWord(cxRatio);
          // FIX: Side wali cheez tabhi bolegi jab qareeb ho, warna ignore
          const isSide = sideWord !== getT('frontWord');
          if (isSide && sizeRatio < SIDE_CLOSE_SIZE_RATIO) {
            handleClearPath();
          } else if (sizeRatio >= OBSTACLE_SIZE_RATIO) {
            obstacleConfirmCount++;
            // FIX: Sirf 2 bar dekh kar foran bolay ga, 1 second ke andar
            if (obstacleConfirmCount >= OBSTACLE_CONFIRM_NEEDED) {
              const dist = getDistanceMeters(sizeRatio);
              const fullObstacleText = getObstacleText(sideWord, dist);
              handleObstacle(fullObstacleText);
            }
          } else { handleClearPath(); }
        } else { handleClearPath(); }
      }
    } catch (e) { console.error(e); }
  }
  if (isLive) { window.requestAnimationFrame(predictWebcam); }
}
function stopCamera() {
  if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
  if ('vibrate' in navigator) { try { navigator.vibrate(0); } catch(e){} }
  isLive = false;
  if (watchdogTimer) { clearInterval(watchdogTimer); watchdogTimer = null; }
  stopClearTone();
  if (gpsWatchId) { try { navigator.geolocation.clearWatch(gpsWatchId); } catch(e){} gpsWatchId = null; }
  if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
  video.srcObject = null; statusEl.innerText = "STATUS: OFF"; startBtn.style.display = 'block'; startBtn.innerText = 'START'; stopBtn.style.display = 'none';
  isSpeakingObstacle = false; currentMode = "clear"; lastObstacleName = ""; obstacleConfirmCount = 0; wallConfirmCount = 0; isDetectorLoading = false;
  totalWalkedMeters = 0; lastAnnouncedWalkedMeters = 0;
}

langSel.addEventListener('click', () => { lightVibration(); });

openMapsBtn.addEventListener('click', () => { lightVibration(); const dest = destinationInput.value.trim(); if (dest) { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank'); } else { window.open(`https://www.google.com/maps`, '_blank'); } });
waBtn.addEventListener('click', () => { lightVibration(); });
