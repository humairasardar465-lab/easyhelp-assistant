function getLocalizedName(category) {
  const lang = langSel.value;
  if (allNames[lang] && allNames[lang][category]) {
    return allNames[lang][category];
  }
  return category;
}

function getT(key) {
  const lang = langSel.value;
  if (translations[lang] && translations[lang][key]) {
    return translations[lang][key];
  }
  return translations['en-US'][key] || key;
}

function triggerVibration() {
  if ('vibrate' in navigator) {
    try { navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
}

function playBeep(type) {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'clear') {
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'obstacle') {
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(180, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.setValueAtTime(0.3, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.22);
    }
  } catch (e) {}
}

function speak(text) {
  if (!text) return;
  if (!('speechSynthesis' in window)) return;

  if (window.speechSynthesis.speaking) {
    pendingSpeech = text;
    return;
  }

  const now = Date.now();
  if (text === lastSpoken && now - lastSpeakTime < 6000) return;

  lastSpoken = text;
  lastSpeakTime = now;
  pendingSpeech = null;

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langSel.value;
  
  utterance.onend = () => {
    if (pendingSpeech) {
      const nextText = pendingSpeech;
      pendingSpeech = null;
      speak(nextText);
    }
  };

  window.speechSynthesis.speak(utterance);
}

async function initDetector() {
  if (objectDetector) return;
  
  if (!window.FilesetResolver || !window.ObjectDetector) {
    await new Promise(resolve => {
      window.addEventListener('mediapipe-loaded', resolve, { once: true });
      setTimeout(resolve, 3000);
    });
  }

  try {
    statusEl.innerText = getT('loading');
    const vision = await window.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm"
    );
    objectDetector = await window.ObjectDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
        delegate: "CPU"
      },
      scoreThreshold: 0.4,
      runningMode: "VIDEO"
    });
  } catch (err) {
    console.error(err);
    statusEl.innerText = getT('netError');
    speak(getT('netError'));
  }
}

async function initSegmenter() {
  if (imageSegmenter) return;
  try {
    const vision = await window.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm"
    );
    imageSegmenter = await window.ImageSegmenter.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/image_segmenter/deeplab_v3/float32/1/deeplab_v3.tflite",
        delegate: "CPU"
      },
      runningMode: "VIDEO"
    });
    offscreenCanvas = document.createElement('canvas');
    canvasCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
  } catch (e) {
    console.error("Segmenter init error:", e);
  }
}

async function startCamera() {
  try {
    if (isLive || stream) return;

    await initDetector();
    await initSegmenter();

    if (!objectDetector) {
      statusEl.innerText = getT('netError');
      speak(getT('netError'));
      return;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      isLive = true;
      statusEl.innerText = getT('started');
      speak(getT('started'));
      startBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      window.requestAnimationFrame(predictWebcam);

  } catch (err) {
    console.error(err);
    statusEl.innerText = getT('camError');
    speak(getT('camError'));
  }
}

let lastVideoTime = -1;

function checkWallAndStairs() {
  if (!imageSegmenter || !video.videoWidth) return;
  try {
    const w = 256;
    const h = 256;
    if (offscreenCanvas.width !== w) {
      offscreenCanvas.width = w;
      offscreenCanvas.height = h;
    }
    canvasCtx.drawImage(video, 0, 0, w, h);
    const startTimeMs = performance.now();
    const result = imageSegmenter.segmentForVideo(offscreenCanvas, startTimeMs);
    
    if (result && result.categoryMask) {
      const mask = result.categoryMask;
      const data = mask.getAsUint8Array ? mask.getAsUint8Array() : mask.pixels;
      if (data) {
        let centerUniformCount = 0;
        let totalCenter = 0;
        const actualWidth = mask.width || w;
        const actualHeight = mask.height || h;
        const startX = Math.floor(actualWidth * 0.35);
        const endX = Math.floor(actualWidth * 0.65);
        const startY = Math.floor(actualHeight * 0.3);
        const endY = Math.floor(actualHeight * 0.7);

        const firstVal = data[startY * actualWidth + startX];
        for (let y = startY; y < endY; y++) {
          for (let x = startX; x < endX; x++) {
            totalCenter++;
            if (data[y * actualWidth + x] === firstVal) {
              centerUniformCount++;
            }
          }
        }
        
        if (totalCenter > 0 && (centerUniformCount / totalCenter) > 0.90) {
          isWallOrStairAhead = true;
          return;
        }
      }
    }
  } catch (e) {
    console.error(e);
  }
  isWallOrStairAhead = false;
}

async function predictWebcam() {
  if (!isLive) return;

  if (!objectDetector) {
    if (isLive) {
      window.requestAnimationFrame(predictWebcam);
    }
    return;
  }

  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;
    frameCount++;

    if (frameCount % 3 === 0) {
      checkWallAndStairs();
    }

    try {
      const startTimeMs = performance.now();
      const detections = objectDetector.detectForVideo(video, startTimeMs);
      const hasObjectDetected = detections && detections.detections && detections.detections.length > 0;

      if (!hasObjectDetected) {
        nothingCount++;
      } else {
        nothingCount = 0;
      }

      if (isWallOrStairAhead && !hasObjectDetected && nothingCount >= 3) {
        wasObstacle = true;
        statusEl.innerText = getT('wallAhead');
        
        const now = Date.now();
        if (now - lastBeepTime > 600) {
          lastBeepTime = now;
          playBeep('obstacle');
          triggerVibration();
        }

        if (now - lastObstacleSpeakTime > 6000) {
          lastObstacleSpeakTime = now;
          speak(getT('wallAhead'));
        }
        if (isLive) {
          window.requestAnimationFrame(predictWebcam);
        }
        return;
      }

      if (hasObjectDetected) {
        let closest = detections.detections[0];
        let maxArea = 0;
        
        for (let det of detections.detections) {
          const area = det.boundingBox.width * det.boundingBox.height;
          if (area > maxArea) {
            maxArea = area;
            closest = det;
          }
        }

        const rawCategory = closest.categories[0].categoryName;
        const localizedName = getLocalizedName(rawCategory);
        const confidence = Math.round(closest.categories[0].score * 100);
        
        const requiredConfidence = 40;

        if (confidence >= requiredConfidence) {
          const videoWidth = video.videoWidth || 640;
          const videoArea = videoWidth * (video.videoHeight || 480);
          const sizeRatio = maxArea / videoArea;
          
          if (sizeRatio >= 0.005) {
            wasObstacle = true;
            statusEl.innerText = `${getT('stopClose')} ${localizedName}`;
            
            const now = Date.now();
            if (now - lastBeepTime > 600) {
              lastBeepTime = now;
              playBeep('obstacle');
              triggerVibration();
            }

            if (now - lastObstacleSpeakTime > 6000) {
              lastObstacleSpeakTime = now;
              speak(`${getT('stopClose')} ${localizedName}`);
            }
          } else {
            handleUnknownOrClear();
          }
        } else {
          handleUnknownOrClear();
        }
      } else {
        handleUnknownOrClear();
      }
    } catch (e) {
      console.error(e);
    }
  }

  if (isLive) {
    window.requestAnimationFrame(predictWebcam);
  }
}

function handleUnknownOrClear() {
  const now = Date.now();
  if (nothingCount === 0 && video.readyState >= 2) {
    wasObstacle = true;
    statusEl.innerText = getT('unknownObstacle');
    if (now - lastBeepTime > 600) {
      lastBeepTime = now;
      playBeep('obstacle');
      triggerVibration();
    }

    if (now - lastObstacleSpeakTime > 6000) {
      lastObstacleSpeakTime = now;
      speak(getT('unknownObstacle'));
    }
  } else {
    handleClearPath();
  }
}

function handleClearPath() {
  statusEl.innerText = getT('clearPath');
  
  const now = Date.now();
  if (now - lastClearSoundTime > 800) {
    lastClearSoundTime = now;
    playBeep('clear');
  }

  if (wasObstacle) {
    wasObstacle = false;
    lastClearSpeakTime = now;
    speak(getT('clearPath'));
  } else if (now - lastClearSpeakTime > 10000) {
    lastClearSpeakTime = now;
    speak(getT('clearPath'));
  }
}

function stopCamera() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  pendingSpeech = null;
  if ('vibrate' in navigator) {
    try { navigator.vibrate(0); } catch(e){}
  }
  isLive = false;
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
  statusEl.innerText = "STATUS: OFF";
  startBtn.style.display = 'block';
  stopBtn.style.display = 'none';
}

startBtn.addEventListener('click', async () => {
  await startCamera();
});

stopBtn.addEventListener('click', () => {
  stopCamera();
});

openMapsBtn.addEventListener('click', () => {
  const dest = destinationInput.value.trim();
  if (dest) {
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank');
  } else {
    window.open(`https://www.google.com/maps`, '_blank');
  }
});
</script>
