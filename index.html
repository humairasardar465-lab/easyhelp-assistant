<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyHelp Smart Cane & GPS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h2 {
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .creator {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: right;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
            color: #00ffcc;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 8px;
        }
        video, canvas {
            width: 100%;
            max-height: 260px;
            border-radius: 8px;
            background: #000;
            object-fit: cover;
            margin-top: 10px;
        }
        button {
            background-color: #00ffcc;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            width: 100%;
        }
        button:hover {
            background-color: #00cc99;
        }
        #output {
            margin-top: 15px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 5px;
            min-height: 50px;
            text-align: right;
            direction: rtl;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Live Camera Assistant & GPS</h2>
    <div class="creator">Created by Humaira Sardar</div>

    <!-- 1. جمنائی API Key ان پٹ (یہاں صارف اپنی کی پیسٹ کر سکے گا) -->
    <div class="control-group">
        <label for="apiKeyInput">گوگل جمنائی API Key درج کریں (Gemini API Key)</label>
        <input type="password" id="apiKeyInput" placeholder="اپنی API Key یہاں پیسٹ کریں...">
    </div>

    <!-- 2. زبان سلیکٹر -->
    <div class="control-group">
        <label for="voiceLanguage">زبان اور اسکرین ریڈر کی زبان (Language)</label>
        <select id="voiceLanguage">
            <option value="ur-PK" selected>Urdu (اردو)</option>
            <option value="ar-SA">Arabic (العربية)</option>
            <option value="hi-IN">Hindi (हिंदी)</option>
            <option value="en-US">English (United States)</option>
            <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
        </select>
    </div>

    <!-- 3. گوگل میپ سرچ بار -->
    <div class="control-group">
        <label for="destinationInput">منزل کا نام لکھیں (Destination Search)</label>
        <input type="text" id="destinationInput" placeholder="">
        <button id="openMapsBtn" style="background-color: #0284c7; color: #fff;">🗺️ گوگل نقشہ کھولیں (Open Maps)</button>
    </div>

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">

    <p>لائیو کیمرہ اور اے آئی اسسٹنٹ سے بات کرنے کے لیے نیچے دیے گئے بٹن پر کلک کریں:</p>
    
    <!-- کیمرہ اور کینوس ویو -->
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
    
    <button id="startBtn">لائیو کیمرہ اور اسسٹنٹ شروع کریں</button>
    <button id="askAiBtn" style="background-color: #d97706; color: #fff; display:none;">🗣️ اسک ٹو لائیو اے آئی: سامنے کیا ہے؟</button>
    
    <div id="output">پروگرام تیار ہے...</div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const askAiBtn = document.getElementById('askAiBtn');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const output = document.getElementById('output');
    const voiceLanguageSelect = document.getElementById('voiceLanguage');
    const destinationInput = document.getElementById('destinationInput');
    const openMapsBtn = document.getElementById('openMapsBtn');
    const apiKeyInput = document.getElementById('apiKeyInput');

    // سسٹم پرومپٹ جو شناخت چھپائے گا
    const systemIdentity = "You are an advanced AI Camera and Assistant designed for blind mobility. Never mention Google, Gemini, or training models. Keep answers direct, concise, and helpful.";

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const lang = voiceLanguageSelect.value;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utterance);
        output.innerText = text;
    }

    // کیمرہ آن کرنے کا فنکشن
    async function startCamera() {
        try {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { exact: "environment" } }, 
                audio: true 
            });
            video.srcObject = stream;
            askAiBtn.style.display = "block";
            speakText("پچھلا لائیو کیمرہ فعال ہو گیا ہے۔ اب آپ اے آئی سے پوچھ سکتے ہیں۔");
        } catch (e1) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" }, 
                    audio: true 
                });
                video.srcObject = stream;
                askAiBtn.style.display = "block";
                speakText("لائیو کیمرہ فعال ہو گیا ہے۔");
            } catch (err) {
                const errMsg = "کیمرہ یا مائیکروفون کی اجازت نہیں ملی: " + err.message;
                output.innerText = errMsg;
                speakText("براہ کرم کیمرے اور مائیکروفون کی پرمشن الاؤ کریں۔");
            }
        }
    }

    startBtn.addEventListener('click', () => {
        startCamera();
    });

    // گوگل جمنائی API کے ذریعے تصویر کو لائیو اسکین کرنے کا فنکشن
    askAiBtn.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            speakText("براہ کرم اوپر دی گئی فیلڈ میں اپنی جمنائی API Key درج کریں۔");
            return;
        }

        if (!video.srcObject) {
            speakText("پہلے لائیو کیمرہ آن کریں۔");
            return;
        }

        speakText("تصویر کا تجزیہ کیا جا رہا ہے، براہ کرم انتظار کریں...");

        // کیمرے کے فریم کو کینوس پر کیپچر کرنا
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // بیس 64 (Base64) امیজ ڈیٹا نکالنا
        const base64Image = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
        const selectedLang = voiceLanguageSelect.value;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [
                        {
                            parts: [
                                { text: `${systemIdentity} Look at this image captured from a blind person's smart cane camera. Describe what is directly in front, any obstacles, doors, stairs, or objects clearly, in language code: ${selectedLang}. Keep it short and precise.` },
                                {
                                    inline_data: {
                                        mime_type: "image/jpeg",
                                        data: base64Image
                                    }
                                }
                            ]
                        }
                    ]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content) {
                const aiResponse = data.candidates[0].content.parts[0].text;
                speakText(aiResponse);
            } else {
                speakText("اے آئی سے جواب حاصل کرنے میں دشواری پیش آئی۔");
            }
        } catch (error) {
            speakText("نیٹ ورک یا API کا خرابی: " + error.message);
        }
    });

    // گوگل میپ سرچ برج
    openMapsBtn.addEventListener('click', () => {
        const query = destinationInput.value.trim();
        const lang = voiceLanguageSelect.value;
        
        if (!query) {
            const emptyMsg = lang.startsWith('ur') ? "براہ کرم پہلے منزل کا نام لکھیں۔" : "Please enter a destination first.";
            speakText(emptyMsg);
            return;
        }
        
        const mapMsg = lang.startsWith('ur') ? `${query} کا گوگل نقشہ کھولا جا رہا ہے۔` : `Opening Google Maps for ${query}.`;
        speakText(mapMsg);
        
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}&hl=${lang.substring(0, 2)}`;
        window.open(mapsUrl, '_blank');
    });
</script>

</body>
</html>
