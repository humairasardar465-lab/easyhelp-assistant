<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart King - Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@latest"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#0a0f1e;color:#fff;margin:0;padding:16px}
.top{max-width:620px;margin:auto;background:#111827;padding:22px;border-radius:16px}
h2{text-align:center;color:#00ffcc;margin:0}
.sub{text-align:center;font-size:12px;color:#94a3b8;margin:6px 0 14px}
label{display:block;color:#00ffcc;font-size:13px;font-weight:700;margin:14px 0 6px}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
video{width:100%;height:320px;border-radius:12px;background:#000;object-fit:cover;margin-top:12px;border:3px solid #00ffcc}
button{border:none;padding:14px;font-size:16px;border-radius:10px;cursor:pointer;margin-top:10px;font-weight:700;width:100%}
.btn-main{background:#00ffcc;color:#000}
.btn-test{background:#7c3aed;color:#fff}
.btn-voice{background:#d97706;color:#fff}
.btn-map{background:#0284c7;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
#status{text-align:center;margin:10px 0;font-weight:700}
#sensorBox{text-align:center;padding:12px;background:#064e3b;border-radius:10px;margin-top:10px;font-size:14px}
#debug{margin-top:10px;padding:10px;background:#000;border-radius:10px;font-size:12px;color:#a7f3d0;min-height:60px;text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<div class="top">
<h2>SMART KING</h2>
<div class="sub">MOBILE IS YOUR EYE - FIXED VERSION</div>

<label>SELECT LANGUAGE</label>
<select id="voiceLanguage">
<option value="ur-PK" selected>Urdu</option>
<option value="en-US">English</option>
<option value="hi-IN">Hindi</option>
</select>

<label>DESTINATION</label>
<input type="text" id="destinationInput" placeholder="e.g. Okara Bazar">
<button id="openMapsBtn" class="btn-map">OPEN MAPS</button>

<div id="status">STATUS: OFF</div>

<button id="startBtn" class="btn-main">START - CAMERA + SENSOR ON</button>
<button id="testBtn" class="btn-test">TEST NOW - Abhi Samne Kya Hai? Batao</button>
<button id="voiceBtn" class="btn-voice">VOICE COMMAND</button>
<button id="stopBtn" class="btn-stop" style="display:none;">STOP</button>

<video id="webcam" autoplay playsinline muted></video>

<div id="sensorBox">SENSOR: OFF</div>
<div id="debug">Debug yahan aayega...</div>
</div>

<script>
const video=document.getElementById('webcam');
const sensorBox=document.getElementById('sensorBox');
const statusEl=document.getElementById('status');
const debugEl=document.getElementById('debug');
const langSel=document.getElementById('voiceLanguage');
let stream=null, isLive=false, model=null, timer=null, lastSpoken="", lastSpeakTime=0, audioCtx=null, lastBrightness=0;

function speakText(t){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=langSel.value; u.rate=0.95;
  window.speechSynthesis.speak(u);
  debugEl.innerText="BOLA: "+t;
}
function playTone(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
    o.start(); o.stop(audioCtx.currentTime+0.4);
  }catch(e){}
}
function vibrateStrong(){ if(navigator.vibrate) navigator.vibrate([300,100,300,100,300]); }
function vibrateLight(){ if(navigator.vibrate) navigator.vibrate([120]); }

function getUrduName(en){
  const m={'person':'samne ek insan hai','chair':'samne kursi hai','couch':'samne sofa hai','bed':'samne bed hai','dining table':'samne table hai','car':'samne gari hai','motorcycle':'samne bike hai','bicycle':'samne cycle hai','dog':'samne kutta hai','cat':'samne billi hai','tv':'samne TV hai','laptop':'samne laptop hai','book':'samne kitab hai','bottle':'samne bottle hai','cell phone':'samne mobile hai','oven':'samne chulha hai','sink':'samne sink hai','refrigerator':'samne fridge hai','toilet':'samne toilet hai'};
  return m[en] || ('samne '+en+' hai');
}

async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    video.srcObject=stream; await video.play(); return true;
  }catch(e){
    try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); video.srcObject=stream; await video.play(); return true; }
    catch(e2){ speakText('Camera ki ijazat dein, upar Lock par click kar ke Camera Allow karein'); return false; }
  }
}

// DEEWAR DETECTION - Naya system
function checkWall(){
  if(!video.videoWidth) return null;
  const c=document.createElement('canvas');
  c.width=60; c.height=45;
  const ctx=c.getContext('2d');
  ctx.drawImage(video,0,0,60,45);
  const d=ctx.getImageData(0,0,60,45).data;
  let r=0,g=0,b=0, total=60*45;
  let variance=0;
  for(let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; }
  let avgR=r/total, avgG=g/total, avgB=b/total;
  for(let i=0;i<d.length;i+=4){ variance += Math.abs(d[i]-avgR) + Math.abs(d[i+1]-avgG) + Math.abs(d[i+2]-avgB); }
  variance = variance / total;
  // Agar variance boht kam hai matlab poori screen ek hi rang ki hai = Deewar / Darwaza bilkul qareeb hai
  // Aur brightness bhi check karo
  return {variance: variance, avg: (avgR+avgG+avgB)/3};
}

async function detectNow(isTest=false){
  if(!model) return;
  if(!video.videoWidth) return;
  const now=Date.now();

  // 1. Pehle COCO se cheez dekho
  let found=[];
  try{ const preds=await model.detect(video); found=preds.filter(p=>p.score>0.40); found.sort((a,b)=>(b.bbox[2]*b.bbox[3])-(a.bbox[2]*a.bbox[3])); }catch(e){}

  // 2. Deewar check karo
  const wallInfo=checkWall();
  const isWall = wallInfo && wallInfo.variance < 18;

  debugEl.innerText="Dekha: "+(found.length? found.map(f=>f.class+" "+Math.round(f.score*100)+"%").join(", ") : "koi object nahi")+"\nDeewar Check: variance="+Math.round(wallInfo.variance)+" (18 se kam = Deewar)";

  if(found.length>0){
    const obj=found[0].class;
    const txt=getUrduName(obj);
    if(isTest || txt!==lastSpoken || now-lastSpeakTime>5000){
      lastSpoken=txt; lastSpeakTime=now;
      playTone(); vibrateLight();
      sensorBox.style.background="#7f1d1d";
      sensorBox.innerText="SENSOR: OBJECT FOUND - "+obj.toUpperCase();
      speakText('Ruk jayen, '+txt+', aahista baien ho jayen.');
    }
    return;
  }

  if(isWall){
    if(isTest || lastSpoken!=="deewar" || now-lastSpeakTime>4000){
      lastSpoken="deewar"; lastSpeakTime=now;
      playTone(); vibrateStrong();
      sensorBox.style.background="#7f1d1d";
      sensorBox.innerText="SENSOR: WALL / BARI RUKAWAT - QAREEB HAI";
      speakText('Ruk jayen, samne deewar ya bari rukawat hai, peeche haten ya baien ho jayen.');
    }
    return;
  }

  // 3. Agar kuch bhi nahi mila to ab "Rasta Saaf" har dafa mat bolo, sirf test me bolo
  if(isTest){
    speakText('Samne koi bari cheez nazar nahi aa rahi, aahista aage barhen.');
    sensorBox.style.background="#064e3b";
    sensorBox.innerText="SENSOR: KOI OBJECT NAHI MILA - TEST";
  } else {
    sensorBox.style.background="#064e3b";
    sensorBox.innerText="SENSOR: SCANNING...";
    // Auto me har 8 sec me ek dafa hi bolo, bar bar nahi
    if(now-lastSpeakTime>8000){
      lastSpoken="clear"; lastSpeakTime=now;
      speakText('Rasta saaf lag raha hai, aahista chalte jayen.');
    }
  }
}

document.getElementById('startBtn').addEventListener('click', async ()=>{
  statusEl.innerText="STATUS: LOADING MODEL...";
  speakText('Model load ho raha hai, thora intezar karein, internet on rakhen.');
  if(!await ensureCamera()) return;
  try{ if(!model) model=await cocoSsd.load(); }
  catch(e){ speakText('Internet on karein, model load nahi hua.'); statusEl.innerText="STATUS: MODEL FAIL - Internet Check Karen"; return; }
  isLive=true;
  statusEl.innerText="STATUS: LIVE - OBJECT + WALL DETECTION ON";
  document.getElementById('startBtn').style.display="none";
  document.getElementById('stopBtn').style.display="block";
  speakText('Camera aur Sensor on ho gaya hai. Ab main deewar ko bhi bataungi, table bed ko bhi bataungi.');
  timer=setInterval(()=>detectNow(false), 2000);
});

document.getElementById('testBtn').addEventListener('click', async ()=>{
  if(!isLive){ speakText('Pehle START dabayen.'); return; }
  speakText('Rukiye, main abhi dekh kar batati hoon.');
  setTimeout(()=>detectNow(true), 600);
});

document.getElementById('stopBtn').addEventListener('click', ()=>{
  isLive=false; clearInterval(timer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null;
  window.speechSynthesis.cancel();
  statusEl.innerText="STATUS: OFF";
  document.getElementById('startBtn').style.display="block";
  document.getElementById('stopBtn').style.display="none";
});

document.getElementById('voiceBtn').addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  const rec=new SR(); rec.lang='ur-PK';
  rec.onresult=(e)=>{
    const q=e.results[0][0].transcript;
    if(q.includes('samne')||q.includes('kya hai')){ speakText('Rukiye, dekh kar batati hoon.'); setTimeout(()=>detectNow(true),600); }
    else speakText('Main sun rahi hoon.');
  };
  rec.start(); speakText('Ji bolein.');
});

document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q=document.getElementById('destinationInput').value.trim();
  if(!q){ speakText('Pehle upar likhen kahan jana hai.'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
</body>
</html>
