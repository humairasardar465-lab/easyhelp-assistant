function getT(key) { const lang = langSel.value; if (translations[lang] && translations[lang][key]) { return translations[lang][key]; } if (translations['ur-PK'][key]) return translations['ur-PK'][key]; return translations['en-US'][key] || key; }
function triggerVibration() { if (isSpeakingObstacle) return; if ('vibrate' in navigator) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} } }
function lightVibration() { if ('vibrate' in navigator) { try { navigator.vibrate(15); } catch (e) {} } }
function playBeep(type) {
  try {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    if (type === 'small') {
      const now = audioCtx.currentTime;
      [0, 0.16].forEach(function(offset) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine'; o.frequency.setValueAtTime(880, now + offset);
        g.gain.setValueAtTime(0.12, now + offset);
        g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
        o.start(now + offset); o.stop(now + offset + 0.12);
      });
      return;
    }
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'clear') {
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'obstacle') {
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(180, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.setValueAtTime(0.3, now + 0.1);
      osc.start(now); osc.stop(now + 0.22);
    }
  } catch (e) {}
}
function speak(text, isObstacle = false) {
  if (!text) return;
  if (!('speechSynthesis' in window)) return;
  const now = Date.now();
  if (text === lastSpoken && now - lastSpeakTime < 2000 && !isObstacle) return;
  if (isObstacle && currentMode !== "obstacle") { window.speechSynthesis.cancel(); }
  if (!isObstacle && isSpeakingObstacle) return;
  if (isObstacle) { window.speechSynthesis.cancel(); }
  lastSpoken = text; lastSpeakTime = now;
  if (isObstacle) { isSpeakingObstacle = true; }
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langSel.value;
  utterance.onend = () => { if (isObstacle) { setTimeout(() => { isSpeakingObstacle = false; }, 50); } };
  utterance.onerror = () => { if (isObstacle) { setTimeout(() => { isSpeakingObstacle = false; }, 50); } };
  window.speechSynthesis.speak(utterance);
}
async function waitForMediapipe() {
  if (window.FilesetResolver && window.ObjectDetector) return true;
  return new Promise(function(resolve) {
    let done = false;
    const t = setTimeout(function() { if (!done) { done = true; resolve(false); } }, 15000);
    window.addEventListener('mediapipe-loaded', function() { if (!done) { done = true; clearTimeout(t); resolve(true); } }, { once: true });
  });
}
async function initDetector() {
  if (objectDetector) return true;
  if (isDetectorLoading) return false;
  isDetectorLoading = true;
  try {
    statusEl.innerText = getT('loading');
    const ok = await waitForMediapipe();
    if (!ok) { throw new Error('mediapipe timeout'); }
    const vision = await window.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm");
    const detectorPromise = window.ObjectDetector.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite", delegate: "CPU" }, scoreThreshold: 0.50, runningMode: "VIDEO" });
    const timeoutPromise = new Promise(function(_, reject) { setTimeout(function() { reject(new Error('model timeout')); }, 15000); });
    objectDetector = await Promise.race([detectorPromise, timeoutPromise]);
    isDetectorLoading = false;
    return true;
  } catch (err) {
    console.error(err);
    isDetectorLoading = false;
    objectDetector = null;
    if (isLive) { statusEl.innerText = getT('netError'); speak(getT('netError'), false); }
    return false;
  }
}
async function startCamera() {
  try {
    if (isLive || stream) return;
    statusEl.innerText = getT('loading');
    startBtn.innerText = 'PLEASE WAIT...';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { statusEl.innerText = getT('camError'); speak(getT('camError'), false); startBtn.innerText = 'START'; return; }
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = stream;
    video.onloadedmetadata = async () => {
      try { await video.play(); } catch(e) {}
      isLive = true; statusEl.innerText = getT('started'); speak(getT('started'), false);
      startBtn.style.display = 'none'; stopBtn.style.display = 'block';
      window.requestAnimationFrame(predictWebcam);
      const ok = await initDetector();
      if (!ok && isLive) { statusEl.innerText = getT('netError'); }
    };
  } catch (err) {
    console.error(err);
    startBtn.innerText = 'START';
    statusEl.innerText = getT('camError'); speak(getT('camError'), false);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
}
let lastVideoTime = -1;
async function predictWebcam() {
  if (!isLive) return;
  if (!objectDetector) {
    if (isLive) { window.requestAnimationFrame(predictWebcam); }
    return;
  }
  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime; frameCount++;
    try {
      const startTimeMs = performance.now();
      const detections = objectDetector.detectForVideo(video, startTimeMs);
      const hasObjectDetected = detections && detections.detections && detections.detections.length > 0;
      if (!hasObjectDetected) { nothingCount++; handleClearPath(); }
      else {
        nothingCount = 0; clearWaitCount = 0;
        const videoWidth = video.videoWidth || 640;
        const videoHeight = video.videoHeight || 480;
        const videoArea = videoWidth * videoHeight;
        // بیچ والا رستہ چیک کرنا - 30% سے 70% تک
        const centerLeft = videoWidth * 0.30;
        const centerRight = videoWidth * 0.70;
        let centerBlocked = false;
        let centerBlockArea = 0;
        let leftCount = 0, rightCount = 0, centerCount = 0;
        let biggest = null, biggestArea = 0;
        let wallDetected = false;
        for (let det of detections.detections) {
          const bb = det.boundingBox;
          const area = bb.width * bb.height;
          const conf = det.categories[0].score * 100;
          if (conf < 50) continue;
          const cx = bb.originX + bb.width / 2;
          const ratio = area / videoArea;
          // دیوار والا چیک - بہت بڑی کھڑی چیز
          const aspect = bb.height / Math.max(1, bb.width);
          if (ratio > 0.35 && aspect > 1.2) { wallDetected = true; }
          if (ratio > 0.02) {
            if (cx < centerLeft) leftCount++;
            else if (cx > centerRight) rightCount++;
            else { centerCount++; centerBlocked = true; if (area > centerBlockArea) centerBlockArea = area; }
            if (area > biggestArea) { biggestArea = area; biggest = det; }
          }
        }
        // اگر بیچ خالی ہے تو سیدھا چلنے دو، چاہے دائیں بائیں چیزیں ہوں
        if (!centerBlocked && (leftCount > 0 || rightCount > 0)) {
          centerClearCount++;
          if (centerClearCount >= 3) {
            const txt = getT('centerClear');
            statusEl.innerText = txt;
            const now = Date.now();
            if (currentMode !== "centerClear" || now - lastObstacleAlertTime > 4000) {
              currentMode = "centerClear"; lastObstacleAlertTime = now;
              if (isSpeakingObstacle) { window.speechSynthesis.cancel(); isSpeakingObstacle = false; }
              speak(txt, false);
            }
            if (now - lastClearSoundTime > 1000) { lastClearSoundTime = now; playBeep('clear'); }
            obstacleConfirmCount = 0;
          }
        } else if (wallDetected) {
          const txt = getT('wallObs');
          statusEl.innerText = txt;
          const now = Date.now();
          if (currentMode !== "obstacle" || now - lastObstacleAlertTime > 4000) { currentMode = "obstacle"; lastObstacleAlertTime = now; triggerVibration(); speak(txt, true); }
        } else if (centerBlocked) {
          obstacleConfirmCount++;
          centerClearCount = 0;
          if (obstacleConfirmCount >= 5) {
            let txt = "";
            const total = leftCount + rightCount + centerCount;
            if (total >= 3) txt = getT('multiObs');
            else if (centerCount > 0 && leftCount === 0 && rightCount === 0) txt = getT('centerObs');
            else if (leftCount > 0 && rightCount === 0 && centerCount > 0) txt = getT('leftObs');
            else if (rightCount > 0 && leftCount === 0 && centerCount > 0) txt = getT('rightObs');
            else txt = getT('centerObs');
            // سیڑھی والا اندازہ - اگر بیچ میں بڑی چوڑی چیز ہے تو سیڑھی ہو سکتی ہے
            if (biggest && (biggest.boundingBox.width / videoWidth) > 0.6) {
              // بہت چوڑی چیز - سیڑھی یا دیوار ہو سکتی ہے
            }
            statusEl.innerText = txt;
            const now = Date.now();
            if (currentMode !== "obstacle" || lastObstacleName !== txt || now - lastObstacleAlertTime > 4000) {
              currentMode = "obstacle"; lastObstacleName = txt; lastObstacleAlertTime = now;
              triggerVibration(); speak(txt, true);
            }
            if (now - lastBeepTime > 800) { lastBeepTime = now; const sr = biggestArea / videoArea; if (sr >= 0.15) playBeep('obstacle'); else playBeep('small'); }
          }
        } else {
          handleClearPath();
        }
      }
    } catch (e) { console.error(e); }
  }
  if (isLive) { window.requestAnimationFrame(predictWebcam); }
}
function handleClearPath() {
  obstacleConfirmCount = 0; centerClearCount = 0;
  const now = Date.now();
  if (currentMode !== "clear") {
    currentMode = "clear"; lastObstacleName = "";
    if (isSpeakingObstacle) { window.speechSynthesis.cancel(); isSpeakingObstacle = false; }
    speak(getT('clearPath'), false); lastClearSpeakTime = now;
  }
  statusEl.innerText = getT('clearPath');
  if (now - lastClearSoundTime > 1000) { lastClearSoundTime = now; playBeep('clear'); }
  if (now - lastClearSpeakTime > 8000) { lastClearSpeakTime = now; speak(getT('clearPath'), false); }
}
function stopCamera() {
  if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
  if ('vibrate' in navigator) { try { navigator.vibrate(0); } catch(e){} }
  isLive = false;
  if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
  video.srcObject = null; statusEl.innerText = "STATUS: OFF"; startBtn.style.display = 'block'; startBtn.innerText = 'START'; stopBtn.style.display = 'none';
  isSpeakingObstacle = false; clearWaitCount = 0; currentMode = "clear"; lastObstacleName = ""; lastObstacleAlertTime = 0; obstacleConfirmCount = 0; isDetectorLoading = false; centerClearCount = 0;
}
langSel.addEventListener('change', () => { lightVibration(); });
langSel.addEventListener('click', () => { lightVibration(); });
destinationInput.addEventListener('focus', () => { lightVibration(); });
destinationInput.addEventListener('click', () => { lightVibration(); });
startBtn.addEventListener('click', async () => { lightVibration(); await startCamera(); });
stopBtn.addEventListener('click', () => { lightVibration(); stopCamera(); });
openMapsBtn.addEventListener('click', () => { lightVibration(); const dest = destinationInput.value.trim(); if (dest) { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank'); } else { window.open(`https://www.google.com/maps`, '_blank'); } });
waBtn.addEventListener('click', () => { lightVibration(); });
</script>
