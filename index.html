<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyHelp Smart Cane & GPS Assistant</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #38bdf8;
            --bg-gradient: radial-gradient(circle at 50% 10%, #0f172a 0%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.94);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: var(--border-radius);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            padding: 28px;
            margin-bottom: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            font-weight: 700;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.92rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, input, button {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(30, 41, 59, 0.9);
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, input:focus, button:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 12px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 8px;
            color: white;
        }

        .camera-container {
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            margin-top: 12px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.92);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #38bdf8;
            text-align: center;
            border: 1px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(8px);
            font-weight: 600;
        }

        .map-frame {
            width: 100%;
            height: 240px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 16px;
        }

        footer {
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: auto;
            padding: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>EasyHelp Smart Cane & GPS</h1>
            <p>Created by Humaira Sardar - Amazon Collection</p>
        </header>

        <!-- 1. Voice & Translation Language Selection -->
        <div class="control-group">
            <label for="voiceLanguage">Voice & Screen Reader Language</label>
            <select id="voiceLanguage">
                <option value="ur-PK" selected>Urdu (Pakistan - اردو)</option>
                <option value="en-US">English (United States)</option>
                <option value="hi-IN">Hindi (India - हिंदी)</option>
                <option value="ar-SA">Arabic (Saudi Arabia - العربية)</option>
                <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
            </select>
        </div>

        <!-- 2. Indoor Custom Location Input -->
        <div class="control-group">
            <label for="customIndoorLocation">Indoor Venue / School / Room Name</label>
            <input type="text" id="customIndoorLocation" value="Govt Gunj Shakar Special Education Centre Okara" placeholder="Enter school, office or room name...">
        </div>

        <!-- 3. Live Current GPS & Map Action -->
        <div class="control-group">
            <button class="btn-secondary" id="fetchCurrentGPSBtn">📍 Get Live Current GPS & Update Map</button>
        </div>

        <!-- 4. Live Rear Camera Vision Stream with Manual Start Option -->
        <div class="control-group">
            <label>Live AI Assistant Rear Camera & Obstacle Detection</label>
            <button class="btn-secondary" id="startCameraBtn" style="background: #0284c7; margin-bottom: 8px;">📷 Turn On Rear Camera</button>
            <div class="camera-container">
                <video id="webcam" autoplay playsinline muted></video>
                <div class="camera-overlay" id="cameraStatusOverlay">Camera is offline. Click 'Turn On Rear Camera' or Start Guidance.</div>
            </div>
        </div>

        <!-- 5. Live Google Maps Integration -->
        <div class="control-group">
            <label>Live Google Map Navigation View</label>
            <iframe class="map-frame" id="liveMapFrame" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13783.5!2d73.1114!3d30.8138!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDQ4JzQ5LjciTiA3M8KwMDYnNDEuMSJF!5e0!3m2!1sen!2s!4v1650000000000"></iframe>
        </div>

        <!-- Main Autonomous Navigation Trigger Button -->
        <button class="btn-primary" id="startFullNavBtn">Start Autonomous Step-by-Step AI Guidance</button>
    </div>

    <footer>
        Empowering Independent Mobility, Step by Step.
    </footer>

    <script>
        const startFullNavBtn = document.getElementById('startFullNavBtn');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const fetchCurrentGPSBtn = document.getElementById('fetchCurrentGPSBtn');
        const voiceLanguageSelect = document.getElementById('voiceLanguage');
        const customIndoorLocationInput = document.getElementById('customIndoorLocation');
        const webcam = document.getElementById('webcam');
        const cameraStatusOverlay = document.getElementById('cameraStatusOverlay');
        const liveMapFrame = document.getElementById('liveMapFrame');

        let videoStream = null;
        let isNavigating = false;

        // Function to Announce Speech
        function speak(text, lang = 'ur-PK') {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
            cameraStatusOverlay.innerText = text;
        }

        // Force Rear Camera Initialization
        async function initRearCamera() {
            try {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                // Try exact environment rear camera first
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } }, 
                    audio: false 
                });
                webcam.srcObject = videoStream;
                speak("پچھلا کیمرہ کامیابی سے آن ہو گیا ہے۔", voiceLanguageSelect.value);
            } catch (e1) {
                try {
                    // Fallback to general environment camera
                    videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" }, 
                        audio: false 
                    });
                    webcam.srcObject = videoStream;
                    speak("کیمرہ آن کر دیا گیا ہے۔", voiceLanguageSelect.value);
                } catch (e2) {
                    cameraStatusOverlay.innerText = "Camera access denied or unavailable on browser.";
                    speak("براہ کرم براؤزر کیمرے کی پرمشن (Permission) الاؤ کریں۔", voiceLanguageSelect.value);
                }
            }
        }

        // Manual Camera Button Click
        startCameraBtn.addEventListener('click', () => {
            initRearCamera();
        });

        // Fetch Live Current GPS Button
        fetchCurrentGPSBtn.addEventListener('click', () => {
            const lang = voiceLanguageSelect.value;
            if ("geolocation" in navigator) {
                speak("آپ کی موجودہ لائیو لوکیشن حاصل کی جا رہی ہے...", lang);
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    liveMapFrame.src = `https://maps.google.com/maps?q=${lat},${lon}&z=19&output=embed`;
                    speak("لائیو لوکیشن اور نقشہ اپ ڈیٹ ہو چکا ہے۔", lang);
                }, (error) => {
                    speak("جیو لوکیشن حاصل کرنے میں خامی پیش آئی۔ براہ کرم لوکیشن آن کریں۔", lang);
                }, { enableHighAccuracy: true });
            } else {
                speak("آپ کا براؤزر جیو لوکیشن سپورٹ نہیں کرتا۔", lang);
            }
        });

        // Main Autonomous Navigation Trigger Button
        startFullNavBtn.addEventListener('click', () => {
            const currentLang = voiceLanguageSelect.value;
            const locationName = customIndoorLocationInput.value || "مرکزی مقام";
            
            // Auto start camera if not started
            if (!videoStream) {
                initRearCamera();
            }

            isNavigating = true;
            speak(`خوش آمدید! آپ ${locationName} میں موجود ہیں۔ نیویگیشن شروع کی جا رہی ہے۔`, currentLang);

            // Step-by-step guidance simulation combining Indoor/Outdoor & Obstacle alerts
            let steps = [];
            if (currentLang.startsWith('ur')) {
                steps = [
                    `توجہ فرمائیں! سامنے 5 میٹر کے فاصلے پر راستہ بالکل صاف ہے۔ سیدھے چلیں۔`,
                    `دائیں جانب دروازہ موجود ہے، بائیں طرف ہلکا سا گھماؤ ہے۔`,
                    `آگے سیڑھیاں آ رہی ہیں، براہ کرم احتیاط سے قدم آگے بڑھائیں۔`,
                    `آپ اپنی منزل کے بالکل قریب پہنچ چکے ہیں۔`
                ];
            } else {
                steps = [
                    `Attention! Path is clear 5 meters ahead. Walk straight.`,
                    `Door detected on the right side. Keep left.`,
                    `Caution! Stairs ahead. Please step carefully.`,
                    `You are arriving at your destination.`
                ];
            }

            steps.forEach((stepText, index) => {
                setTimeout(() => {
                    if (isNavigating) {
                        speak(stepText, currentLang);
                    }
                }, (index + 1) * 5000); // Every 5 seconds guidance update
            });
        });
    </script>
</body>
</html>
