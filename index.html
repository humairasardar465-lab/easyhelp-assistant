function makeObstacleText(enName, cx, videoWidth, isSmall) {
  const name = getObjectName(enName);
  const lang = langSel.value;
  if (lang === 'ur-PK') {
    if (isSmall) {
      if (cx < videoWidth * 0.35) return 'بائیں طرف چھوٹی سی ' + name + ' ہے';
      if (cx > videoWidth * 0.65) return 'دائیں طرف چھوٹی سی ' + name + ' ہے';

function triggerVibration() { if (isSpeakingObstacle) return; if ('vibrate' in navigator) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} } }
function lightVibration() { if ('vibrate' in navigator) { try { navigator.vibrate(15); } catch (e) {} } }
function playBeep(type) {
  try {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }

      const now = audioCtx.currentTime;

        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();

    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'clear') { osc.frequency.setValueAtTime(659.25, audioCtx.currentTime); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); osc.start(); osc.stop(audioCtx.currentTime + 0.1); }

  } catch (e) {}

function speak(text, isObstacle = false) {
  if (!text) return;
  if (!('speechSynthesis' in window)) return;
  const now = Date.now();
  if (text === lastSpoken && now - lastSpeakTime < 2500 && !isObstacle) return;
  if (isObstacle && currentMode !== "obstacle") { window.speechSynthesis.cancel(); }
  if (!isObstacle && isSpeakingObstacle) return;
  if (isObstacle) { window.speechSynthesis.cancel(); }

  if (isObstacle) { isSpeakingObstacle = true; }
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langSel.value;
  utterance.onend = () => { if (isObstacle) { setTimeout(() => { isSpeakingObstacle = false; }, 50); } };
  utterance.onerror = () => { if (isObstacle) { setTimeout(() => { isSpeakingObstacle = false; }, 50); } };

}
async function waitForMediapipe() {
  if (window.FilesetResolver && window.ObjectDetector) return true;
  return new Promise(function(resolve) {
    let done = false;
    const t = setTimeout(function() { if (!done) { done = true; resolve(false); } }, 15000);
    window.addEventListener('mediapipe-loaded', function() { if (!done) { done = true; clearTimeout(t); resolve(true); } }, { once: true });
  });
}
async function initDetector() {
  if (objectDetector) return true;
  if (isDetectorLoading) return false;
  isDetectorLoading = true;
  try {
    statusEl.innerText = getT('loading');
    const ok = await waitForMediapipe();
    if (!ok) { throw new Error('mediapipe timeout'); }
    const vision = await window.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm");
    const detectorPromise = window.ObjectDetector.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite", delegate: "CPU" }, scoreThreshold: 0.30, runningMode: "VIDEO" });

    console.error(err);

              statusEl.innerText = txt;
              const now = Date.now();
              if (currentMode !== "obstacle" || lastObstacleName !== txt || now - lastObstacleAlertTime > 3500) {
                currentMode = "obstacle"; lastObstacleName = txt; lastObstacleAlertTime = now;
                centerClearSpoken = false;
                if (!isSmall && !isWall) { if (biggest.ratio >= 0.02) triggerVibration(); }
                if (isWall) triggerVibration();
                speak(txt, true);
              }
              if (now - lastBeepTime > 900) { lastBeepTime = now; if (biggest.ratio >= 0.15) playBeep('obstacle'); else playBeep('small'); }
            }
          }
        }
      }
    } catch (e) { console.error(e); }
  }
  if (isLive) { window.requestAnimationFrame(predictWebcam); }
}
function handleClearPath() {
  obstacleConfirmCount = 0;
  const now = Date.now();
  if (currentMode !== "clear") {
    currentMode = "clear"; lastObstacleName = "";
    if (isSpeakingObstacle) { window.speechSynthesis.cancel(); isSpeakingObstacle = false; }
    speak(getT('clearPath'), false); lastClearSpeakTime = now;
  }
  statusEl.innerText = getT('clearPath');
  if (now - lastClearSoundTime > 1000) { lastClearSoundTime = now; playBeep('clear'); }
  if (now - lastClearSpeakTime > 8000) { lastClearSpeakTime = now; speak(getT('clearPath'), false); }
}
function stopCamera() {
  if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
  if ('vibrate' in navigator) { try { navigator.vibrate(0); } catch(e){} }
  isLive = false;
  if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
  video.srcObject = null; statusEl.innerText = "STATUS: OFF"; startBtn.style.display = 'block'; startBtn.innerText = 'START'; stopBtn.style.display = 'none';
  isSpeakingObstacle = false; currentMode = "clear"; lastObstacleName = ""; lastObstacleAlertTime = 0; obstacleConfirmCount = 0; isDetectorLoading = false; centerClearSpoken = false;
}
langSel.addEventListener('change', () => { lightVibration(); });
langSel.addEventListener('click', () => { lightVibration(); });
destinationInput.addEventListener('focus', () => { lightVibration(); });
destinationInput.addEventListener('click', () => { lightVibration(); });
startBtn.addEventListener('click', async () => { lightVibration(); await startCamera(); });
stopBtn.addEventListener('click', () => { lightVibration(); stopCamera(); });
openMapsBtn.addEventListener('click', () => { lightVibration(); const dest = destinationInput.value.trim(); if (dest) { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank'); } else { window.open(`https://www.google.com/maps`, '_blank'); } });
waBtn.addEventListener('click', () => { lightVibration(); });
</script>
