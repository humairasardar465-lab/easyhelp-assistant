<script>
const video = document.getElementById('webcam');
const statusEl = document.getElementById('status');
const langSel = document.getElementById('voiceLanguage');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const openMapsBtn = document.getElementById('openMapsBtn');
const destinationInput = document.getElementById('destinationInput');

let stream = null, isLive = false, objectDetector = null;
let lastSpoken = "", lastSpeakTime = 0, lastClearSoundTime = 0, lastBeepTime = 0, lastClearSpeakTime = 0;
let frameCount = 0, nothingCount = 0;
let currentMode = "clear"; 
let lastObstacleName = ""; 
let audioCtx = null;

let isSpeakingObstacle = false;
let clearWaitCount = 0;

// نئی لائن جو آپ نے بتائی ہے (ہر 4 سیکنڈ بعد بار بار یاد دہانی کے لیے)
let lastObstacleAlertTime = 0;

const translations = {
  'ur-PK': {
    loading: 'سنسور آن ہو رہا ہے۔ براہ کرم انتظار کریں۔',
    started: 'اسمارٹ کین آن ہے۔ کیمرہ اور سنسور ایکٹو ہیں۔',
    stopClose: 'الرٹ ہو جاؤ، آگے رکاوٹ ہے',
    clearPath: 'رستہ صاف ہے، آگے بڑھیں۔',
    camError: 'کیمرہ کی اجازت دیں',
    netError: 'انٹرنیٹ یا ماڈل لوڈنگ کا مسئلہ'
  },
  'en-US': {
    loading: 'Sensor turning on. Please wait.',
    started: 'Smart Cane is on. Camera active.',
    stopClose: 'Alert, obstacle ahead',
    clearPath: 'Path is clear, move forward.',
    camError: 'Allow camera access',
    netError: 'Internet or model loading issue'
  },
  'hi-IN': {
    loading: 'सेंसर चालू हो रहा है।',
    started: 'स्मार्ट केन चालू है।',
    stopClose: 'अलर्ट, आगे बाधा है',
    clearPath: 'रास्ता साफ है, आगे बढ़ें।',
    camError: 'कैमरा अनुमति दें',
    netError: 'इंटरनेट या मॉडल समस्या'
  },
  'ar-SA': {
    loading: 'جاري تشغيل المستشعر.',
    started: 'العصا الذكية تعمل.',
    stopClose: 'تنبيه، عقبة أمامك',
    clearPath: 'الطريق نظيف، تقدم.',
    camError: 'السماح بالكاميرا',
    netError: 'مشكلة في الإنترنت أو النموذج'
  },
  'pa-IN': {
    loading: 'ਸੈਂਸਰ ਚਾਲੂ ਹੋ ਰਿਹਾ ਹੈ।',
    started: 'ਸਮਾਰਟ ਕੇਨ ਚਾਲੂ ਹੈ।',
    stopClose: 'ਅਲਰਟ, ਅੱਗੇ رکاوਟ है',
    clearPath: 'ਰਸਤਾ ਸਾਫ਼ ਹੈ!',
    camError: 'ਕੈਮਰਾ ਅਨੁਮਤੀ ਦਿਓ',
    netError: 'ਇੰਟਰਨੈਟ ਜਾਂ ਮਾਡل ਸਮੱਸਿਆ'
  },
  'ps-PK': {
    loading: 'سنسور روان دی. مهرباني وکئ انتظار وکئ.',
    started: 'سمارټ کین روان دی.',
    stopClose: 'خبردار، مخکې خنډ دی',
    clearPath: 'لار سمه ده، مخکې لاړ شئ.',
    camError: 'د کامرې اجازه ورکړئ',
    netError: 'د انټرنیټ ستونزه'
  },
  'fa-IR': {
    loading: 'سنسور در حال روشن شدن است.',
    started: 'اسمارت کین روشن است.',
    stopClose: 'هشدار، مانع جلو است',
    clearPath: 'مسیر تمیز است، جلو بروید.',
    camError: 'اجازه دسترسی به دوربین',
    netError: 'مشکل اینترنت'
  }
};

function getLocalizedName(category) {
  return "رکاوٹ ہے";
}

function getT(key) {
  const lang = langSel.value;
  if (translations[lang] && translations[lang][key]) {
    return translations[lang][key];
  }
  return translations['en-US'][key] || key;
}

function triggerVibration() {
  if (isSpeakingObstacle) return; 
  if ('vibrate' in navigator) {
    try { navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
}

function playBeep(type) {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'clear') {
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'obstacle') {
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(180, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.setValueAtTime(0.3, now + 0.1);
      osc.start(now);
      osc.stop(now + 0.22);
    }
  } catch (e) {}
}

function speak(text, isObstacle = false) {
  if (!text) return;
  if (!('speechSynthesis' in window)) return;

  const now = Date.now();
  
  if (!isObstacle && isSpeakingObstacle) return;

  if (text === lastSpoken && now - lastSpeakTime < 4000) return;

  window.speechSynthesis.cancel();

  lastSpoken = text;
  lastSpeakTime = now;

  if (isObstacle) {
    isSpeakingObstacle = true;
  }

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langSel.value;
  
  utterance.onend = () => {
    if (isObstacle) {
      setTimeout(() => { isSpeakingObstacle = false; }, 50);
    }
  };

  utterance.onerror = () => {
    if (isObstacle) {
      setTimeout(() => { isSpeakingObstacle = false; }, 50);
    }
  };

  window.speechSynthesis.speak(utterance);
}

async function initDetector() {
  if (objectDetector) return;
  
  if (!window.FilesetResolver || !window.ObjectDetector) {
    await new Promise(resolve => {
      window.addEventListener('mediapipe-loaded', resolve, { once: true });
      setTimeout(resolve, 3000);
    });
  }

  try {
    statusEl.innerText = getT('loading');
    const vision = await window.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm"
    );
    objectDetector = await window.ObjectDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
        delegate: "CPU"
      },
      scoreThreshold: 0.4,
      runningMode: "VIDEO"
    });
  } catch (err) {
    console.error(err);
    statusEl.innerText = getT('netError');
    speak(getT('netError'), false);
  }
}

async function startCamera() {
  try {
    if (isLive || stream) return;

    await initDetector();

    if (!objectDetector) {
      statusEl.innerText = getT('netError');
      speak(getT('netError'), false);
      return;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      isLive = true;
      statusEl.innerText = getT('started');
      speak(getT('started'), false);
      startBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      window.requestAnimationFrame(predictWebcam);
    };
  } catch (err) {
    console.error(err);
    statusEl.innerText = getT('camError');
    speak(getT('camError'), false);
  }
}

let lastVideoTime = -1;

async function predictWebcam() {
  if (!isLive) return;

  if (!objectDetector) {
    if (isLive) {
      window.requestAnimationFrame(predictWebcam);
    }
    return;
  }

  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;
    frameCount++;

    try {
      const startTimeMs = performance.now();
      const detections = objectDetector.detectForVideo(video, startTimeMs);
      const hasObjectDetected = detections && detections.detections && detections.detections.length > 0;

      if (!hasObjectDetected) {
        nothingCount++;
      } else {
        nothingCount = 0;
        clearWaitCount = 0; 
      }

      if (hasObjectDetected) {
        let closest = detections.detections[0];
        let maxArea = 0;
        
        for (let det of detections.detections) {
          const area = det.boundingBox.width * det.boundingBox.height;
          if (area > maxArea) {
            maxArea = area;
            closest = det;
          }
        }

        const confidence = Math.round(closest.categories[0].score * 100);
        const requiredConfidence = 40;

        if (confidence >= requiredConfidence) {
          const videoWidth = video.videoWidth || 640;
          const videoArea = videoWidth * (video.videoHeight || 480);
          const sizeRatio = maxArea / videoArea;
          
          if (sizeRatio >= 0.005) {
            const fullObstacleText = getT('stopClose');
            statusEl.innerText = fullObstacleText;
            
            const now = Date.now();
            if (currentMode !== "obstacle" || lastObstacleName !== fullObstacleText || (now - lastObstacleAlertTime > 4000)) {
              currentMode = "obstacle";
              lastObstacleName = fullObstacleText;
              lastObstacleAlertTime = now; // وقت نوٹ کر لیا تاکہ ہر 4 سیکنڈ بعد دوبارہ الرٹ مل سکے
              triggerVibration();
              speak(fullObstacleText, true); 
            }

            if (now - lastBeepTime > 1000) {
              lastBeepTime = now;
              playBeep('obstacle');
            }
          } else {
            handleClearPath();
          }
        } else {
          handleClearPath();
        }
      } else {
        handleClearPath();
      }
    } catch (e) {
      console.error(e);
    }
  }

  if (isLive) {
    window.requestAnimationFrame(predictWebcam);
  }
}

function handleClearPath() {
  clearWaitCount++;
  if (clearWaitCount < 3) return; 

  const now = Date.now();
  if (currentMode !== "clear") {
    currentMode = "clear";
    lastObstacleName = "";
    speak(getT('clearPath'), false); 
    lastClearSpeakTime = now;
  }
  
  statusEl.innerText = getT('clearPath');
  
  if (now - lastClearSoundTime > 1500) {
    lastClearSoundTime = now;
    playBeep('clear');
  }

  if (now - lastClearSpeakTime > 10000) {
    lastClearSpeakTime = now;
    speak(getT('clearPath'), false); 
  }
}

function stopCamera() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
  if ('vibrate' in navigator) {
    try { navigator.vibrate(0); } catch(e){}
  }
  isLive = false;
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
  statusEl.innerText = "STATUS: OFF";
  startBtn.style.display = 'block';
  stopBtn.style.display = 'none';

  isSpeakingObstacle = false;
  clearWaitCount = 0;
  currentMode = "clear";
  lastObstacleName = "";
  lastObstacleAlertTime = 0;
}

startBtn.addEventListener('click', async () => {
  await startCamera();
});

stopBtn.addEventListener('click', () => {
  stopCamera();
});

openMapsBtn.addEventListener('click', () => {
  const dest = destinationInput.value.trim();
  if (dest) {
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank');
  } else {
    window.open(`https://www.google.com/maps`, '_blank');
  }
});
</script>
