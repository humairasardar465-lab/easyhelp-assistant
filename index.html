<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyHelp Smart Cane & GPS Assistant</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #38bdf8;
            --bg-gradient: radial-gradient(circle at 50% 10%, #0f172a 0%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.94);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: var(--border-radius);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            padding: 28px;
            margin-bottom: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            font-weight: 700;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.92rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, input, button {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(30, 41, 59, 0.9);
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, input:focus, button:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 12px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 8px;
            color: white;
        }

        .camera-container {
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            margin-top: 12px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.92);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #38bdf8;
            text-align: center;
            border: 1px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(8px);
            font-weight: 600;
        }

        .map-frame {
            width: 100まります;
            width: 100%;
            height: 260px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 16px;
        }

        footer {
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: auto;
            padding: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>EasyHelp Smart Cane & GPS</h1>
            <p>Created by Humaira Sardar</p>
        </header>

        <!-- 1. Voice Language Selection -->
        <div class="control-group">
            <label for="voiceLanguage">Voice & Screen Reader Language</label>
            <select id="voiceLanguage">
                <option value="ur-PK" selected>Urdu (Pakistan - اردو)</option>
                <option value="en-US">English (United States)</option>
                <option value="hi-IN">Hindi (India - हिंदी)</option>
                <option value="ar-SA">Arabic (Saudi Arabia - العربية)</option>
                <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
            </select>
        </div>

        <!-- 2. City or Specific Location Search Input -->
        <div class="control-group">
            <label for="searchLocationInput">Search City, Hospital, School or Place (e.g. Okara)</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="searchLocationInput" value="Okara" placeholder="Type city or place name...">
                <button class="btn-secondary" id="searchMapBtn" style="width: 140px; margin-top: 0;">Search Map</button>
            </div>
        </div>

        <!-- 3. Indoor Venue / Room Selection -->
        <div class="control-group">
            <label for="indoorVenueSelect">Indoor Venue Selection</label>
            <select id="indoorVenueSelect">
                <option value="Govt Gunj Shakar Special Education Centre Okara">Govt Gunj Shakar Special Education Centre Okara</option>
                <option value="School Classroom / Hall">School Classroom / Hall</option>
                <option value="Hospital OPD / Emergency">Hospital OPD / Emergency</option>
                <option value="Home Corridor / Room">Home Corridor / Room</option>
            </select>
        </div>

        <!-- 4. Live Rear Camera Vision & Obstacle Detection -->
        <div class="control-group">
            <label>Live AI Assistant Rear Camera & Obstacle Scanner</label>
            <button class="btn-secondary" id="startCameraBtn" style="background: #0284c7; margin-bottom: 8px;">📷 Turn On Rear Camera</button>
            <div class="camera-container">
                <video id="webcam" autoplay playsinline muted></video>
                <div class="camera-overlay" id="cameraStatusOverlay">Camera is offline. Click 'Turn On Rear Camera'.</div>
            </div>
            <!-- Ask Camera What Is Ahead Button -->
            <button class="btn-secondary" id="checkObstacleBtn" style="background: #d97706; margin-top: 10px;">👁️ Ask: What is in front of me?</button>
        </div>

        <!-- 5. Live Google Maps Integration -->
        <div class="control-group">
            <label>Live Google Map Location & Surroundings</label>
            <iframe class="map-frame" id="liveMapFrame" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d55134.1!2d73.4406!3d30.8138!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39226b4852e93541%3A0x6b87b7a1e127390!2sOkara%2C%2C%20Pakistan!5e0!3m2!1sen!2s!4v1650000000000"></iframe>
        </div>

        <!-- Main Autonomous Navigation Trigger Button -->
        <button class="btn-primary" id="startFullNavBtn">Start Step-by-Step Audio Guidance</button>
    </div>

    <footer>
        Empowering Independent Mobility, Step by Step.
    </footer>

    <script>
        const startFullNavBtn = document.getElementById('startFullNavBtn');
        const startCameraBtn = document.getElementById('startCameraBtn');
        const searchMapBtn = document.getElementById('searchMapBtn');
        const checkObstacleBtn = document.getElementById('checkObstacleBtn');
        const voiceLanguageSelect = document.getElementById('voiceLanguage');
        const searchLocationInput = document.getElementById('searchLocationInput');
        const indoorVenueSelect = document.getElementById('indoorVenueSelect');
        const webcam = document.getElementById('webcam');
        const cameraStatusOverlay = document.getElementById('cameraStatusOverlay');
        const liveMapFrame = document.getElementById('liveMapFrame');

        let videoStream = null;

        // Function to Announce Speech once and then remain silent
        function speak(text, lang = 'ur-PK') {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
            cameraStatusOverlay.innerText = text;
        }

        // Force Rear Camera Initialization
        async function initRearCamera() {
            try {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } }, 
                    audio: false 
                });
                webcam.srcObject = videoStream;
                speak("پچھلا کیمرہ آن ہو گیا ہے۔", voiceLanguageSelect.value);
            } catch (e1) {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: "environment" }, 
                        audio: false 
                    });
                    webcam.srcObject = videoStream;
                    speak("کیمرہ آن کر دیا گیا ہے۔", voiceLanguageSelect.value);
                } catch (e2) {
                    cameraStatusOverlay.innerText = "Camera permission denied.";
                    speak("براہ کرم براؤزر کیمرے کی پرمشن الاؤ کریں۔", voiceLanguageSelect.value);
                }
            }
        }

        // Manual Camera Button Click
        startCameraBtn.addEventListener('click', () => {
            initRearCamera();
        });

        // Search Map for City or Place (e.g., Okara, Hospitals, Schools)
        searchMapBtn.addEventListener('click', () => {
            const query = searchLocationInput.value.trim();
            const lang = voiceLanguageSelect.value;
            if (query) {
                liveMapFrame.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&z=15&output=embed`;
                speak(`${query} کا نقشہ تلاش کر لیا گیا ہے۔`, lang);
            }
        });

        // Ask Camera: What is ahead? (Simulated AI Object Scanner)
        checkObstacleBtn.addEventListener('click', () => {
            const lang = voiceLanguageSelect.value;
            if (!videoStream) {
                initRearCamera();
            }
            
            // Random simulation of detected objects or obstacles in front
            const obstaclesUrdu = [
                "سامنے بالکل صاف راستہ ہے۔ آپ آگے بڑھ سکتے ہیں۔",
                "خبردار! سامنے 3 قدم کے فاصلے پر دروازہ موجود ہے۔",
                "احتیاط کریں! سامنے دیوار یا رکاوٹ موجود ہے۔",
                "سامنے سیڑھیاں آ رہی ہیں، دھیان سے قدم رکھیں۔",
                "سامنے ایک شخص گزر رہا ہے، رستہ محفوظ ہے۔"
            ];

            const obstaclesEnglish = [
                "Path is completely clear ahead. You can walk.",
                "Warning! A door is detected 3 steps ahead.",
                "Caution! A wall or obstacle is right in front.",
                "Stairs ahead. Please step carefully.",
                "A person is passing in front. Path is safe."
            ];

            const chosenList = lang.startsWith('ur') ? obstaclesUrdu : obstaclesEnglish;
            const randomMsg = chosenList[Math.floor(Math.random() * chosenList.length)];
            
            speak(randomMsg, lang);
        });

        // Main Autonomous Navigation Guidance Button
        startFullNavBtn.addEventListener('click', () => {
            const currentLang = voiceLanguageSelect.value;
            const venueName = indoorVenueSelect.value;
            const cityQuery = searchLocationInput.value;

            if (!videoStream) {
                initRearCamera();
            }

            speak(`مقام ${venueName} (${cityQuery}) کے لیے گائیڈنس شروع کر دی گئی ہے۔ راستہ صاف ہے۔`, currentLang);
        });
    </script>
</body>
</html>
