<title>Smart King Assistant</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0f1e;color:#fff;margin:0;padding:16px}
.top{max-width:620px;margin:auto;background:#111827;padding:22px;border-radius:16px;text-align:left}
h2{text-align:center;color:#00ffcc;margin:0;font-size:24px}
.creator{text-align:center;font-size:12px;color:#94a3b8;margin:6px 0 16px}
label{display:block;color:#00ffcc;font-size:13px;font-weight:700;margin:14px 0 6px;text-transform:uppercase}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
video{width:100%;height:280px;border-radius:12px;background:#000;object-fit:cover;margin-top:12px}
button{border:none;padding:13px;font-size:15px;border-radius:10px;cursor:pointer;margin-top:10px;font-weight:700;width:100%}
.btn-main{background:#00ffcc;color:#000}
.btn-map{background:#0284c7;color:#fff}
.btn-voice{background:#d97706;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
#output{margin-top:14px;padding:12px;background:#1f2937;border-radius:10px;min-height:60px;font-size:15px;text-align:right}
.status{text-align:center;margin:10px 0;font-size:13px;font-weight:700}
</style>

<div class="creator">Created by Humaira Sardar | EasyHelp Smart Cane & GPS</div>

<option value="et-EE">Estonian - Eesti</option>
<option value="lv-LV">Latvian - Latviešu</option>
<option value="lt-LT">Lithuanian - Lietuvių</option>
<option value="mt-MT">Maltese - Malti</option>
<option value="lb-LU">Luxembourgish - Lëtzebuergesch</option>
</select>

<label>Destination Search</label>
<input type="text" id="destinationInput" placeholder="Enter destination...">
<button id="openMapsBtn" class="btn-map">Open Maps</button>

<hr style="border:0;border-top:1px solid #374151;margin:18px 0">

<label>Live Camera</label>
<button id="startBtn" class="btn-main">Start Live Mode</button>
<button id="voiceBtn" class="btn-voice">Voice Command</button>
<button id="stopBtn" class="btn-stop" style="display:none;">Stop Live</button>

<video id="webcam" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>
<div id="output"></div>
</div>

<script>
const video=document.getElementById('webcam');
const canvas=document.getElementById('canvas');
const output=document.getElementById('output');
const voiceLanguageSelect=document.getElementById('voiceLanguage');
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
const liveStatus=document.getElementById('liveStatus');
let autoTimer=null, stream=null, isLive=false, isPaused=false, isThinking=false;

const API_KEY = "AIzaSyDI5btsG8Wu77sAj8gI9Ug8E_9Lr_FvN5A";

// زبان کا نام - اب AI کو یہی بھیجا جائے گا تاکہ وہ اسی زبان میں بولے
function getLangName(){
  const sel=voiceLanguageSelect;
  const txt=sel.options[sel.selectedIndex].text.split(' - ')[0];
  return txt;
}

function speakText(text){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=voiceLanguageSelect.value;
  u.rate=0.95;
  // اس زبان کی آواز ڈھونڈو، ورنہ Default
  const voices=window.speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang===voiceLanguageSelect.value) || voices.find(v=>v.lang.startsWith(voiceLanguageSelect.value.split('-')[0]));
  if(v) u.voice=v;
  window.speechSynthesis.speak(u);
  output.innerText=text;
}

// یہی اصل کام ہے - جیسے آپ مجھ سے بات کرتی ہیں، ویسے ہی یہ ہر سوال کا جواب دے گا
async function askGemini(question, withImage=null){
  const langName=getLangName();
  const langCode=voiceLanguageSelect.value;
  let parts=[{text:`You are Smart King Assistant, created by Humaira Sardar / Smart King. You are helping a blind person. User asked in ${langName}: "${question}". You MUST reply ONLY in ${langName} language. Do NOT use English if language is ${langName}. Do NOT use any other language. Keep answer short, 1-2 lines, clear, spoken style. If user asks what can you do, list your abilities: camera guide, voice guide, maps, directions, reading surroundings. Never mention Google or Gemini.`}];
  if(withImage){
    parts.push({inline_data:{mime_type:"image/jpeg",data:withImage}});
    parts[0].text=`You are Smart King Assistant. Reply ONLY in ${langName}. No English if language is ${langName}. Look at this LIVE camera image for a blind person. Tell in 1 short line what is in front RIGHT NOW. Describe ANY object - person, bike, car, wall, stairs, dog, hole, table, tree, shop, road. If obstacle close say STOP. If clear say CLEAR.`;
  }
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts}]})
    });
    const data=await res.json();
    if(data.candidates && data.candidates[0].content){
      return data.candidates[0].content.parts[0].text;
    }
    return null;
  }catch(e){ return null; }
}

async function ensureCameraOn(){
  if(stream && video.srcObject) return true;
  try{
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
    catch(e){ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    video.srcObject=stream; return true;
  }catch(e){ return false; }
}

// Live Mode - کیمرے کی تصویر لے کر اس کا جواب بولے گا، چپ نہیں رہے گا
async function analyzeCamera(){
  if(!isLive || isPaused || isThinking) return;
  const camOk=await ensureCameraOn();
  if(!camOk){ speakText('Please allow camera'); return; }
  isThinking=true;
  canvas.width=video.videoWidth||640;
  canvas.height=video.videoHeight||480;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const base64Image=canvas.toDataURL('image/jpeg',0.5).split(',')[1];
  const ans=await askGemini("What is in front of me?", base64Image);
  if(ans){ speakText(ans); }
  else { speakText(getLangName()==='Urdu' ? 'مجھے صاف نظر نہیں آ رہا، کیمرہ تھوڑا آگے کریں۔' : 'I cannot see clearly, please move camera a little.'); }
  isThinking=false;
}

async function startAutoLive(){
  if(isLive) return;
  const camOk=await ensureCameraOn();
  if(!camOk){ speakText('Please allow camera'); return; }
  isLive=true; isPaused=false;
  liveStatus.innerText="LIVE";
  startBtn.style.display="none"; stopBtn.style.display="block";
  const langName=getLangName();
  // Live شروع ہوتے ہی پہلی بار کیمرہ دیکھ کر بتائے گا
  speakText(langName==='Urdu' ? 'لائیو آن ہو گیا ہے، میں کیمرے سے دیکھ کر بتاتی ہوں سامنے کیا ہے۔' : 'Live is on, I will tell you what I see.');
  setTimeout(analyzeCamera, 1000);
  autoTimer=setInterval(analyzeCamera, 4000);
}

function stopLive(){
  isLive=false; if(autoTimer) clearInterval(autoTimer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null;
  window.speechSynthesis.cancel();
  liveStatus.innerText="OFF";
  startBtn.style.display="block"; stopBtn.style.display="none";
}
startBtn.addEventListener('click', startAutoLive);
stopBtn.addEventListener('click', stopLive);

// Voice Command - اب یہ آپ کی پوری بات سن کر اسی کا جواب دے گا
document.getElementById('voiceBtn').addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ speakText('Please use Chrome'); return; }
  const rec=new SR();
  rec.lang=voiceLanguageSelect.value;
  rec.continuous=false;
  rec.interimResults=false;
  rec.onresult=async (e)=>{
    const q=e.results[0][0].transcript;
    const lower=q.toLowerCase();
    output.innerText='آپ نے کہا: '+q;

    // صرف رک جاؤ / چلو والے حکم یہیں سے مانے گا، باقی سب Gemini سے پوچھے گا
    if(lower.includes('رک') || lower.includes('stop') || lower.includes('ruk') || lower.includes('रुक')){
      isPaused=true; speakText(getLangName()==='Urdu' ? 'ٹھیک ہے، میں رک گئی ہوں۔' : 'Okay, I stopped.'); return;
    }
    if(lower.includes('چلو') || lower.includes('start') || lower.includes('chalo') || lower.includes('चलो')){
      isPaused=false; speakText(getLangName()==='Urdu' ? 'ٹھیک ہے، پھر چلتے ہیں۔' : 'Okay, lets go.'); return;
    }
    // سامنے کیا ہے - کیمرے کی تصویر کے ساتھ پوچھے گا
    if(lower.includes('سامنے') || lower.includes('what is in front') || lower.includes('samne') || lower.includes('सामने') || lower.includes('what') || lower.includes('کیا ہے')){
      if(!isLive){ isLive=true; liveStatus.innerText="LIVE"; startBtn.style.display="none"; stopBtn.style.display="block"; }
      isPaused=false;
      speakText(getLangName()==='Urdu' ? 'رکیں، میں کیمرے سے دیکھ کر بتاتی ہوں۔' : 'Wait, I am checking camera.');
      setTimeout(analyzeCamera, 700);
      return;
    }
    // باقی ہر سوال - جیسے "تم میرے لیے کیا کیا کر سکتی ہو" - یہ Gemini سے پوچھ کر اسی کا جواب دے گا
    output.innerText='سن رہی ہوں... جواب لا رہی ہوں...';
    const ans=await askGemini(q);
    if(ans){ speakText(ans); }
    else{ speakText('دوبارہ بولیں، میں نے سنا نہیں۔'); }
  };
  rec.start();
  speakText(getLangName()==='Urdu' ? 'جی بولیں، میں سن رہی ہوں۔' : 'Yes, I am listening.');
});

document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q=document.getElementById('destinationInput').value.trim();
  if(!q){ speakText('Please enter destination first.'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
