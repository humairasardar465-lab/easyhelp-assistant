<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart King - Distance Sensor</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@latest"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#0a0f1e;color:#fff;margin:0;padding:16px}
.top{max-width:620px;margin:auto;background:#111827;padding:22px;border-radius:16px}
h2{text-align:center;color:#00ffcc;margin:0}
.sub{text-align:center;font-size:12px;color:#94a3b8;margin:6px 0 14px}
label{display:block;color:#00ffcc;font-size:13px;font-weight:700;margin:14px 0 6px}
select{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
video{width:100%;height:320px;border-radius:12px;background:#000;object-fit:cover;margin-top:12px;border:3px solid #00ffcc}
button{border:none;padding:14px;font-size:16px;border-radius:10px;cursor:pointer;margin-top:10px;font-weight:700;width:100%}
.btn-main{background:#00ffcc;color:#000}
.btn-test{background:#7c3aed;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
#status{text-align:center;margin:10px 0;font-weight:700}
#sensorBox{text-align:center;padding:14px;background:#064e3b;border-radius:10px;margin-top:10px;font-size:16px;font-weight:700}
#distanceBox{text-align:center;padding:14px;background:#111827;border:2px solid #00ffcc;border-radius:10px;margin-top:10px;font-size:22px;font-weight:900}
#debug{margin-top:10px;padding:10px;background:#000;border-radius:10px;font-size:12px;color:#a7f3d0;min-height:50px;text-align:left;white-space:pre-wrap}
</style>
</head>
<body>
<div class="top">
<h2>SMART KING</h2>
<div class="sub">DISTANCE SENSOR - RUKAWAT KITNI DOOR HAI?</div>

<label>SELECT LANGUAGE</label>
<select id="voiceLanguage">
<option value="ur-PK" selected>Urdu</option>
<option value="en-US">English</option>
<option value="hi-IN">Hindi</option>
</select>

<div id="status">STATUS: OFF</div>

<button id="startBtn" class="btn-main">START - SENSOR ON</button>
<button id="testBtn" class="btn-test">TEST NOW - 3 SECOND MEIN BATAO</button>
<button id="stopBtn" class="btn-stop" style="display:none;">STOP</button>

<video id="webcam" autoplay playsinline muted></video>

<div id="distanceBox">DOORI: ---</div>
<div id="sensorBox">SENSOR: OFF</div>
<div id="debug">Debug yahan aayega...</div>
</div>

<script>
const video=document.getElementById('webcam');
const sensorBox=document.getElementById('sensorBox');
const distanceBox=document.getElementById('distanceBox');
const statusEl=document.getElementById('status');
const debugEl=document.getElementById('debug');
const langSel=document.getElementById('voiceLanguage');
let stream=null, isLive=false, model=null, timer=null, lastSpeakTime=0, lastSpoken="", audioCtx=null, lastFrameData=null;

function speakText(t){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=langSel.value; u.rate=1.0;
  window.speechSynthesis.speak(u);
  debugEl.innerText="BOLA: "+t;
}
function playTone(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.3);
    o.start(); o.stop(audioCtx.currentTime+0.3);
  }catch(e){}
}
// Vibration - 3 level
function vibrateLevel(level){
  if(!navigator.vibrate) return;
  if(level===3) navigator.vibrate([400,100,400,100,400]); // Bahut qareeb - tez
  else if(level===2) navigator.vibrate([200,100,200]); // Darmiyani
  else if(level===1) navigator.vibrate([100]); // Door - halki
}

async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    video.srcObject=stream; await video.play(); return true;
  }catch(e){
    try{ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); video.srcObject=stream; await video.play(); return true; }
    catch(e2){ speakText('Camera ki ijazat dein'); return false; }
  }
}

// PURANA WALA SENSOR - Frame me achanak tabdeeli = Rukawat aayi
function oldSensorCheck(){
  if(!video.videoWidth) return 0;
  const c=document.createElement('canvas'); c.width=60; c.height=45;
  const ctx=c.getContext('2d'); ctx.drawImage(video,0,0,60,45);
  const d=ctx.getImageData(0,0,60,45).data;
  let avg=0; for(let i=0;i<d.length;i+=4){ avg+=(d[i]+d[i+1]+d[i+2])/3; } avg=avg/(60*45);
  let variance=0; for(let i=0;i<d.length;i+=4){ variance+=Math.abs((d[i]+d[i+1]+d[i+2])/3 - avg); } variance=variance/(60*45);
  let change=0;
  if(lastFrameData) change=Math.abs(avg - lastFrameData);
  lastFrameData=avg;
  return {variance, change, avg};
}

async function detectNow(isTest=false){
  if(!model) return;
  if(!video.videoWidth) return;
  const now=Date.now();

  // 1. Object Detection - Kitna bara hai? Bara = Qareeb, Chota = Door
  let found=[];
  try{
    const preds=await model.detect(video);
    found=preds.filter(p=>p.score>0.35); // 0.35 kar diya taake aadhi cheez bhi pakri jaye
    found.sort((a,b)=>(b.bbox[2]*b.bbox[3])-(a.bbox[2]*a.bbox[3]));
  }catch(e){}

  // 2. Purana Sensor
  const sensor = oldSensorCheck();
  const isWall = sensor.variance < 20; // Poori screen ek rang = Deewar bilkul qareeb

  debugEl.innerText="Object: "+(found.length? found[0].class+" "+Math.round(found[0].score*100)+"%" : "koi object nahi")+"\nWall Variance: "+Math.round(sensor.variance)+" | Change: "+Math.round(sensor.change);

  // --- DOORI KA ANDAZA ---
  let distanceText="", speakMsg="", level=0, boxColor="#064e3b";

  if(found.length>0){
    // Box kitna bara hai - is se doori ka andaza
    const box = found[0].bbox;
    const areaPercent = (box[2]*box[3]) / (video.videoWidth * video.videoHeight) * 100;
    const objName = found[0].class;

    if(areaPercent > 25){
      // Bahut bara = Bahut qareeb
      distanceText="DOORI: BAHUT QAREEB - 0.5 METER";
      speakMsg="Ruk jayen, rukawat bahut qareeb hai, aadha meter par hai, "+objName+" hai, peeche haten.";
      level=3; boxColor="#7f1d1d";
    } else if(areaPercent > 10){
      distanceText="DOORI: QAREEB - 1 METER";
      speakMsg="Rukawat qareeb hai, 1 meter door hai, aahista baien ho jayen.";
      level=2; boxColor="#92400e";
    } else {
      distanceText="DOORI: DOOR - 2 METER SE ZYADA";
      speakMsg="Samne door rukawat hai, 2 meter door hai, aahista chalen.";
      level=1; boxColor="#365314";
    }
  } else if(isWall){
    // Deewar bilkul qareeb hai
    distanceText="DOORI: BAHUT QAREEB - DEEWAR";
    speakMsg="Ruk jayen, samne deewar ya bari rukawat bilkul qareeb hai, aadha meter par hai.";
    level=3; boxColor="#7f1d1d";
  } else if(sensor.change > 15){
    // Achanak kuch aaya hai - Purane sensor ne pakra
    distanceText="DOORI: QAREEB - KOI CHEEZ AAYI HAI";
    speakMsg="Ruk jayen, samne achanak koi rukawat aayi hai, 1 meter par hai.";
    level=2; boxColor="#92400e";
  } else {
    // Kuch nahi hai
    distanceText="DOORI: RASTA SAAF";
    speakMsg="Rasta saaf hai, aahista seedhe chalte jayen.";
    level=0; boxColor="#064e3b";
  }

  distanceBox.innerText=distanceText;
  distanceBox.style.background=boxColor;
  sensorBox.innerText="SENSOR: "+distanceText;
  sensorBox.style.background=boxColor;

  // 3 SECOND RULE - Har 3 sec me ek dafa bolo, ya TEST me foran bolo
  if(isTest || speakMsg!==lastSpoken || now-lastSpeakTime>3000){
    lastSpoken=speakMsg; lastSpeakTime=now;
    if(level>0){ playTone(); vibrateLevel(level); }
    speakText(speakMsg);
  }
}

document.getElementById('startBtn').addEventListener('click', async ()=>{
  statusEl.innerText="STATUS: LOADING...";
  speakText('Sensor on ho raha hai, 3 second me jawab milega.');
  if(!await ensureCamera()) return;
  try{ if(!model) model=await cocoSsd.load(); }
  catch(e){ speakText('Internet on karein, model load nahi hua.'); return; }
  isLive=true;
  statusEl.innerText="STATUS: LIVE - 3 SECOND SENSOR ON";
  document.getElementById('startBtn').style.display="none";
  document.getElementById('stopBtn').style.display="block";
  speakText('Sensor on ho gaya hai. Ab main har 3 second me bataungi rukawat kitni door hai.');
  // HAR 3 SECOND MEIN CHECK - 40 second nahi
  timer=setInterval(()=>detectNow(false), 3000);
});

document.getElementById('testBtn').addEventListener('click', ()=>{
  if(!isLive){ speakText('Pehle START dabayen.'); return; }
  speakText('Rukiye, 3 second me batati hoon.');
  setTimeout(()=>detectNow(true), 500);
});

document.getElementById('stopBtn').addEventListener('click', ()=>{
  isLive=false; clearInterval(timer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null;
  window.speechSynthesis.cancel();
  statusEl.innerText="STATUS: OFF";
  document.getElementById('startBtn').style.display="block";
  document.getElementById('stopBtn').style.display="none";
});
</script>
</body>
</html>
