function getMsg(key) {
  const lang = langSel.value;
  if(translations[lang] && translations[lang][key]) {
    return translations[lang][key];
  }
  return translations['en-US'][key] || key;
}

function getObjName(objKey) {
  const lang = langSel.value;
  if(translations[lang] && translations[lang].objects && translations[lang].objects[objKey]) {
    return translations[lang].objects[objKey];
  }
  if(translations['en-US'].objects[objKey]) {
    return translations['en-US'].objects[objKey];
  }
  return objKey;
}

function speakText(t){
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = langSel.value; 
  u.rate = 1.0;
  window.speechSynthesis.speak(u);
}

function playHurdleTone(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    o.start(); o.stop(audioCtx.currentTime + 0.3);
  }catch(e){}
}

function playClearTone(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 750;
    o.type = 'triangle';
    g.gain.setValueAtTime(0.85, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
    o.start(); o.stop(audioCtx.currentTime + 0.45);
  }catch(e){}
}

function vibrateHurdle(){
  if(!navigator.vibrate) return;
  navigator.vibrate([300, 100, 300]);
}

async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream; await video.play(); return true;
  }catch(e){
    try{ 
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); 
      video.srcObject = stream; await video.play(); return true; 
    }catch(e2){
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream; await video.play(); return true;
      }catch(e3){
        speakText(getMsg('camError')); return false;
      }
    }
  }
}

function getScreenInfo(){
  if(!video.videoWidth) return {variance: 100, change: 0, verticalTilt: 0};
  const c = document.createElement('canvas'); c.width = 60; c.height = 45;
  const ctx = c.getContext('2d'); ctx.drawImage(video, 0, 0, 60, 45);
  const d = ctx.getImageData(0, 0, 60, 45).data;
  let avg = 0; for(let i = 0; i < d.length; i += 4){ avg += (d[i] + d[i+1] + d[i+2]) / 3; } avg = avg / (60 * 45);
  let variance = 0; for(let i = 0; i < d.length; i += 4){ variance += Math.abs((d[i] + d[i+1] + d[i+2]) / 3 - avg); } variance = variance / (60 * 45);
  let change = Math.abs(avg - lastAvg); lastAvg = avg;

  let topSum = 0, bottomSum = 0;
  const halfPixels = (60 * 22);
  for(let y = 0; y < 22; y++){
    for(let x = 0; x < 60; x++){
      let idx = (y * 60 + x) * 4;
      topSum += (d[idx] + d[idx+1] + d[idx+2]) / 3;
    }
  }
  for(let y = 23; y < 45; y++){
    for(let x = 0; x < 60; x++){
      let idx = (y * 60 + x) * 4;
      bottomSum += (d[idx] + d[idx+1] + d[idx+2]) / 3;
    }
  }
  let verticalTilt = (topSum / halfPixels) - (bottomSum / halfPixels);

  return {variance, change, verticalTilt};
}

// کسٹم ہیورسٹکس کے ذریعے دروازے، دیوار اور بڑی رکاوٹوں کی شناخت
function detectCustomObstacles() {
  const info = getScreenInfo();
  // اگر فریم میں بہت زیادہ تبدیلی نہ ہو اور لائٹ ایک جیسی (تاریک یا یکساں قریب ترین سرفیس) ہو تو دیوار یا بند دروازہ سمجھا جائے گا
  if (info.variance < 18) {
    return 'wall';
  }
  return null;
}

async function detectLoop(){
  if(!isLive) return;

  if(!model || !video.videoWidth) {
    requestAnimationFrame(detectLoop);
    return;
  }

  let found = [];
  try{
    const preds = await model.detect(video);
    found = preds.filter(p => p.score > 0.3); // تھرشولڈ بہتر کیا تاکہ غلط ابجیکٹس نہ آئیں
  }catch(e){}

  // کسٹم رکاوٹ چیک کریں (مثلاً سامنے دیوار یا قریب بند دروازہ)
  const customObstacle = detectCustomObstacles();
  if (customObstacle && found.length === 0) {
    found.push({ class: 'wall', score: 0.9 });
  }

  const info = getScreenInfo();
  let now = Date.now();

  // سٹیئرز کا لاجک اب زیادہ سخت کر دیا گیا ہے تاکہ بغیر سیڑھی کے یہ آواز نہ نکالے
  let potentialStairCondition = (info.change > 8 && info.change < 22 && Math.abs(info.verticalTilt) > 12);

  if (potentialStairCondition) {
    if (!stairMode) {
      stairMode = true;
      stairStepCount = 1;
      stairDirection = info.verticalTilt > 0 ? 'up' : 'down';
      let startText = getMsg('stairsStart');
      speakText(startText);
      statusEl.innerText = "STAIRS STARTED (" + stairDirection.toUpperCase() + ")";
    } else {
      if (now - lastStairCheckTime > 3000) {
        stairStepCount++;
        lastStairCheckTime = now;
        let stepText = (stairDirection === 'up' ? getMsg('stairUpMsg') : getMsg('stairDownMsg')) + " " + stairStepCount;
        speakText(stepText);
        statusEl.innerText = "STAIRS " + stairDirection.toUpperCase() + ": STEP " + stairStepCount;
      }
    }
  } else {
    if (stairMode && (Math.abs(info.verticalTilt) < 5 || info.change < 3)) {
      stairMode = false;
      let endText = getMsg('stairsEnd');
      speakText(endText);
      statusEl.innerText = "STAIRS ENDED";
      stairStepCount = 0;
    }
  }

  if (!stairMode && now - lastSpokenTime > 3500) {
    if (found.length > 0) {
      let names = found.map(p => getObjName(p.class));
      let uniqueNames = [...new Set(names)].join(', ');
      
      let alertText = "";
      const lang = langSel.value;
      if (lang.startsWith('ur')) {
        alertText = `محتاط رہیں، سامنے ہے: ${uniqueNames}۔`;
      } else if (lang.startsWith('hi')) {
        alertText = `सावधान, सामने है: ${uniqueNames}।`;
      } else if (lang.startsWith('ar')) {
        alertText = `تنبيه، في الأمام: ${uniqueNames}.`;
      } else {
        alertText = `Warning, ahead: ${uniqueNames}.`;
      }

      lastSpokenTime = now;
      playHurdleTone();
      vibrateHurdle();
      speakText(alertText);
      statusEl.innerText = "OBSTACLE: " + uniqueNames.toUpperCase();
    } else {
      let clearText = getMsg('clear');
      lastSpokenTime = now;
      playClearTone();
      speakText(clearText);
      statusEl.innerText = "STATUS: GO AHEAD - CLEAR";
    }
  }

  if(isLive) {
    setTimeout(() => requestAnimationFrame(detectLoop), 300);
  }
}

document.getElementById('startBtn').addEventListener('click', async () => {
  statusEl.innerText = "STATUS: LOADING...";
  speakText(getMsg('loading'));
  
  if(!await ensureCamera()) {
    statusEl.innerText = "STATUS: OFF";
    return;
  }

  try {
    if(!model) {
      model = await cocoSsd.load();
    }
  } catch(e) {
    speakText(getMsg('netError'));
    statusEl.innerText = "STATUS: OFF";
    return;
  }

  isLive = true;
  statusEl.innerText = "STATUS: LIVE";
  document.getElementById('startBtn').style.display = "none";
  document.getElementById('stopBtn').style.display = "block";
  speakText(getMsg('started'));
  requestAnimationFrame(detectLoop);
});

document.getElementById('stopBtn').addEventListener('click', () => {
  isLive = false; 
  if(stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  stream = null; 
  video.srcObject = null;
  window.speechSynthesis.cancel();
  stairMode = false;
  stairStepCount = 0;
  statusEl.innerText = "STATUS: OFF";
  document.getElementById('startBtn').style.display = "block";
  document.getElementById('stopBtn').style.display = "none";
});

document.getElementById('openMapsBtn').addEventListener('click', () => {
  const q = document.getElementById('destinationInput').value.trim();
  if(!q){ 
    speakText('Pehle upar likhen kahan jana hai.'); 
    return; 
  }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, '_blank');
});
