<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Eyes Smart Cam - Created by Humaira Sardar</title>
<script src="keys.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif;text-align:center}
header{background:#111;padding:12px}
h1{font-size:20px;margin:5px;color:#00e676}
p{font-size:13px;color:#ccc;margin:0}
video{width:100%;height:55vh;object-fit:cover;background:#222}
button{font-size:17px;padding:12px 16px;margin:6px;border-radius:12px;border:none;font-weight:bold}
.green{background:#00e676;color:#000}
.blue{background:#2196f3;color:#fff}
.orange{background:#ff9800;color:#000}
.grey{background:#444;color:#fff}
#text{background:#222;padding:14px;font-size:19px;min-height:70px;margin:10px;border-radius:12px}
#menu{display:none;background:#222;padding:10px;border-radius:12px;margin:10px}
#about{display:none;background:#fff;color:#000;padding:15px;margin:10px;border-radius:12px}
input{width:90%;padding:12px;font-size:17px;border-radius:12px;border:none;margin:8px}
select{padding:12px;font-size:16px;border-radius:12px;margin:6px;width:90%}
</style>
</head>
<body>
<header>
<h1>Your Eyes Smart Cam</h1>
<p>Created by Humaira Sardar</p>
<button class="grey" onclick="showMenu()">☰ Menu / Dropdown</button>
<button class="grey" onclick="showSetting()">⚙️ Setting</button>
</header>

<div id="menu">
<input id="searchBar" placeholder="🔍 Search... Yahan likho" oninput="searchKaro()">
<br>
<button class="blue" onclick="cameraOn()">📷 Camera Button</button>
<button class="blue" onclick="switchCamera()">🔄 Camera Badlo</button>
<select id="mode">
<option>Live AI Mode</option>
<option>Photo Mode</option>
<option>Video Mode</option>
</select>
</div>

<div id="setting" style="display:none;background:#222;padding:12px;border-radius:12px;margin:10px">
<h3>Setting</h3>
<button class="orange" onclick="showAbout()">ℹ️ About</button>
<button class="orange" onclick="feedback()">✉️ Email / Feedback</button>
<button class="grey" onclick="hideSetting()">Band Karo</button>
</div>

<div id="about">
<b>About - Your Eyes Smart Cam</b><br><br>
Ye app andhe logon ke liye hai.<br>
Camera live dekh kar bol kar batayegi.<br><br>
<b>Created by Humaira Sardar</b><br><br>
<button onclick="hideAbout()">Band Karo</button>
</div>

<video id="video" autoplay playsinline muted></video>
<div id="text">Yahan jo camera dekhega, wo likha aayega</div>
<button class="green" onclick="startLiveAI()">▶️ Start Live AI</button>
<button class="grey" onclick="stopLiveAI()">⏹️ Stop</button>
<canvas id="canvas" style="display:none"></canvas>

<script>
let video=document.getElementById('video');
let canvas=document.getElementById('canvas');
let textDiv=document.getElementById('text');
let live=false; let currentFacing="environment";

function showMenu(){ let m=document.getElementById('menu'); m.style.display=m.style.display=='none'?'block':'none'; }
function showSetting(){ document.getElementById('setting').style.display='block'; }
function hideSetting(){ document.getElementById('setting').style.display='none'; }
function showAbout(){ document.getElementById('about').style.display='block'; }
function hideAbout(){ document.getElementById('about').style.display='none'; }
function feedback(){ window.location.href="mailto:humaira@example.com?subject=Feedback - Your Eyes Smart Cam"; }
function searchKaro(){ let v=document.getElementById('searchBar').value; textDiv.innerText="Tumne search kiya: "+v; }
async function cameraOn(){ try{ let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:currentFacing}}); video.srcObject=s; textDiv.innerText="Camera On Ho Gaya"; }catch(e){ textDiv.innerText="Camera Error: "+e.message; } }
async function switchCamera(){ currentFacing=currentFacing=="environment"?"user":"environment"; cameraOn(); }
async function startLiveAI(){
  if(!video.srcObject) await cameraOn();
  live=true; textDiv.innerText="Live AI Shuru Ho Gaya... Main dekh kar bolungi";
  setInterval(async ()=>{
    if(!live) return;
    canvas.width=video.videoWidth; canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0);
    let image=canvas.toDataURL('image/jpeg',0.7).split(',')[1];
    let key=GEMINI_KEYS[0];
    try{
      let res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+key,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:"Is image me kya hai, Urdu me 1-2 jumlon me batao. Samne rukawat ho to pehle wo batao."},{inline_data:{mime_type:"image/jpeg",data:image}}]}]})});
      let data=await res.json();
      let j=data.candidates[0].content.parts[0].text;
      textDiv.innerText=j;
      let bol=new SpeechSynthesisUtterance(j); bol.lang='ur-PK'; speechSynthesis.speak(bol);
    }catch(e){ textDiv.innerText="Error: "+e.message; }
  },5000);
}
function stopLiveAI(){ live=false; textDiv.innerText="Live AI Band Ho Gaya"; }
cameraOn();
</script>
</body>
</html>
