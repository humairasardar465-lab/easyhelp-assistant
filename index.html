}
async function waitForMediapipe() {
  if (window.FilesetResolver && window.ObjectDetector) return true;
  return new Promise(function(resolve) {
    let done = false;
    const t = setTimeout(function() { if (!done) { done = true; resolve(false); } }, 15000);
    window.addEventListener('mediapipe-loaded', function() { if (!done) { done = true; clearTimeout(t); resolve(true); } }, { once: true });
  });
}
async function initDetector() {
  if (objectDetector) return true;
  if (isDetectorLoading) return false;
  isDetectorLoading = true;
  try {
    statusEl.innerText = getT('loading');
    const ok = await waitForMediapipe();
    if (!ok) { throw new Error('mediapipe timeout'); }
    const vision = await window.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm");
    const detectorPromise = window.ObjectDetector.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite", delegate: "CPU" }, scoreThreshold: 0.40, runningMode: "VIDEO" });
    const timeoutPromise = new Promise(function(_, reject) { setTimeout(function() { reject(new Error('model timeout')); }, 15000); });
    objectDetector = await Promise.race([detectorPromise, timeoutPromise]);
    isDetectorLoading = false;
    return true;
  } catch (err) {
    console.error(err);
    isDetectorLoading = false;
    objectDetector = null;
    if (isLive) { statusEl.innerText = getT('netError'); speak(getT('netError'), false); }
    return false;
  }
}
async function startCamera() {
  try {
    if (isLive || stream) return;
    statusEl.innerText = getT('loading');
    startBtn.innerText = 'PLEASE WAIT...';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { statusEl.innerText = getT('camError'); speak(getT('camError'), false); startBtn.innerText = 'START'; return; }
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = stream;
    startGPS();
    video.onloadedmetadata = async () => {
      try { await video.play(); } catch(e) {}
      isLive = true; statusEl.innerText = getT('started'); speak(getT('started'), false);
      startBtn.style.display = 'none'; stopBtn.style.display = 'block';
      window.requestAnimationFrame(predictWebcam);
      const ok = await initDetector();
      if (!ok && isLive) { statusEl.innerText = getT('netError'); }
    };
  } catch (err) {
    console.error(err);
    startBtn.innerText = 'START';
    statusEl.innerText = getT('camError'); speak(getT('camError'), false);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
}
let lastVideoTime = -1;
async function predictWebcam() {
  if (!isLive) return;
  if (!objectDetector) {
    if (isLive) { window.requestAnimationFrame(predictWebcam); }
    return;
  }
  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime; frameCount++;
    try {
      const startTimeMs = performance.now();
      const detections = objectDetector.detectForVideo(video, startTimeMs);
      const hasObjectDetected = detections && detections.detections && detections.detections.length > 0;
      if (!hasObjectDetected) { nothingCount++; } else { nothingCount = 0; clearWaitCount = 0; }
      let wallBlocked = isWallDoorStairsBlocked();
      if (hasObjectDetected) {
        let closest = detections.detections[0]; let maxArea = 0;
        for (let det of detections.detections) { const area = det.boundingBox.width * det.boundingBox.height; if (area > maxArea) { maxArea = area; closest = det; } }
        const confidence = Math.round(closest.categories[0].score * 100);
        if (confidence >= REQUIRED_CONFIDENCE) {
          const videoWidth = video.videoWidth || 640;
          const videoArea = videoWidth * (video.videoHeight || 480);
          const sizeRatio = maxArea / videoArea;
          if (sizeRatio >= OBSTACLE_SIZE_RATIO) {
            obstacleConfirmCount++;
            if (obstacleConfirmCount >= OBSTACLE_CONFIRM_NEEDED) {
              const box = closest.boundingBox;
              const cxRatio = (box.originX + box.width / 2) / videoWidth;
              const sideWord = getSideWord(cxRatio);
              const dist = getDistanceMeters(sizeRatio);
              handleObstacle(getObstacleText(sideWord, dist));
              const now = Date.now();
              if (now - lastBeepTime > 800) {
                lastBeepTime = now;
                if (sizeRatio >= 0.15) { playBeep('obstacle'); } else { playBeep('small'); }
              }
            }
          } else if (wallBlocked) {
            obstacleConfirmCount = 0;
            alertWallDoorStairs();
          } else { handleClearPath(); }
        } else if (wallBlocked) {
          obstacleConfirmCount = 0;
          alertWallDoorStairs();
        } else { handleClearPath(); }
      } else {
        if (wallBlocked) { obstacleConfirmCount = 0; alertWallDoorStairs(); } else { handleClearPath(); }
      }
    } catch (e) { console.error(e); }
  }
  if (isLive) { window.requestAnimationFrame(predictWebcam); }
}
function handleClearPath() {
  obstacleConfirmCount = 0;
  const now = Date.now();
  if (currentMode !== "clear") {
    currentMode = "clear"; lastObstacleName = "";
    lastClearSpeakTime = now;
    speakClearForce();
    startClearTone();
    playBeep('clear');
  } else {
    if (now - lastClearSpeakTime > 4000) {
      lastClearSpeakTime = now;
      speak(getT('clearPath'), false);
    }
  }
  statusEl.innerText = getT('clearPath');
  if (totalWalkedMeters >= 5 && (totalWalkedMeters - lastAnnouncedWalkedMeters) >= 10) {
    lastAnnouncedWalkedMeters = Math.round(totalWalkedMeters);
    lastWalkAnnounceTime = now;
    const walkedText = getT('walkedWord') + " " + Math.round(totalWalkedMeters) + " " + getT('walkedWord2');
    speak(walkedText, false);
  }
}
function stopCamera() {
  if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
  if ('vibrate' in navigator) { try { navigator.vibrate(0); } catch(e){} }
  stopClearTone();
  isLive = false;
  if (gpsWatchId) { try{ navigator.geolocation.clearWatch(gpsWatchId); }catch(e){} gpsWatchId = null; }
  if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
  video.srcObject = null; statusEl.innerText = "STATUS: OFF"; startBtn.style.display = 'block'; startBtn.innerText = 'START'; stopBtn.style.display = 'none';
  isSpeakingObstacle = false; lastObstacleSpokenText = ""; clearWaitCount = 0; currentMode = "clear"; lastObstacleName = ""; obstacleConfirmCount = 0; wallConfirmCount = 0; isDetectorLoading = false; totalWalkedMeters = 0; hasLastGps = false; lastAnnouncedWalkedMeters = 0;
}
langSel.addEventListener('change', () => { lightVibration(); });
langSel.addEventListener('click', () => { lightVibration(); });
destinationInput.addEventListener('focus', () => { lightVibration(); });
destinationInput.addEventListener('click', () => { lightVibration(); });
startBtn.addEventListener('click', async () => { lightVibration(); await startCamera(); });
stopBtn.addEventListener('click', () => { lightVibration(); stopCamera(); });
openMapsBtn.addEventListener('click', () => { lightVibration(); const dest = destinationInput.value.trim(); if (dest) { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank'); } else { window.open(`https://www.google.com/maps`, '_blank'); } });
waBtn.addEventListener('click', () => { lightVibration(); });
</script>
