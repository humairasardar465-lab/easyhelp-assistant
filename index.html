<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart King - Mobile Hi Aankh Hai</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#0a0f1e;color:#fff;margin:0;padding:16px}
.top{max-width:620px;margin:auto;background:#111827;padding:22px;border-radius:16px}
h2{text-align:center;color:#00ffcc;margin:0}
.sub{text-align:center;font-size:12px;color:#94a3b8;margin:6px 0 14px}
label{display:block;color:#00ffcc;font-size:13px;font-weight:700;margin:14px 0 6px}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
video{width:100%;height:320px;border-radius:12px;background:#000;object-fit:cover;margin-top:12px;border:3px solid #00ffcc}
button{border:none;padding:14px;font-size:16px;border-radius:10px;cursor:pointer;margin-top:10px;font-weight:700;width:100%}
.btn-main{background:#00ffcc;color:#000}
.btn-voice{background:#d97706;color:#fff}
.btn-map{background:#0284c7;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
#output{margin-top:14px;padding:14px;background:#1f2937;border-radius:10px;min-height:60px;font-size:17px;text-align:right}
#status{text-align:center;margin:10px 0;font-weight:700}
#sensorBox{text-align:center;padding:12px;background:#064e3b;border-radius:10px;margin-top:10px;font-size:14px}
</style>
</head>
<body>
<div class="top">
<h2>👑 SMART KING</h2>
<div class="sub">Mobile Hi Aankh Hai - Bina Kisi Key Ke</div>

<label>Select Language - زبان بدلیں</label>
<select id="voiceLanguage">
<option value="ur-PK" selected>Urdu - اردو</option>
<option value="en-US">English</option>
<option value="hi-IN">Hindi - हिंदी</option>
<option value="ar-SA">Arabic - العربية</option>
<option value="pa-IN">Punjabi - ਪੰਜਾਬੀ</option>
<option value="ps-PK">Pashto - پښتو</option>
<option value="sd-PK">Sindhi - سنڌي</option>
</select>

<label>Kahan Jana Hai?</label>
<input type="text" id="destinationInput" placeholder="Jese: Okara Bazar">
<button id="openMapsBtn" class="btn-map">🗺 Maps Kholo - Rasta Batayega</button>

<div id="status">OFF</div>

<button id="startBtn" class="btn-main">▶ START - Camera + Sensor ON</button>
<button id="voiceBtn" class="btn-voice">🎤 Bolo</button>
<button id="stopBtn" class="btn-stop" style="display:none;">⏹ STOP</button>

<video id="webcam" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="sensorBox">📡 Sensor: OFF<br>Mobile samne rakhen, hilne par vibrate karega</div>
<div id="output">Yahan jawab aayega...</div>
</div>

<script>
const video=document.getElementById('webcam');
const canvas=document.getElementById('canvas');
const output=document.getElementById('output');
const sensorBox=document.getElementById('sensorBox');
const statusEl=document.getElementById('status');
const langSel=document.getElementById('voiceLanguage');
let stream=null, isLive=false, timer=null, lastFrame=null, lastVibrate=0;

function getLangName(){ return langSel.options[langSel.selectedIndex].text.split(' - ')[0]; }

function speakText(t){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=langSel.value; u.rate=0.95;
  window.speechSynthesis.speak(u);
  output.innerText=t;
}

function doVibrate(level){
  const now=Date.now();
  if(now - lastVibrate < 1200) return;
  lastVibrate=now;
  if(!navigator.vibrate) return;
  if(level===2){ navigator.vibrate([400,100,400,100,400]); }
  else if(level===1){ navigator.vibrate([150]); }
}

async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
    catch(e){ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    video.srcObject=stream; await video.play();
    return true;
  }catch(e){
    speakText('Camera ki ijazat dein, Chrome me upar Lock par click kar ke Camera Allow karein');
    return false;
  }
}

function checkSensorRealTime(){
  if(!isLive) return;
  if(!video.videoWidth) return;
  canvas.width=120; canvas.height=90;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,120,90);
  const data=ctx.getImageData(0,0,120,90).data;
  let brightness=0;
  for(let i=0;i<data.length;i+=4){ brightness += (data[i]+data[i+1]+data[i+2])/3; }
  brightness = brightness / (120*90);
  let change=0;
  if(lastFrame){ change=Math.abs(brightness - lastFrame); }
  lastFrame=brightness;
  if(change > 18){
    doVibrate(2);
    sensorBox.style.background="#7f1d1d";
    sensorBox.innerText="📡 Sensor: SAMNE KOI CHEEZ AAYI HAI 🔴\nMobile tez vibrate ho raha hai - Ruk jayen";
    const lang=getLangName();
    if(lang==='Urdu') speakText('Ruk jayen, samne koi cheez aayi hai, aahista baien ho jayen.');
    else if(lang==='Hindi') speakText('Ruk jayen, samne koi cheez aayi hai.');
    else if(lang==='Arabic') speakText('توقف، هناك شيء أمامك.');
    else speakText('Stop, something came in front.');
  } else if(change > 8){
    doVibrate(1);
    sensorBox.style.background="#92400e";
    sensorBox.innerText="📡 Sensor: Samne halki harkat hai 🟡\nHalki vibration - Aahista chalen";
  } else {
    sensorBox.style.background="#064e3b";
    sensorBox.innerText="📡 Sensor: Rasta Saaf Lag Raha Hai 🟢\nKoi tez harkat nahi - Seedha chalen";
  }
}

document.getElementById('startBtn').addEventListener('click', async ()=>{
  if(!await ensureCamera()) return;
  isLive=true;
  statusEl.innerText="🟢 LIVE - Bina Key Ke - "+getLangName();
  document.getElementById('startBtn').style.display="none";
  document.getElementById('stopBtn').style.display="block";
  speakText(getLangName()==='Urdu' ? 'Camera aur Sensor on ho gaya hai, bina kisi Key ke. Mobile samne rakhen, samne cheez aayegi to mobile vibrate karega aur main bataungi.' : 'Camera and Sensor is ON without any key.');
  timer=setInterval(checkSensorRealTime, 1000);
});

document.getElementById('stopBtn').addEventListener('click', ()=>{
  isLive=false; clearInterval(timer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null;
  window.speechSynthesis.cancel();
  statusEl.innerText="OFF";
  document.getElementById('startBtn').style.display="block";
  document.getElementById('stopBtn').style.display="none";
  sensorBox.innerText="📡 Sensor: OFF";
});

document.getElementById('voiceBtn').addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ speakText('Chrome use karein'); return; }
  const rec=new SR(); rec.lang='ur-PK';
  rec.onresult=(e)=>{
    const q=e.results[0][0].transcript;
    const lower=q.toLowerCase();
    output.innerText='Aap ne kaha: '+q;
    const lang=getLangName();
    if(lower.includes('samne') || lower.includes('kya hai') || lower.includes('dekho')){
      speakText(lang==='Urdu' ? 'Mobile samne rakhen, agar samne cheez hogi to mobile vibrate karega aur main bata dungi.' : 'Keep mobile in front, if something comes, mobile will vibrate.');
      checkSensorRealTime();
      return;
    }
    if(lower.includes('kahan') || lower.includes('bazar') || lower.includes('jana')){
      speakText(lang==='Urdu' ? 'Upar destination likh kar Maps wala button dabayen, Maps aap ko rasta batayega.' : 'Write destination above and press Maps button.');
      return;
    }
    speakText(lang==='Urdu' ? 'Main sun rahi hoon, mobile samne rakhen, main aap ke sath hoon.' : 'I am listening, keep mobile in front.');
  };
  rec.start();
  speakText('Ji bolein, main sun rahi hoon.');
});

document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q=document.getElementById('destinationInput').value.trim();
  if(!q){ speakText('Pehle upar likhen kahan jana hai.'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
</body>
</html>
