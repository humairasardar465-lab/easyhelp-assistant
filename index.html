/* ===== LANGUAGE: 6 built-in packs, the rest translated once (cached on the phone) ===== */
const bi=c=>IDX[c]??IDX[c.split('-')[0]]??-1;

const pk=()=>fb()?0:(bi(code)>=0?bi(code):'x');
const t=(k,v)=>{const p=pk(),s=p==='x'?P.u[k]:S[k][p];return s.replace(/\{(\w+)\}/g,(_,x)=>v[x])};

async function callAI(prompt){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent`,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','x-goog-api-key':AI_API_KEY},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json(),x=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
    if(!x)throw new Error('empty answer');return x;
  }finally{clearTimeout(to)}
}
const ph=s=>(s.match(/\{\w+\}/g)||[]).sort().join();
const okPack=j=>!!(j&&j.u&&Array.isArray(j.n)&&j.n.length===NAMES.length&&j.n.every(x=>typeof x==='string'&&x.trim())&&Object.keys(S).every(k=>typeof j.u[k]==='string'&&j.u[k].trim()&&ph(j.u[k])===ph(S[k][0])));
const pend={};
const loadPack=(c,name)=>pend[c]||(pend[c]=(async()=>{
  try{const s=JSON.parse(ls.get('sc_pk_'+c));if(okPack(s))return s}catch(e){}
  if(!AI_API_KEY)return null;
  const src={u:{},n:NAMES.map(a=>a[0])};for(const k in S)src.u[k]=S[k][0];

  const j=JSON.parse(x.replace(/```json|```/g,''));

})().finally(()=>{delete pend[c]}));
function pickVoice(){   // prefers Google (Speech Services) voices, local ones first for the lowest delay

    const a=vs.map(v=>[sc(v),v]).filter(x=>x[0]>=2).sort((x,y)=>y[0]-x[0]);return a.length?a[0][1]:null};
  voiceSel=f(code);voiceEn=f('en-US');haveSel=!vs.length||!!voiceSel;render();
}

}

/* ===== SPEECH: whole sentences, one after another, obstacles first, nothing repeated ===== */
let q=[],lastSaid='',lastSaidT=0;
const voice=()=>fb()?voiceEn:voiceSel;
function speak(s){
  stEl.textContent=s;const u=new SpeechSynthesisUtterance(s),v=voice();
  u.lang=v?v.lang:(fb()?'en-US':code);if(v)u.voice=v;u.rate=1.15;speechSynthesis.speak(u);
}
function say(s,pri,instr){   // pri: 0 obstacle, 1 guidance (default), 2 information
  if(!s)return;pri=pri===undefined?1:pri;if(instr)lastInstr=s;
  const n=performance.now();
  if(pri!==1&&s===lastSaid&&n-lastSaidT<4000)return;
  if(pri===0)q=q.filter(x=>x.p!==0);                       // only the newest obstacle alert waits
  q.push({s,p:pri,t:n});
}
function pump(){
  if(listening||!q.length||speechSynthesis.speaking||speechSynthesis.pending)return;
  const n=performance.now();q=q.filter(x=>x.p!==0||n-x.t<2500);if(!q.length)return;
  let b=0;q.forEach((x,i)=>{if(x.p<q[b].p)b=i});
  const x=q.splice(b,1)[0];lastSaid=x.s;lastSaidT=n;speak(x.s);
}
(function tick(){pump();setTimeout(tick,saver?200:60)})();
const idle=()=>new Promise(r=>{let n=0;const i=setInterval(()=>{if((!speechSynthesis.speaking&&!speechSynthesis.pending&&!q.length)||++n>150){clearInterval(i);r()}},80)});
function beep(f,d){

    const o=ac.createOscillator(),gn=ac.createGain(),n=ac.currentTime;d=d||.06;o.frequency.value=f;o.connect(gn);gn.connect(ac.destination);
    gn.gain.setValueAtTime(.2,n);gn.gain.linearRampToValueAtTime(0,n+d);o.start(n);o.stop(n+d)}catch(e){}
}

/* ===== VOICE INPUT (waits for the speech to finish, retries once by itself) ===== */
function listenOnce(){
  return new Promise(res=>{
    const R=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!R)return res({e:'unsupported'});
    const r=rec=new R();r.lang=code;r.interimResults=true;r.maxAlternatives=1;r.continuous=false;let out='',err='';
    r.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;out=s.trim()};
    r.onerror=e=>{err=e.error||'error'};r.onend=()=>{rec=null;res({t:out,e:err})};
    try{r.start()}catch(e){return res({e:'start'})}
    setTimeout(()=>{try{r.stop()}catch(e){}},9000);
  });
}
async function listen(id){

    await idle();await sleep(450);if(id!==SID)return '';
    listening=true;stEl.textContent='🎤';beep(880,.08);await sleep(150);
    const r=await listenOnce();listening=false;if(id!==SID)return '';
    if(r.e==='unsupported'){say(t('noStt'));return ''}
    if(r.e==='not-allowed'||r.e==='service-not-allowed'){say(t('perm'));return ''}
    if(r.e==='network'){say(t('net'));return ''}
    if(r.t)return r.t;
  }
  return '';
}
async function ask(key,id){say(t(key),1,true);await idle();return id!==SID?null:listen(id)}

/* ===== SAVED PLACES: fuzzy match + shortest route ===== */
const norm=s=>s.toLowerCase().replace(/[\s.,!?;:'"()\-،۔]+/g,'');
const lev=(a,b)=>{const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const x=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=x}}return d[b.length]};
function find(name){
  const n=norm(name);let best=null,bd=99;
  for(const p of DB.places){const d=lev(n,norm(p));if(d<bd){bd=d;best=p}}
  return best&&bd<=Math.floor(norm(best).length*.3)?best:null;
}
function route(a,b){   // legs [{to,n,t:[[stepIndex,'L'|'R']]}] ; an edge walked backwards is mirrored
  const adj=Object.create(null),prev=Object.create(null),qu=[a];prev[a]=null;
  const add=(x,l)=>(adj[x]=adj[x]||[]).push(l);
  for(const e of DB.edges){add(e.a,{to:e.b,n:e.n,t:e.t});add(e.b,{to:e.a,n:e.n,t:e.t.map(([k,d])=>[e.n-k,d==='L'?'R':'L']).reverse()})}
  while(qu.length){const u=qu.shift();if(u===b)break;for(const l of adj[u]||[])if(!(l.to in prev)){prev[l.to]={from:u,l};qu.push(l.to)}}
  if(!(b in prev)||a===b)return null;
  const out=[];for(let x=b;prev[x];x=prev[x].from)out.unshift({to:x,n:prev[x].l.n,t:prev[x].l.t});
  return out;
}

/* ===== CAMERA + OBSTACLES (close range, announced once, immediately) ===== */
async function loadDet(){
  if(!window.ObjectDetector)await new Promise((ok,no)=>{const h=setTimeout(no,15000);addEventListener('mediapipe-loaded',()=>{clearTimeout(h);ok()},{once:true})});
  const v=await FilesetResolver.forVisionTasks(WASM);
  for(const d of['GPU','CPU'])try{return await ObjectDetector.createFromOptions(v,{baseOptions:{modelAssetPath:MODEL,delegate:d},scoreThreshold:.5,maxResults:5,runningMode:'VIDEO'})}catch(e){}
  throw new Error('detector');
}
async function camStart(){
  if(camOn)return true;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:saver?240:320},height:{ideal:saver?180:240},frameRate:{ideal:saver?10:30}},audio:false})}
  catch(e){stream=null;say(t(window.isSecureContext?'perm':'https'));info('Camera: '+((e&&e.name)||'error'));return false}
  video.srcObject=stream;try{await video.play()}catch(e){}
  camOn=true;nextFrame();
  if(!det){try{det=await loadDet()}catch(e){say(t('det'))}}
  return true;
}
function camStop(){camOn=false;if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}video.srcObject=null;cur=null;hist=[]}
const nextFrame=()=>{if(camOn)video.requestVideoFrameCallback?video.requestVideoFrameCallback(onFrame):requestAnimationFrame(onFrame)};
function onFrame(){
  nextFrame();
  const n=performance.now();
  if(!det||video.readyState<2||n-lastProc<(saver?(n-lastStepT>3000?1000:200):0))return;
  lastProc=n;
  const W=video.videoWidth,H=video.videoHeight;let best=null;
  for(const d of det.detectForVideo(video,n).detections){
    const c=d.categories[0],o=OBJ[c.categoryName];if(!o)continue;
    const b=d.boundingBox;let m=o[0]*.77*Math.max(W,H)/b.height;          // distance from the object's real height
    if(b.originY<2||b.originY+b.height>H-2)m=Math.min(m,1);               // cut by the frame edge: closer than it looks
    if(m>RANGE)continue;
    const near=m<.5,cx=(b.originX+b.width/2)/W,side=cx<.4?'L':cx>.6?'R':'F';
    m=Math.max(.5,Math.round(m*2)/2);
    if(!best||m<best.m)best={m,near,side,o:o[1],key:c.categoryName+side};
  }
  hist.push(best?best.key:0);if(hist.length>3)hist.shift();
  if(best&&hist.filter(k=>k===best.key).length>=2){                       // seen in 2 of the last 3 frames
    sawAt=n;
    if(!cur||cur.key!==best.key||best.m<=cur.m-.5){cur={key:best.key,m:best.m};alertObs(best)}
    else if(best.m>cur.m)cur.m=best.m;
  }else if(cur&&n-sawAt>700){cur=null;say(t('clear'),2)}                    // "clear" once, after an obstacle
}
function alertObs(b){
  say(t(b.near?'obNear':'ob',{o:nm(b.o),d:t(b.side),m:b.m}),0);
  beep(b.m<=1?990:660);vib(b.m<=1?[100,50,100]:60);
}

/* ===== STEPS + TURNS (motion sensors, no GPS map) ===== */
function onMotion(e){
  const a=e.accelerationIncludingGravity,r=e.rotationRate;if(!a||a.x==null)return;
  const n=performance.now(),dt=Math.min(n-lastMT,100)/1000,mag=Math.hypot(a.x,a.y,a.z)||1;
  if(!lastMT)g=mag;lastMT=n;motionOk=true;
  g+=(mag-g)*.02;p2=p1;p1=lp;lp+=(mag-g-lp)*.3;
  if(p1>.8&&p1<12&&p1>p2&&p1>=lp&&n-lastStepT>280){steps++;lastStepT=n;onStep()}
  if(r&&r.alpha!=null){
    const w=(r.beta*a.x+r.gamma*a.y+r.alpha*a.z)/mag*(IOS?-1:1);          // deg/s about the vertical axis, + = left
    acc+=w*dt;if(Math.abs(w)<8)acc*=.97;
    if(Math.abs(acc)>=60){
      if(state==='teach'||state==='confirmStop'){const d=acc>0?'L':'R',at=steps-segStart,l=turns[turns.length-1];if(!(l&&l[1]===d&&at-l[0]<=2))turns.push([at,d])}
      acc=0;
    }
  }
}
function motionOn(){motionOk=false;lastMT=0;addEventListener('devicemotion',onMotion);setTimeout(()=>{if(!motionOk&&state!=='idle')say(t('noSens'))},2500)}
const motionOff=()=>removeEventListener('devicemotion',onMotion);
const hav=(a,b)=>{const r=Math.PI/180,x=(b[0]-a[0])*r,y=(b[1]-a[1])*r,s=Math.sin(x/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(y/2)**2;return 12742000*Math.atan2(Math.sqrt(s),Math.sqrt(1-s))};
function geoOn(){   // outdoors only: refines the step length from GPS
  if(!navigator.geolocation||saver||gid!==null)return;gp=null;
  gid=navigator.geolocation.watchPosition(p=>{
    const c=p.coords;if(c.accuracy>12)return;const a=[c.latitude,c.longitude];
    if(!gp){gp=a;gs=steps;return}
    const d=hav(gp,a),n=steps-gs;
    if(d>=30&&n>=20){const s=d/n;if(s>.4&&s<1.1){STRIDE=+(STRIDE*.7+s*.3).toFixed(3);ls.set('sc_stride',STRIDE)}gp=a;gs=steps}
  },()=>{},{enableHighAccuracy:false,maximumAge:5000});
}
const geoOff=()=>{if(gid!==null){navigator.geolocation.clearWatch(gid);gid=null}};
async function lock(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.onrelease=()=>{wake=null}}else if(!on&&wake){await wake.release();wake=null}}catch(e){}}

/* ===== BATTERY SAVER (automatic at 20% or below, off while charging) ===== */
function setSaver(on,low){
  if(on===saver)return;saver=on;document.body.classList.toggle('saver',on);
  say((low?t('low')+' ':'')+t(on?'sOn':'sOff'),2);
  const tr=stream&&stream.getVideoTracks()[0];
  if(tr)tr.applyConstraints({width:{ideal:on?240:320},height:{ideal:on?180:240},frameRate:{ideal:on?10:30}}).catch(()=>{});
  if(on)geoOff();else if(state!=='idle')geoOn();
}
if(navigator.getBattery)navigator.getBattery().then(b=>{const f=()=>setSaver(!b.charging&&b.level<=.2,true);b.onlevelchange=f;b.onchargingchange=f;f()}).catch(()=>{});

/* ===== FLOWS: voice-tag a path, then guide along it ===== */
async function motionPerm(){const D=window.DeviceMotionEvent;if(D&&typeof D.requestPermission==='function'){try{return await D.requestPermission()==='granted'}catch(e){return false}}return true}
async function startSession(){
  state='free';const mp=motionPerm();          // asked inside the tap (needed on iPhone)
  if(permP){permOk=await permP;permP=null;if(!permOk)say(t('perm'))}
  await camStart();lock(true);motionOn();geoOn();
  if(!await mp)say(t('noSens'));
  if(state!=='free')return;
  begin();
}
async function begin(){
  const id=++SID;state='askStart';retry=begin;
  const name=await ask('sayStart',id);if(id!==SID)return;
  if(!name){state='free';say(t('nf'),1,true);return}
  const start=find(name)||name;
  if(DB.edges.some(e=>e.a===start||e.b===start))return destFlow(start,id);
  retry=null;teach(start);
}
async function destFlow(start,id){
  id=id||++SID;state='askDest';retry=()=>destFlow(start);forceTeach=false;
  const name=await ask('dest',id);if(id!==SID)return;
  if(forceTeach){retry=null;return teach(start)}
  state='free';const dst=name&&find(name),legsX=dst&&route(start,dst);
  if(!legsX){say(t('nf'),1,true);return}
  retry=null;nav(legsX);
}
function teach(start){
  state='teach';from=start;if(!DB.places.includes(start))DB.places.push(start);save();
  steps=0;segStart=0;turns=[];lastAsk=-1;
  say(t('startSaved',{p:start}),1,true);say(t('walk'),1,true);          // confirmed at once, then the next sentence
  clearInterval(idleTimer);idleTimer=setInterval(teachTick,500);
}
function teachTick(){
  const n=performance.now();
  if(state==='teach'&&steps-segStart>=2&&steps>lastAsk&&n-lastStepT>2500){state='confirmStop';lastAsk=steps;stopAt=steps;say(t('stopQ'),1,true)}
  else if(state==='confirmStop'&&steps-stopAt>=2)state='teach';            // kept walking = "no"
}
async function nameHere(){
  const n=steps-segStart;
  if(n<1){say(t('noSteps'));return}
  const id=++SID;state='askName';retry=nameHere;
  const name=await ask('place',id);if(id!==SID)return;
  if(!name){say(t('nf'),1,true);return}
  const p=find(name)||name;
  if(p===from){say(t('nf'),1,true);return}
  DB.edges=DB.edges.filter(e=>!(e.a===from&&e.b===p));DB.edges.push({a:from,b:p,n,t:turns});
  if(!DB.places.includes(p))DB.places.push(p);save();                      // saved in the phone's memory
  say(t('saved',{p,n}),1,true);say(t('more'),1,true);
  from=p;segStart=steps;turns=[];lastAsk=steps;state='teach';retry=null;
}
function nav(legsX){
  legs=legsX.map(l=>({to:l.to,n:l.n,passed:0,t:l.t.map(([at,d])=>({at,d,s:0}))}));li=0;steps=0;legStart=0;state='nav';
  announceLeg();
}
const announceLeg=()=>{const l=legs[li];say(t('go',{p:l.to,n:l.n,m:Math.round(l.n*STRIDE)}),1,true)};
function onStep(){
  if(state!=='nav')return;
  const l=legs[li],c=steps-legStart;
  for(const x of l.t){
    if(x.s<1&&x.at-c>0&&x.at-c<=4){x.s=1;say(t('turn',{n:x.at-c,d:t(x.d)}),1,true)}
    if(x.s<2&&c>=x.at){x.s=2;say(t('turnNow',{d:t(x.d)}),1,true)}
  }
  if(c>=l.n){
    say(t('arr',{p:l.to}),1,true);
    if(li<legs.length-1){li++;legStart=steps;announceLeg()}else state='free';
  }else if(c>l.n+Math.max(6,l.n*.3)&&!l.passed){l.passed=1;say(t('pass',{p:l.to}),1,true)}
}
function stopAll(talk){
  SID++;state='idle';retry=null;clearInterval(idleTimer);listening=false;
  try{rec&&rec.abort()}catch(e){}
  speechSynthesis.cancel();q=[];camStop();motionOff();geoOff();lock(false);acc=0;
  if(talk)say(t('done'),1);
}

/* ===== PERMISSIONS (asked at startup: camera, microphone, location, persistent storage) ===== */
async function perms(){
  let ok=true;
  try{const s=await navigator.mediaDevices.getUserMedia({video:true,audio:true});s.getTracks().forEach(x=>x.stop())}catch(e){ok=false}
  await new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(r,()=>{ok=false;r()},{timeout:8000,maximumAge:6e5}):r());
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  return ok;
}

/* ===== UI ===== */
function onOK(){
  vib(30);
  if(state==='idle')startSession();
  else if(state==='free')begin();
  else if(state==='teach'||state==='confirmStop')nameHere();
  else if(state==='askDest'){forceTeach=true;try{rec&&rec.stop()}catch(e){}}
}
function onCancel(){vib(30);if(state==='confirmStop'){state='teach';stopAt=steps}else stopAll(true)}
async function onBack(){
  vib(30);
  if(camOn&&!det){try{det=await loadDet()}catch(e){}}
  if(retry)retry();else if(lastInstr)say(lastInstr,1);
}
$('ok').onclick=onOK;$('cancel').onclick=onCancel;$('back').onclick=onBack;
$('startBtn').onclick=onOK;$('stopBtn').onclick=onCancel;stEl.onclick=onBack;     // tap the text line = repeat / retry
const show=v=>['homeView','settingsView','aboutView'].forEach(i=>$(i).classList.toggle('active',i===v));
$('settingsNavBtn').onclick=()=>{vib(15);show('settingsView')};
$('aboutNavBtn').onclick=()=>{vib(15);show('aboutView')};
$('backToHomeBtn').onclick=$('backFromAboutBtn').onclick=()=>{vib(15);show('homeView')};
document.addEventListener('keydown',e=>{   // optional external buttons (Bluetooth clicker / keyboard)
  if(e.target.tagName==='SELECT')return;
  const k={Enter:'ok',Escape:'cancel',Backspace:'back'}[e.key];if(k){e.preventDefault();$(k).click()}
});
document.addEventListener('pointerdown',e=>{if(!greeted){greeted=true;if(!/^(startBtn|ok)$/.test(e.target.id))say(t('hello'),1,true)}},true);
sel.innerHTML=LANGS.map((l,i)=>`<option value="${i}">${l[1]}${l[2]?' - '+l[2]:''}</option>`).join('');
sel.value=LANGS.indexOf(L);
sel.onchange=()=>{vib(15);setLang(LANGS[+sel.value][0],true)};                      // the choice is remembered
setInterval(()=>{const on=state!=='idle';$('stopBtn').style.display=on?'block':'none';const k=on?'ok':'start';if($('startBtn').textContent!==t(k))$('startBtn').textContent=t(k)},300);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&camOn){lock(true);nextFrame()}});
speechSynthesis.onvoiceschanged=pickVoice;
setLang(code,false);lastInstr=t('hello');stEl.textContent=t('hello');
permP=perms();
</script>
