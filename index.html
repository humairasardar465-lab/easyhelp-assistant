<script>
const video = document.getElementById('webcam');
const statusEl = document.getElementById('status');
const langSel = document.getElementById('voiceLanguage');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const openMapsBtn = document.getElementById('openMapsBtn');
const destinationInput = document.getElementById('destinationInput');

let stream = null, isLive = false, objectDetector = null, lastSpoken = "", lastSpeakTime = 0, lastClearSoundTime = 0;
let audioCtx = null;

const translations = {
  'ur-PK': {
    loading: 'سنسور آن ہو رہا ہے۔ براہ کرم انتظار کریں۔',

  'en-US': {

  },
  'hi-IN': {

    started: 'स्मार्ट केन चालू है।',
    stopClose: 'रुकिए, रुकावट है: ',
    clearPath: 'रास्ता साफ है, आगे बढ़ें।',
    camError: 'कैमरा अनुमति दें',
    netError: 'इंटरनेट या मॉडल समस्या'
  },
  'ar-SA': {
    loading: 'جاري تشغيل المستشعر.',
    started: 'العصا الذكية تعمل.',
    stopClose: 'توقف، عقبة أمامك: ',
    clearPath: 'الطريق نظيف، تقدم.',
    camError: 'السماح بالكاميرا',
    netError: 'مشكلة في الإنترنت أو النموذج'
  },
  'pa-IN': {
    loading: 'ਸੈਂਸਰ ਚਾਲੂ ਹੋ ਰਿਹਾ ਹੈ।',
    started: 'ਸਮਾਰਟ ਕੇਨ ਚਾਲੂ ਹੈ।',
    stopClose: 'ਰੁਕ ਜਾਓ, ਰੁਕਾਵਟ ਹੈ: ',
    clearPath: 'ਰਸਤਾ ਸਾਫ਼ ਹੈ!',
    camError: 'ਕੈਮਰਾ ਅਨੁਮਤੀ ਦਿਓ',
    netError: 'ਇੰਟਰਨੈਟ ਜਾਂ ਮਾਡਲ ਸਮੱਸਿਆ'
  },
  'ps-PK': {
    loading: 'سنسور روان دی. مهرباني وکئ انتظار وکئ.',
    started: 'سمارټ کین روان دی.',
    stopClose: 'ددرېږئ، خنډ شته: ',
    clearPath: 'لار سمه ده، مخکې لاړ شئ.',
    camError: 'د کامرې اجازه ورکړئ',
    netError: 'د انټرنیټ ستونزه'
  },
  'fa-IR': {
    loading: 'سنسور در حال روشن شدن است.',
    started: 'اسمارت کین روشن است.',
    stopClose: 'توقف کنید، مانع: ',
    clearPath: 'مسیر تمیز است، جلو بروید.',
    camError: 'اجازه دسترسی به دوربین',
    netError: 'مشکل اینترنت'
  }
};

const allNames = {
  'ur-PK': {
    'person': 'آدمی', 'chair': 'کرسی', 'table': 'ٹیبل', 'bottle': 'بوتل',
    'cup': 'کپ', 'laptop': 'لیپ ٹاپ', 'cell phone': 'موبایل', 'book': 'کتاب',
    'potted plant': 'گملا', 'car': 'کار', 'bus': 'بس', 'truck': 'ٹرک',
    'motorcycle': 'موٹر سائیکل', 'bicycle': 'سائیکل', 'dog': 'کتا', 'cat': 'بلی',
    'bed': 'بیڈ', 'couch': 'صوفہ', 'door': 'دروازہ'
  },
  'pa-IN': {
    'person': 'ਬੰਦਾ', 'chair': 'ਕੁਰਸੀ', 'table': 'ਮੇਜ਼', 'bottle': 'ਬੋਤਲ',
    'car': 'ਕਾਰ', 'bus': 'ਬੱਸ', 'motorcycle': 'ਮੋਟਰਸਾਈਕਲ', 'bicycle': 'ਸਾਈਕਲ'
  },
  'ar-SA': {
    'person': 'شخص', 'chair': 'كرسي', 'table': 'طاولة', 'bottle': 'زجاجة',
    'car': 'سيارة', 'bus': 'حافلة', 'motorcycle': 'دراجة نارية', 'bicycle': 'دراجة'
  },
  'hi-IN': {
    'person': 'व्यक्ति', 'chair': 'कुर्सी', 'table': 'मेज़', 'bottle': 'बोतल',
    'car': 'कार', 'bus': 'बस', 'motorcycle': 'मोटरसाइकिल', 'bicycle': 'साइकिल'
  },
  'ps-PK': {
    'person': 'کس', 'chair': 'څوکۍ', 'table': 'میز', 'bottle': 'بوتل',
    'car': 'موټر', 'bus': 'بس'
  },
  'fa-IR': {
    'person': 'فرد', 'chair': 'صندلی', 'table': 'میز', 'bottle': 'بطری',
    'car': 'ماشین', 'bus': 'اتوبوس'
  }
};

function getLocalizedName(category) {
  const lang = langSel.value;
  if (allNames[lang] && allNames[lang][category]) {
    return allNames[lang][category];
  }
  return category;
}

function getT(key) {
  const lang = langSel.value;
  if (translations[lang] && translations[lang][key]) {
    return translations[lang][key];
  }
  return translations['en-US'][key] || key;
}

function triggerVibration() {
  if ('vibrate' in navigator) {
    try { navigator.vibrate([200, 100, 200]); } catch (e) {}
  }
}

function playBeep(type) {
  try {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'clear') {
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'obstacle') {
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }
  } catch (e) {}
}

function speak(text) {
  if (!text) return;
  const now = Date.now();
  if (text === lastSpoken && now - lastSpeakTime < 2500) return;
  lastSpoken = text;
  lastSpeakTime = now;

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = langSel.value;
    window.speechSynthesis.speak(utterance);
  }
}

async function initDetector() {
  if (objectDetector) return;
  
  // Wait for module to load if not ready yet
  if (!window.FilesetResolver || !window.ObjectDetector) {
    await new Promise(resolve => {
      window.addEventListener('mediapipe-loaded', resolve, { once: true });
      setTimeout(resolve, 3000); // fallback timeout
    });
  }

  try {
    statusEl.innerText = getT('loading');
    const vision = await window.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm"
    );
    objectDetector = await window.ObjectDetector.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
        delegate: "CPU"
      },
      scoreThreshold: 0.3,
      runningMode: "VIDEO"
    });
  } catch (err) {
    console.error(err);
    statusEl.innerText = getT('netError');
    speak(getT('netError'));
  }
}

async function startCamera() {
  try {
    await initDetector();
    if (!objectDetector) {
      statusEl.innerText = getT('netError');
      speak(getT('netError'));
      return;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });
    video.srcObject = stream;
    video.onloadedmetadata = () => {
      video.play();
      isLive = true;
      statusEl.innerText = getT('started');
      speak(getT('started'));
      startBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      window.requestAnimationFrame(predictWebcam);
    };
  } catch (err) {
    console.error(err);
    statusEl.innerText = getT('camError');
    speak(getT('camError'));
  }
}

let lastVideoTime = -1;

async function predictWebcam() {
  if (!isLive) return;

  if (!objectDetector) {
    if (isLive) {
      window.requestAnimationFrame(predictWebcam);
    }
    return;
  }

  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime;

    try {
      const startTimeMs = performance.now();
      const detections = objectDetector.detectForVideo(video, startTimeMs);

      if (detections && detections.detections && detections.detections.length > 0) {
        let closest = detections.detections[0];
        let maxArea = 0;
        
        for (let det of detections.detections) {
          const area = det.boundingBox.width * det.boundingBox.height;
          if (area > maxArea) {
            maxArea = area;
            closest = det;
          }
        }

        const rawCategory = closest.categories[0].categoryName;
        const localizedName = getLocalizedName(rawCategory);
        const confidence = Math.round(closest.categories[0].score * 100);
        
        if (confidence > 30) {
          const videoWidth = video.videoWidth || 640;
          const videoArea = videoWidth * (video.videoHeight || 480);
          const sizeRatio = maxArea / videoArea;
          
          let distanceText = "";
          const lang = langSel.value;
          if (lang.startsWith('en')) {
            if (sizeRatio > 0.25) distanceText = "very close, stop!";
            else if (sizeRatio > 0.1) distanceText = "close, careful!";
            else distanceText = "a bit far";
          } else {
            if (sizeRatio > 0.25) distanceText = "بہت قریب ہے، رک جائیں!";
            else if (sizeRatio > 0.1) distanceText = "قریب ہے، دھیان سے!";
            else distanceText = "تھوڑا دور ہے";
          }

          const boxCenterX = closest.boundingBox.originX + (closest.boundingBox.width / 2);
          let sideText = "";
          if (lang.startsWith('en')) {
            if (boxCenterX < videoWidth * 0.35) sideText = "on the left";
            else if (boxCenterX > videoWidth * 0.65) sideText = "on the right";
            else sideText = "right in front";
          } else {
            if (boxCenterX < videoWidth * 0.35) sideText = "بائیں طرف ہے";
            else if (boxCenterX > videoWidth * 0.65) sideText = "دائیں طرف ہے";
            else sideText = "بالکل سامنے ہے";
          }

          statusEl.innerText = `${getT('stopClose')} ${localizedName} (${distanceText}, ${sideText})`;
          playBeep('obstacle');
          triggerVibration();
          speak(`${getT('stopClose')} ${localizedName}، ${distanceText}، ${sideText}`);
        }
      } else {
        statusEl.innerText = getT('clearPath');
        
        // Gentle tick sound every 800ms
        const now = Date.now();
        if (now - lastClearSoundTime > 800) {
          lastClearSoundTime = now;
          playBeep('clear');
        }

        // Speak clear path strictly every 2.5 seconds using precise milliseconds
        if (now - lastSpeakTime > 2500) {
          speak(getT('clearPath'));
        }
      }
    } catch (e) {
      console.error(e);
    }
  }

  if (isLive) {
    window.requestAnimationFrame(predictWebcam);
  }
}

function stopCamera() {
  if ('vibrate' in navigator) {
    try { navigator.vibrate(0); } catch(e){}
  }
  isLive = false;
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
  statusEl.innerText = "STATUS: OFF";
  startBtn.style.display = 'block';
  stopBtn.style.display = 'none';
}

startBtn.addEventListener('click', async () => {
  await startCamera();
});

stopBtn.addEventListener('click', () => {
  stopCamera();
});

openMapsBtn.addEventListener('click', () => {
  const dest = destinationInput.value.trim();
  if (dest) {
    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank');
  } else {
    window.open(`https://www.google.com/maps`, '_blank');
  }
});
</script>
