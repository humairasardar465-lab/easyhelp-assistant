<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart King - Mobile Is Your Eye</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@latest"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#0a0f1e;color:#fff;margin:0;padding:16px}
.top{max-width:620px;margin:auto;background:#111827;padding:22px;border-radius:16px}
h2{text-align:center;color:#00ffcc;margin:0}
.sub{text-align:center;font-size:12px;color:#94a3b8;margin:6px 0 14px}
label{display:block;color:#00ffcc;font-size:13px;font-weight:700;margin:14px 0 6px}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
video{width:100%;height:320px;border-radius:12px;background:#000;object-fit:cover;margin-top:12px;border:3px solid #00ffcc}
button{border:none;padding:14px;font-size:16px;border-radius:10px;cursor:pointer;margin-top:10px;font-weight:700;width:100%}
.btn-main{background:#00ffcc;color:#000}
.btn-voice{background:#d97706;color:#fff}
.btn-map{background:#0284c7;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
#status{text-align:center;margin:10px 0;font-weight:700}
#sensorBox{text-align:center;padding:12px;background:#064e3b;border-radius:10px;margin-top:10px;font-size:14px}
#output{margin-top:14px;padding:12px;background:#1f2937;border-radius:10px;min-height:40px;font-size:14px;text-align:center;color:#94a3b8}
</style>
</head>
<body>
<div class="top">
<h2>SMART KING</h2>
<div class="sub">MOBILE IS YOUR EYE - REAL TIME OBJECT DETECTION</div>

<label>SELECT LANGUAGE</label>
<select id="voiceLanguage">
<option value="ur-PK" selected>Urdu</option>
<option value="en-US">English</option>
<option value="hi-IN">Hindi</option>
<option value="ar-SA">Arabic</option>
<option value="pa-IN">Punjabi</option>
</select>

<label>DESTINATION</label>
<input type="text" id="destinationInput" placeholder="e.g. Okara Bazar">
<button id="openMapsBtn" class="btn-map">OPEN MAPS</button>

<div id="status">STATUS: OFF</div>

<button id="startBtn" class="btn-main">START - CAMERA + SENSOR ON</button>
<button id="voiceBtn" class="btn-voice">VOICE COMMAND</button>
<button id="stopBtn" class="btn-stop" style="display:none;">STOP</button>

<video id="webcam" autoplay playsinline muted></video>

<div id="sensorBox">SENSOR: OFF</div>
<div id="output">System will SPEAK, not only write.</div>
</div>

<script>
const video=document.getElementById('webcam');
const output=document.getElementById('output');
const sensorBox=document.getElementById('sensorBox');
const statusEl=document.getElementById('status');
const langSel=document.getElementById('voiceLanguage');
let stream=null, isLive=false, model=null, timer=null, lastSpoken="", lastSpeakTime=0, audioCtx=null;

function getLang(){ return langSel.value; }

function speakText(t){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=getLang(); u.rate=0.95;
  window.speechSynthesis.speak(u);
  output.innerText="Speaking: "+t;
}

function playTone(){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(); const g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=880; o.type='sine';
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
    o.start(); o.stop(audioCtx.currentTime+0.4);
  }catch(e){}
}

function vibrateLight(){
  if(navigator.vibrate) navigator.vibrate([120]);
}

function getUrduName(en){
  const map={
    'person':'samne ek insan hai',
    'chair':'samne kursi hai',
    'couch':'samne sofa hai',
    'bed':'samne bed hai',
    'dining table':'samne table hai',
    'car':'samne gari hai',
    'motorcycle':'samne bike hai',
    'bicycle':'samne cycle hai',
    'bus':'samne bus hai',
    'truck':'samne truck hai',
    'dog':'samne kutta hai',
    'cat':'samne billi hai',
    'cow':'samne gaaye hai',
    'bottle':'samne bottle hai',
    'cell phone':'samne mobile hai'
  };
  if(map[en]) return map[en];
  return 'samne '+en+' hai';
}

async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
    catch(e){ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    video.srcObject=stream; await video.play();
    return true;
  }catch(e){ speakText('Camera ki ijazat dein'); return false; }
}

async function detectReal(){
  if(!isLive || !model) return;
  if(!video.videoWidth) return;
  try{
    const predictions = await model.detect(video);
    let found = predictions.filter(p=>p.score>0.55);
    found.sort((a,b)=> (b.bbox[2]*b.bbox[3]) - (a.bbox[2]*a.bbox[3]));
    const now=Date.now();
    if(found.length>0){
      const obj = found[0].class;
      const urduText = getUrduName(obj);
      if(urduText !== lastSpoken || now - lastSpeakTime > 6000){
        lastSpoken=urduText; lastSpeakTime=now;
        playTone();
        vibrateLight();
        sensorBox.style.background="#7f1d1d";
        sensorBox.innerText="SENSOR: OBJECT FOUND - "+obj.toUpperCase();
        if(getLang()==='ur-PK') speakText('Ruk jayen, '+urduText+', aahista baien ho jayen.');
        else speakText('Stop, '+obj+' in front.');
      }
    } else {
      sensorBox.style.background="#064e3b";
      sensorBox.innerText="SENSOR: PATH CLEAR";
      if(now - lastSpeakTime > 8000){
        lastSpoken="clear"; lastSpeakTime=now;
        if(getLang()==='ur-PK') speakText('Rasta saaf hai, seedhe chalte jayen.');
        else speakText('Path is clear, keep walking straight.');
      }
    }
  }catch(e){ console.log(e); }
}

document.getElementById('startBtn').addEventListener('click', async ()=>{
  statusEl.innerText="STATUS: LOADING AI MODEL...";
  speakText('Model load ho raha hai, thora intezar karein.');
  if(!await ensureCamera()) return;
  try{ if(!model) model = await cocoSsd.load(); }
  catch(e){ speakText('Internet on karein, model load karne ke liye internet chahiye.'); return; }
  isLive=true;
  statusEl.innerText="STATUS: LIVE - OBJECT DETECTION ON";
  document.getElementById('startBtn').style.display="none";
  document.getElementById('stopBtn').style.display="block";
  speakText('Camera aur Sensor on ho gaya hai. Ab main samne wali asli cheez ka naam bol kar bataungi.');
  timer=setInterval(detectReal, 1500);
});

document.getElementById('stopBtn').addEventListener('click', ()=>{
  isLive=false; clearInterval(timer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null;
  window.speechSynthesis.cancel();
  statusEl.innerText="STATUS: OFF";
  document.getElementById('startBtn').style.display="block";
  document.getElementById('stopBtn').style.display="none";
});

document.getElementById('voiceBtn').addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return;
  const rec=new SR(); rec.lang='ur-PK';
  rec.onresult=(e)=>{
    const q=e.results[0][0].transcript;
    if(q.includes('samne')||q.includes('kya hai')){
      speakText('Main abhi camera se dekh kar batati hoon samne kya hai.');
      setTimeout(detectReal, 800);
    } else {
      speakText('Main sun rahi hoon, mobile samne rakhen.');
    }
  };
  rec.start();
  speakText('Ji bolein, main sun rahi hoon.');
});

document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q=document.getElementById('destinationInput').value.trim();
  if(!q){ speakText('Pehle upar likhen kahan jana hai.'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
</body>
</html>
