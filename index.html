function getMsg(key) {
  const lang = langSel.value;
  if(translations[lang] && translations[lang][key]) {
    return translations[lang][key];
  }
  return translations['en-US'][key] || key;
}

function getObjName(objKey) {
  const lang = langSel.value;
  if(translations[lang] && translations[lang].objects && translations[lang].objects[objKey]) {
    return translations[lang].objects[objKey];
  }
  if(translations['en-US'].objects[objKey]) {
    return translations['en-US'].objects[objKey];
  }
  return objKey;
}

function speakText(t){
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = langSel.value; 
  u.rate = 1.0;
  window.speechSynthesis.speak(u);
}

function playHurdleTone(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 880; o.type = 'sine';
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    o.start(); o.stop(audioCtx.currentTime + 0.3);
  }catch(e){}
}

function playClearTone(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = 750;
    o.type = 'triangle';
    g.gain.setValueAtTime(0.85, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);
    o.start(); o.stop(audioCtx.currentTime + 0.45);
  }catch(e){}
}

function vibrateHurdle(){
  if(!navigator.vibrate) return;
  navigator.vibrate([300, 100, 300]);
}

async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { exact: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream; await video.play(); return true;
  }catch(e){
    try{ 
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); 
      video.srcObject = stream; await video.play(); return true; 
    }catch(e2){
      try{
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream; await video.play(); return true;
      }catch(e3){
        speakText(getMsg('camError')); return false;
      }
    }
  }
}

function getScreenInfo(){
  if(!video.videoWidth) return {variance: 100, change: 0, verticalTilt: 0, leftAvg: 100, rightAvg: 100};
  const c = document.createElement('canvas'); c.width = 60; c.height = 45;
  const ctx = c.getContext('2d'); ctx.drawImage(video, 0, 0, 60, 45);
  const d = ctx.getImageData(0, 0, 60, 45).data;
  
  let leftSum = 0, rightSum = 0;
  let topSum = 0, bottomSum = 0;
  let totalSum = 0;

  for(let y = 0; y < 45; y++){
    for(let x = 0; x < 60; x++){
      let idx = (y * 60 + x) * 4;
      let brightness = (d[idx] + d[idx+1] + d[idx+2]) / 3;
      totalSum += brightness;
      if(x < 30) leftSum += brightness; else rightSum += brightness;
      if(y < 22) topSum += brightness; else bottomSum += brightness;
    }
  }

  let avg = totalSum / (60 * 45);
  let leftAvg = leftSum / (30 * 45);
  let rightAvg = rightSum / (30 * 45);

  let variance = 0; 
  for(let i = 0; i < d.length; i += 4){ 
    variance += Math.abs(((d[i] + d[i+1] + d[i+2]) / 3) - avg); 
  } 
  variance = variance / (60 * 45);
  
  let change = Math.abs(avg - lastAvg); 
  lastAvg = avg;

  let verticalTilt = (topSum / (60 * 22)) - (bottomSum / (60 * 23));

  return {variance, change, verticalTilt, leftAvg, rightAvg};
}

function startVoiceRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    speakText("Speech recognition not supported.");
    return;
  }
  const recognition = new SpeechRecognition();
  recognition.lang = langSel.value;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onresult = (event) => {
    const speechResult = event.results[0][0].transcript.toLowerCase();
    statusEl.innerText = "HEARD: " + speechResult;
    waitingForUserReady = false;
    micBtn.style.display = "none";
    
    const info = getScreenInfo();
    if (info.leftAvg > info.rightAvg + 10) {
      currentSafeDirection = "left";
      speakText(getMsg('safeLeft'));
      statusEl.innerText = "SAFE SIDE: LEFT";
    } else if (info.rightAvg > info.leftAvg + 10) {
      currentSafeDirection = "right";
      speakText(getMsg('safeRight'));
      statusEl.innerText = "SAFE SIDE: RIGHT";
    } else {
      currentSafeDirection = "straight";
      speakText(getMsg('safeStraight'));
      statusEl.innerText = "SAFE SIDE: STRAIGHT";
    }
  };

  recognition.onerror = () => {
    waitingForUserReady = false;
    micBtn.style.display = "none";
  };

  recognition.start();
}

micBtn.addEventListener('click', () => {
  startVoiceRecognition();
});

async function detectLoop(){
  if(!isLive) return;

  if(!model || !video.videoWidth) {
    requestAnimationFrame(detectLoop);
    return;
  }

  if (waitingForUserReady) {
    if(isLive) setTimeout(() => requestAnimationFrame(detectLoop), 500);
    return;
  }

  let found = [];
  try{
    const preds = await model.detect(video);
    // اب صرف پکی اور واضح چیزیں پکڑی جائیں گی (تھرشولڈ 0.5)
    found = preds.filter(p => p.score > 0.5);
  }catch(e){}

  const info = getScreenInfo();
  let now = Date.now();

  // جعلی سٹیئرز کو مکمل ختم کرنے کے لیے کنڈیشن سخت کر دی گئی ہے (صرف تیز ٹلٹ پر چلے گا)
  let potentialStairCondition = (info.change > 12 && info.change < 30 && Math.abs(info.verticalTilt) > 18);

  if (potentialStairCondition) {
    if (!stairMode) {
      stairMode = true;
      stairStepCount = 1;
      stairDirection = info.verticalTilt > 0 ? 'up' : 'down';
      let startText = stairDirection === 'up' ? getMsg('stairsUpStart') : getMsg('stairsDownStart');
      speakText(startText);
      statusEl.innerText = "STAIRS (" + stairDirection.toUpperCase() + ")";
    } else {
      if (now - lastStairCheckTime > 3000) {
        stairStepCount++;
        lastStairCheckTime = now;
        let stepText = (stairDirection === 'up' ? getMsg('stairUpMsg') : getMsg('stairDownMsg')) + " " + stairStepCount;
        speakText(stepText);
        statusEl.innerText = "STAIRS STEP " + stairStepCount;
      }
    }
  } else {
    if (stairMode && Math.abs(info.verticalTilt) < 3) {
      stairMode = false;
      speakText(getMsg('stairsEnd'));
      statusEl.innerText = "STAIRS ENDED";
      stairStepCount = 0;
    }
  }

  if (!stairMode && now - lastSpokenTime > 4500) {
    if (found.length > 0) {
      let matchedObj = found[0];
      let objName = getObjName(matchedObj.class);
      
      let alertText = "";
      const lang = langSel.value;
      if (lang.startsWith('ur')) {
        alertText = `رک جائیں! سامنے ${objName} ہے۔ چہرہ ${currentHeading} کی طرف ہے۔`;
      } else if (lang.startsWith('hi')) {
        alertText = `रुकिए! सामने ${objName} है। दिशा ${currentHeading} है।`;
      } else if (lang.startsWith('ar')) {
        alertText = `توقف! يوجد ${objName} في الأمام. الاتجاه نحو ${currentHeading}.`;
      } else {
        alertText = `Stop! ${objName} ahead. Facing ${currentHeading}.`;
      }

      lastSpokenTime = now;
      playHurdleTone();
      vibrateHurdle();
      speakText(alertText);
      statusEl.innerText = "OBSTACLE: " + objName.toUpperCase();

      waitingForUserReady = true;
      micBtn.style.display = "block";
      setTimeout(() => {
        speakText(getMsg('readyPrompt'));
      }, 2500);

    } else {
      let clearText = getMsg('clear') + " " + currentHeading;
      lastSpokenTime = now;
      playClearTone();
      speakText(clearText);
      statusEl.innerText = "STATUS: GO AHEAD - CLEAR (" + currentHeading + ")";
    }
  }

  if(isLive) {
    setTimeout(() => requestAnimationFrame(detectLoop), 300);
  }
}

document.getElementById('startBtn').addEventListener('click', async () => {
  statusEl.innerText = "STATUS: LOADING...";
  speakText(getMsg('loading'));
  
  if(!await ensureCamera()) {
    statusEl.innerText = "STATUS: OFF";
    return;
  }

  try {
    if(!model) {
      model = await cocoSsd.load();
    }
  } catch(e) {
    speakText(getMsg('netError'));
    statusEl.innerText = "STATUS: OFF";
    return;
  }

  isLive = true;
  statusEl.innerText = "STATUS: LIVE";
  document.getElementById('startBtn').style.display = "none";
  document.getElementById('stopBtn').style.display = "block";
  speakText(getMsg('started'));
  requestAnimationFrame(detectLoop);
});

document.getElementById('stopBtn').addEventListener('click', () => {
  isLive = false; 
  if(stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  stream = null; 
  video.srcObject = null;
  window.speechSynthesis.cancel();
  stairMode = false;
  stairStepCount = 0;
  waitingForUserReady = false;
  micBtn.style.display = "none";
  statusEl.innerText = "STATUS: OFF";
  document.getElementById('startBtn').style.display = "block";
  document.getElementById('stopBtn').style.display = "none";
});

document.getElementById('openMapsBtn').addEventListener('click', () => {
  const q = document.getElementById('destinationInput').value.trim();
  if(!q){ 
    speakText('Pehle upar likhen kahan jana hai.'); 
    return; 
  }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, '_blank');
});
</script>
