<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart King Assistant</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0f1e;color:#fff;text-align:center;margin:0;padding:16px}
.top{max-width:620px;margin:auto;background:#111827;padding:22px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);text-align:left}
h2{text-align:center;color:#00ffcc;margin:0;font-size:24px;letter-spacing:.5px}
.creator{text-align:center;font-size:12px;color:#94a3b8;margin:6px 0 16px}
label{display:block;color:#00ffcc;font-size:13px;font-weight:700;margin:14px 0 6px;letter-spacing:.3px;text-transform:uppercase}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px;outline:none}
video{width:100%;height:280px;border-radius:12px;background:#000;object-fit:cover;margin-top:12px}
button{border:none;padding:13px;font-size:15px;border-radius:10px;cursor:pointer;margin-top:10px;font-weight:700;width:100%}
.btn-main{background:#00ffcc;color:#000}
.btn-map{background:#0284c7;color:#fff}
.btn-voice{background:#d97706;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
#output{margin-top:14px;padding:12px;background:#1f2937;border-radius:10px;min-height:48px;font-size:14px;text-align:right}
.status{text-align:center;margin:10px 0;font-size:13px;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;background:#ef4444;border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
hr{border:0;border-top:1px solid #374151;margin:18px 0}
</style>
</head>
<body>
<div class="top">
<h2>👑 SMART KING ASSISTANT</h2>
<div class="creator">Created by Humaira Sardar | EasyHelp Smart Cane & GPS</div>
<div class="status"><span class="dot"></span> <span id="liveStatus">OFF</span></div>

<label>Select Language</label>
<select id="voiceLanguage">
<option value="ur-PK" selected>Urdu</option>
<option value="en-US">English</option>
<option value="ar-SA">Arabic</option>
<option value="hi-IN">Hindi</option>
<option value="pa-IN">Punjabi</option>
</select>

<label>Destination Search</label>
<input type="text" id="destinationInput" placeholder="Enter destination...">
<button id="openMapsBtn" class="btn-map">Open Maps</button>

<hr>

<label>Live Camera</label>
<button id="startBtn" class="btn-main">Start Live Mode</button>
<button id="voiceBtn" class="btn-voice">Voice Command</button>
<button id="stopBtn" class="btn-stop" style="display:none;">Stop Live</button>

<video id="webcam" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>
<div id="output"></div>
</div>

<script>
const video=document.getElementById('webcam');
const canvas=document.getElementById('canvas');
const output=document.getElementById('output');
const voiceLanguageSelect=document.getElementById('voiceLanguage');
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
const liveStatus=document.getElementById('liveStatus');
let autoTimer=null, stream=null, isLive=false, isPaused=false, isThinking=false;

// Key Attached
const API_KEY = "AIzaSyDI5btsG8Wu77sAj8gI9Ug8E_9Lr_FvN5A";

const systemIdentity = "You are Smart King Assistant, created by Smart King. Never mention Google, Gemini. Reply concisely in the requested language.";

function speakText(text){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=voiceLanguageSelect.value; u.rate=1.0;
  window.speechSynthesis.speak(u);
  output.innerText=text;
}

async function analyzeCamera(){
  if(!isLive || isPaused || isThinking || !video.srcObject) return;
  isThinking=true;
  canvas.width=video.videoWidth||640;
  canvas.height=video.videoHeight||480;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const base64Image=canvas.toDataURL('image/jpeg',0.5).split(',')[1];
  const lang=voiceLanguageSelect.value;
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[
        {text:`${systemIdentity} This is a LIVE camera frame for a blind person. Tell in ONLY 1 short line what is in front RIGHT NOW. Describe ANY object - person, bike, car, wall, stairs, dog, hole, table, tree, shop, road, anything you see. If obstacle is close say STOP. If path is clear say CLEAR. Reply STRICTLY in language code ${lang}. Very short.`},
        {inline_data:{mime_type:"image/jpeg",data:base64Image}}
      ]}]})
    });
    const data=await res.json();
    if(data.candidates && data.candidates[0].content){
      speakText(data.candidates[0].content.parts[0].text);
    }
  }catch(e){ console.log(e); }
  isThinking=false;
}

async function startAutoLive(){
  if(isLive) return;
  try{
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
    catch(e){ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    video.srcObject=stream;
    isLive=true; isPaused=false;
    liveStatus.innerText="LIVE - 1 SEC MODE";
    startBtn.style.display="none"; stopBtn.style.display="block";
    speakText("میں سمارٹ کنگ اسسٹنٹ ہوں، لائیو آن ہو گیا ہے، اب میں ہر سیکنڈ کیمرے سے دیکھ کر بتاؤں گی کہ سامنے کیا ہے۔");
    autoTimer=setInterval(analyzeCamera, 1000);
    setTimeout(analyzeCamera, 500);
  }catch(err){ speakText("براہ کرم کیمرہ کی اجازت دیں۔"); }
}

function stopLive(){
  isLive=false; if(autoTimer) clearInterval(autoTimer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  window.speechSynthesis.cancel();
  liveStatus.innerText="OFF";
  startBtn.style.display="block"; stopBtn.style.display="none";
  output.innerText="";
}
startBtn.addEventListener('click', startAutoLive);
stopBtn.addEventListener('click', stopLive);

document.getElementById('voiceBtn').addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ speakText("Chrome استعمال کریں۔"); return; }
  const rec=new SR(); rec.lang=voiceLanguageSelect.value;
  rec.onresult=(e)=>{
    const q=e.results[0][0].transcript.toLowerCase();
    if(q.includes("رک")||q.includes("stop")){ isPaused=true; speakText("ٹھیک ہے، میں رک گئی ہوں۔"); }
    else if(q.includes("چلو")||q.includes("start")){ isPaused=false; speakText("ٹھیک ہے، پھر چلتے ہیں۔"); analyzeCamera(); }
    else{ speakText("رکیں، میں کیمرے سے دیکھ کر بتاتی ہوں۔"); analyzeCamera(); }
  };
  rec.start();
  speakText("جی بولیں، میں سن رہی ہوں۔");
});

document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q=document.getElementById('destinationInput').value.trim();
  if(!q){ speakText("براہ کرم پہلے منزل کا نام لکھیں۔"); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
</body>
</html>
