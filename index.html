function getLocalizedName(category) { return "رکاوٹ ہے"; }
function getT(key) { const lang = langSel.value; if (translations[lang] && translations[lang][key]) { return translations[lang][key]; } if (translations['en-US'][key]) return translations['en-US'][key]; return translations['en-US']['stopClose'] || key; }

function lightVibration() { if ('vibrate' in navigator) { try { navigator.vibrate(15); } catch (e) {} } }
function playBeep(type) {
  try {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    if (type === 'small') {
      const now = audioCtx.currentTime;
      [0, 0.16].forEach(function(offset) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine'; o.frequency.setValueAtTime(880, now + offset);
        g.gain.setValueAtTime(0.12, now + offset);
        g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
        o.start(now + offset); o.stop(now + offset + 0.12);
      });
      return;
    }
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'clear') {
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'obstacle') {
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(180, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.setValueAtTime(0.3, now + 0.1);
      osc.start(now); osc.stop(now + 0.22);
    }
  } catch (e) {}
}
function speak(text, isObstacle = false) {
  if (!text) return;
  if (!('speechSynthesis' in window)) return;
  const now = Date.now();
  if (text === lastSpoken && now - lastSpeakTime < 2000 && !isObstacle) return;
  if (isObstacle && currentMode !== "obstacle") { window.speechSynthesis.cancel(); }
  if (!isObstacle && isSpeakingObstacle) return;
  if (isObstacle) { window.speechSynthesis.cancel(); }
  lastSpoken = text; lastSpeakTime = now;
  if (isObstacle) { isSpeakingObstacle = true; }
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langSel.value;
  utterance.onend = () => { if (isObstacle) { setTimeout(() => { isSpeakingObstacle = false; }, 50); } };
  utterance.onerror = () => { if (isObstacle) { setTimeout(() => { isSpeakingObstacle = false; }, 50); } };
  window.speechSynthesis.speak(utterance);
}
async function waitForMediapipe() {
  if (window.FilesetResolver && window.ObjectDetector) return true;
  return new Promise(function(resolve) {
    let done = false;
    const t = setTimeout(function() { if (!done) { done = true; resolve(false); } }, 15000);
    window.addEventListener('mediapipe-loaded', function() { if (!done) { done = true; clearTimeout(t); resolve(true); } }, { once: true });
  });
}
async function initDetector() {
  if (objectDetector) return true;
  if (isDetectorLoading) return false;
  isDetectorLoading = true;
  try {
    statusEl.innerText = getT('loading');
    const ok = await waitForMediapipe();
    if (!ok) { throw new Error('mediapipe timeout'); }
    const vision = await window.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm");
    const detectorPromise = window.ObjectDetector.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite", delegate: "CPU" }, scoreThreshold: 0.50, runningMode: "VIDEO" });
    const timeoutPromise = new Promise(function(_, reject) { setTimeout(function() { reject(new Error('model timeout')); }, 15000); });
    objectDetector = await Promise.race([detectorPromise, timeoutPromise]);
    isDetectorLoading = false;
    return true;
  } catch (err) {
    console.error(err);
    isDetectorLoading = false;
    objectDetector = null;
    if (isLive) { statusEl.innerText = getT('netError'); speak(getT('netError'), false); }
    return false;
  }
}
async function startCamera() {
  try {
    if (isLive || stream) return;
    statusEl.innerText = getT('loading');
    startBtn.innerText = 'PLEASE WAIT...';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { statusEl.innerText = getT('camError'); speak(getT('camError'), false); startBtn.innerText = 'START'; return; }
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });

    video.onloadedmetadata = async () => {
      try { await video.play(); } catch(e) {}
      isLive = true; statusEl.innerText = getT('started'); speak(getT('started'), false);
      startBtn.style.display = 'none'; stopBtn.style.display = 'block';
      window.requestAnimationFrame(predictWebcam);
      const ok = await initDetector();
      if (!ok && isLive) { statusEl.innerText = getT('netError'); }
    };
  } catch (err) {
    console.error(err);
    startBtn.innerText = 'START';
    statusEl.innerText = getT('camError'); speak(getT('camError'), false);
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }
}
let lastVideoTime = -1;
async function predictWebcam() {
  if (!isLive) return;
  if (!objectDetector) {
    if (isLive) { window.requestAnimationFrame(predictWebcam); }
    return;
  }
  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime; frameCount++;

      const hasObjectDetected = detections && detections.detections && detections.detections.length > 0;
      if (!hasObjectDetected) { nothingCount++; } else { nothingCount = 0; clearWaitCount = 0; }
      if (hasObjectDetected) {
        let closest = detections.detections[0]; let maxArea = 0;
        for (let det of detections.detections) { const area = det.boundingBox.width * det.boundingBox.height; if (area > maxArea) { maxArea = area; closest = det; } }
        const confidence = Math.round(closest.categories[0].score * 100);
        const requiredConfidence = 50;
        if (confidence >= requiredConfidence) {
          const videoWidth = video.videoWidth || 640;
          const videoHeight = video.videoHeight || 480;
          const videoArea = videoWidth * videoHeight;
          const sizeRatio = maxArea / videoArea;
          if (sizeRatio >= 0.02) {
            obstacleConfirmCount++;
            if (obstacleConfirmCount >= 5) {
              // سمت نکالنا - دائیں / بائیں / بیچ
              const box = closest.boundingBox;
              const centerX = (box.originX + box.width / 2) / videoWidth;
              const boxHeightRatio = box.height / videoHeight;
              const boxWidthRatio = box.width / videoWidth;
              const isTallVertical = (box.height > box.width * 1.5) && (boxHeightRatio > 0.45);
              const isWallLike = (boxWidthRatio > 0.75 && boxHeightRatio > 0.6) || (sizeRatio > 0.45);
              const totalCount = detections.detections.length;
              let fullObstacleText = "";
              if (isWallLike) {
                fullObstacleText = getT('wallObs');
              } else if (isTallVertical) {
                fullObstacleText = getT('wallObs');
              } else if (totalCount >= 3) {
                fullObstacleText = getT('multiObs');
              } else if (centerX < 0.33) {
                fullObstacleText = getT('leftObs');
              } else if (centerX > 0.66) {
                fullObstacleText = getT('rightObs');
              } else {
                fullObstacleText = getT('centerObs');
              }
              // فاصلہ - بہت قریب ہے تو زیادہ زور سے
              if (sizeRatio >= 0.30 && !isWallLike) {
                fullObstacleText = getT('closeObs') + " - " + fullObstacleText;
              }
              statusEl.innerText = fullObstacleText;
              const now = Date.now();
              if (currentMode !== "obstacle" || lastObstacleName !== fullObstacleText || (now - lastObstacleAlertTime > 4000)) {
                currentMode = "obstacle"; lastObstacleName = fullObstacleText; lastObstacleAlertTime = now;

              }
              if (now - lastBeepTime > 800) {
                lastBeepTime = now;
                if (sizeRatio >= 0.15) { playBeep('obstacle'); } else { playBeep('small'); }
              }
            }
          } else { handleClearPath(); }
        } else { handleClearPath(); }
      } else { handleClearPath(); }
    } catch (e) { console.error(e); }
  }

}
function handleClearPath() {
  obstacleConfirmCount = 0;
  const now = Date.now();

    currentMode = "clear"; lastObstacleName = "";

}
function stopCamera() {
  if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }

}
