<script>
const video=document.getElementById('webcam');
const statusEl=document.getElementById('status');
const langSel=document.getElementById('voiceLanguage');
let stream=null, isLive=false, detector=null, audioCtx=null, lastSpoken="", lastSpeakTime=0;

// Multilingual UI Labels Mapping
const UI_TEXT = {
  "ur-PK": { title: "سمارٹ کین", sub: "آپ کی آنکھیں - تخلیق کردہ: حمیرا سردار", lblLang: "زبان منتخب کریں", lblDest: "منزل (مقام)", btnMap: "گوگل میپس کھولیں", btnStart: "اسٹارٹ - سینسر آن", btnNarrate: "بتائیں - آس پاس کیا ہے؟", btnStop: "بند کریں", revTitle: "واٹس ایپ پر اپنے تاثرات شیئر کریں", revBtn: "واٹس ایپ پر رابطہ کریں" },
  "en-US": { title: "SMART CANE", sub: "Your Eyes Smart Cane Created By Humaira Sardar", lblLang: "SELECT LANGUAGE", lblDest: "DESTINATION", btnMap: "OPEN MAPS", btnStart: "START - SENSOR ON", btnNarrate: "TELL ME - WHAT'S AROUND?", btnStop: "STOP", revTitle: "Share Your Reviews On WhatsApp", revBtn: "Contact On WhatsApp" },
  "hi-IN": { title: "स्मार्ट केन", sub: "आपकी आंखें स्मार्ट केन - हुमैरा सरदार द्वारा निर्मित", lblLang: "भाषा चुनें", lblDest: "गंतव्य", btnMap: "मैप्स खोलें", btnStart: "शुरू करें - सेंसर ऑन", btnNarrate: "बताएं - आसपास क्या है?", btnStop: "बंद करें", revTitle: "व्हाट्सएप पर अपनी समीक्षा साझा करें", revBtn: "व्हाट्सएप पर संपर्क करें" },
  "ar-SA": { title: "العصا الذكية", sub: "عصا الذكية الخاصة بك - إعداد حميرة سردار", lblLang: "اختر اللغة", lblDest: "وجهة السفر", btnMap: "فتح الخرائط", btnStart: "ابدأ - المستشعر يعمل", btnNarrate: "أخبرني - ما حولك؟", btnStop: "إيقاف", revTitle: "شاركة تقييمك على واتساب", revBtn: "تواصل عبر واتساب" }
};

function updateUI() {
  const l = langSel.value;
  const t = UI_TEXT[l] || UI_TEXT["en-US"];
  document.getElementById('uiTitle').innerText = t.title;
  document.getElementById('uiSub').innerText = t.sub;
  document.getElementById('lblLang').innerText = t.lblLang;
  document.getElementById('lblDest').innerText = t.lblDest;
  document.getElementById('openMapsBtn').innerText = t.btnMap;
  document.getElementById('startBtn').innerText = t.btnStart;
  document.getElementById('narrateBtn').innerText = t.btnNarrate;
  document.getElementById('stopBtn').innerText = t.btnStop;
}
langSel.addEventListener('change', updateUI);

const ALL_WORDS = {
  "chair":"kursi", "dining table":"table", "table":"table", "bed":"bed", "couch":"sofa", "sofa":"sofa", "door":"darwaza", "window":"khidki", "toilet":"toilet", "bench":"bench", "book":"kitab", "laptop":"laptop", "cell phone":"mobile", "bottle":"botal", "cup":"glass", "bowl":"katora", "spoon":"chamach", "clock":"ghari", "mirror":"sheesha", "lamp":"lamp", "fan":"pankha", "refrigerator":"fridge", "oven":"oven", "sink":"sink", "bathtub":"bathtub", "pillow":"takiya", "blanket":"kambal",
  "shoe":"joota", "sandal":"chappal", "backpack":"bag", "handbag":"bag", "suitcase":"suitcase", "umbrella":"chhatri", "hat":"topi", "glasses":"chashma", "tie":"tie",
  "person":"insan", "dog":"kutta", "cat":"billi", "bird":"parinda", "cow":"gaaye", "buffalo":"bhains", "goat":"bakri", "sheep":"bher", "horse":"ghora", "donkey":"gadha", "camel":"oonth", "monkey":"bandar", "chicken":"murghi", "duck":"battakh", "pig":"suar", "mouse":"chooha", "snake":"saanp", "elephant":"haathi", "bear":"reech", "zebra":"zebra", "giraffe":"zirafa",
  "bicycle":"cycle", "motorcycle":"bike", "car":"gari", "bus":"bus", "truck":"truck", "traffic light":"signal", "fire hydrant":"hydrant", "stop sign":"stop board", "parking meter":"parking meter",
  "water":"paani", "mud":"keechad", "drain":"naali", "brick":"eent", "stone":"patthar", "hole":"garha", "step":"seedhi ka step", "stairs":"seerhiyan", "broken road":"tooti hui sarak", "sand":"rait", "gravel":"bajri", "pole":"khamba", "wall":"deewar", "road":"sarak", "puddle":"paani ka jama hua hissa",
  "banana":"kela", "apple":"seb", "orange":"santra", "pizza":"pizza", "cake":"cake", "sandwich":"sandwich", "broccoli":"broccoli", "carrot":"gajar", "hot dog":"hot dog", "donut":"donut",
  "kite":"patang", "ball":"ball", "skateboard":"skateboard", "surfboard":"surfboard", "tennis racket":"racket", "baseball bat":"bat", "frisbee":"frisbee", "skis":"skis", "snowboard":"snowboard",
  "unknown":"koi anjaan rukawat"
};

const TRANSLATE = {
  "ur-PK": {left:"بائیں طرف", center:"درمیان میں", right:"دائیں طرف", front:"سامنے", clear:"راستہ صاف ہے", stop:"رک جائیں", close:"بہت قریب ہے", far:"دور ہے"},
  "hi-IN": {left:"बाईं ओर", center:"बीच में", right:"दाईं ओर", front:"सामने", clear:"रास्ता साफ है", stop:"रुके", close:"बहुत पास है", far:"दूर है"},
  "en-US": {left:"on the left side", center:"in the center", right:"on the right side", front:"in front", clear:"path is clear", stop:"stop", close:"very close", far:"far"},
  "ar-SA": {left:"على اليسار", center:"في المنتصف", right:"على اليمين", front:"أمامك", clear:"الطريق صافٍ", stop:"قِف", close:"قريب جداً", far:"بعيد"}
};

function T(key){
  const l=langSel.value;
  if(TRANSLATE[l] && TRANSLATE[l][key]) return TRANSLATE[l][key];
  if(TRANSLATE['en-US'][key]) return TRANSLATE['en-US'][key];
  return key;
}

function speakText(t){
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang=langSel.value; u.rate=0.95;
  window.speechSynthesis.speak(u);
}

function playTone(f){
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=f; o.type='sine';
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.4);
    o.start(); o.stop(audioCtx.currentTime+0.4);
  }catch(e){}
}

function vibrateLevel(level){
  if(!navigator.vibrate) return;
  if(level===3) navigator.vibrate([400,100,400,100,400]);
  else if(level===2) navigator.vibrate([200,100,200]);
  else if(level===1) navigator.vibrate([100]);
}

async function ensureCamera(){
  if(stream && video.srcObject) return true;
  try{ 
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}); 
    video.srcObject=stream; 
    await video.play(); 
    return true; 
  } catch(e){ 
    try{ 
      stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); 
      video.srcObject=stream; 
      await video.play(); 
      return true; 
    } catch(e2){ 
      speakText('Camera ki ijazat dein'); 
      return false; 
    } 
  }
}

async function loadStrongModel(){
  statusEl.innerText="STATUS: LOADING STRONG MODEL...";
  const vision=await window.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  detector=await window.ObjectDetector.createFromOptions(vision,{
    baseOptions:{ modelAssetPath:"https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float32/1/efficientdet_lite2.tflite", delegate:"GPU" },
    scoreThreshold:0.25, runningMode:"VIDEO", maxResults:15
  });
}

async function detectNow(isNarrate=false){
  if(!isLive || !detector || !video.videoWidth || video.paused || video.ended) return;
  const now=Date.now();
  const results=detector.detectForVideo(video, now);
  let dets=(results.detections||[]).filter(d=>d.categories[0].score>0.25);
  
  const canvas=document.createElement('canvas'); canvas.width=60; canvas.height=45;
  const ctx=canvas.getContext('2d'); ctx.drawImage(video,0,0,60,45);
  const imgData=ctx.getImageData(0,0,60,45).data;
  let bottomBlue=0, bottomBrown=0, bottomDark=0;
  for(let y=30;y<45;y++){ 
    for(let x=0;x<60;x++){ 
      let i=(y*60+x)*4; 
      let r=imgData[i], g=imgData[i+1], b=imgData[i+2]; 
      if(b>r+20 && b>g+10) bottomBlue++; 
      if(r>80 && r>g+20 && g<100) bottomBrown++; 
      if(r<40 && g<40 && b<40) bottomDark++; 
    } 
  }
  let roadHazard=null;
  if(bottomBlue>250) roadHazard="paani";
  else if(bottomBrown>250) roadHazard="keechad";
  else if(bottomDark>350) roadHazard="garha ya naali";

  let leftItems=[], centerItems=[], rightItems=[];
  dets.forEach(det=>{
    const nameEn=det.categories[0].categoryName.toLowerCase();
    const name=ALL_WORDS[nameEn] || nameEn;
    const box=det.boundingBox;
    const cx=box.originX + box.width/2;
    const vw=video.videoWidth;
    if(cx < vw*0.33) leftItems.push(name);
    else if(cx > vw*0.66) rightItems.push(name);
    else centerItems.push(name);
  });
  if(roadHazard) centerItems.push(roadHazard);

  let speakMsg="", level=0;
  if(isNarrate || now-lastSpeakTime>4000){
    if(leftItems.length===0 && centerItems.length===0 && rightItems.length===0){
      speakMsg=`${T('clear')}, ${T('front')} kuch nahi hai.`;
      level=0;
    } else {
      let parts=[];
      if(leftItems.length>0) parts.push(`${T('left')} ${leftItems.join(", ")} hai`);
      if(centerItems.length>0) parts.push(`${T('center')} ${centerItems.join(", ")} hai`);
      if(rightItems.length>0) parts.push(`${T('right')} ${rightItems.join(", ")} hai`);
      
      if(centerItems.length>0){
        let safe = leftItems.length===0 ? T('left') : T('right');
        speakMsg=`${T('stop')}, ${parts.join(", ")}. ${safe} ${T('clear')} hai, udhar ho jayen.`;
        level=3;
      } else {
        speakMsg=`${parts.join(", ")}. ${T('front')} ${T('clear')} hai.`;
        level=1;
      }
      if(roadHazard){
        speakMsg=`${T('stop')}, ${T('center')} ${roadHazard} hai, paer bachakar chalen.`;
        level=3;
      }
    }
    if(speakMsg && (speakMsg!==lastSpoken || isNarrate || now-lastSpeakTime>4000)){
      lastSpoken=speakMsg; lastSpeakTime=now;
      if(level>0){ playTone(880); vibrateLevel(level); } else { playTone(600); }
      speakText(speakMsg);
    }
  }
}

document.getElementById('startBtn').addEventListener('click', async ()=>{
  statusEl.innerText="STATUS: LOADING...";
  speakText('Strong model load ho raha hai.');
  if(!await ensureCamera()) return;
  try{ await loadStrongModel(); } catch(e){ speakText('Internet on karein.'); statusEl.innerText="STATUS: ERROR"; return; }
  isLive=true;
  statusEl.innerText="STATUS: LIVE - ALL SENSORS ON";
  document.getElementById('startBtn').style.display="none";
  document.getElementById('stopBtn').style.display="block";
  speakText('Smart Cane on ho gaya hai, ab main har cheez detect kar rahi hoon.');
  
  // Continuous detection loop using requestAnimationFrame / intervals
  setInterval(()=>{
    if(isLive) detectNow(false);
  }, 2500);
});

document.getElementById('narrateBtn').addEventListener('click', ()=>{ 
  if(!isLive){ speakText('Pehle START dabayen.'); return; } 
  speakText('Rukiye, aas paas dekh kar batati hoon.'); 
  setTimeout(()=>detectNow(true),600); 
});

document.getElementById('stopBtn').addEventListener('click', ()=>{
  isLive=false; 
  if(stream) stream.getTracks().forEach(t=>t.stop()); 
  stream=null; 
  video.srcObject=null; 
  window.speechSynthesis.cancel(); 
  statusEl.innerText="STATUS: OFF";
  document.getElementById('startBtn').style.display="block"; 
  document.getElementById('stopBtn').style.display="none";
});

document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q=document.getElementById('destinationInput').value.trim();
  if(!q){ speakText('Pehle upar likhen kahan jana hai.'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
