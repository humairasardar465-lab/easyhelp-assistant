<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart King Assistant</title>
<style>
*{box-sizing:border-box}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0a0f1e;color:#fff;margin:0;padding:16px}
.top{max-width:620px;margin:auto;background:#111827;padding:22px;border-radius:16px;text-align:left}
h2{text-align:center;color:#00ffcc;margin:0;font-size:24px}
.creator{text-align:center;font-size:12px;color:#94a3b8;margin:6px 0 16px}
label{display:block;color:#00ffcc;font-size:13px;font-weight:700;margin:14px 0 6px;text-transform:uppercase}
select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #374151;background:#1f2937;color:#fff;font-size:15px}
video{width:100%;height:280px;border-radius:12px;background:#000;object-fit:cover;margin-top:12px}
button{border:none;padding:13px;font-size:15px;border-radius:10px;cursor:pointer;margin-top:10px;font-weight:700;width:100%}
.btn-main{background:#00ffcc;color:#000}
.btn-map{background:#0284c7;color:#fff}
.btn-voice{background:#d97706;color:#fff}
.btn-stop{background:#ef4444;color:#fff}
#output{margin-top:14px;padding:12px;background:#1f2937;border-radius:10px;min-height:48px;font-size:15px;text-align:right}
.status{text-align:center;margin:10px 0;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="top">
<h2>👑 SMART KING ASSISTANT</h2>
<div class="creator">Created by Humaira Sardar | EasyHelp Smart Cane & GPS</div>
<div class="status"><span id="liveStatus">OFF</span></div>

<label>Select Language</label>
<select id="voiceLanguage">
<option value="ur-PK" selected>Urdu - اردو</option>
<option value="en-US">English</option>
<option value="ar-SA">Arabic - العربية</option>
<option value="hi-IN">Hindi - हिंदी</option>
<option value="pa-IN">Punjabi - ਪੰਜਾਬੀ</option>
</select>

<label>Destination Search</label>
<input type="text" id="destinationInput" placeholder="Enter destination...">
<button id="openMapsBtn" class="btn-map">Open Maps</button>

<hr style="border:0;border-top:1px solid #374151;margin:18px 0">

<label>Live Camera</label>
<button id="startBtn" class="btn-main">Start Live Mode</button>
<button id="voiceBtn" class="btn-voice">Voice Command</button>
<button id="stopBtn" class="btn-stop" style="display:none;">Stop Live</button>

<video id="webcam" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>
<div id="output"></div>
</div>

<script>
const video=document.getElementById('webcam');
const canvas=document.getElementById('canvas');
const output=document.getElementById('output');
const voiceLanguageSelect=document.getElementById('voiceLanguage');
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
const liveStatus=document.getElementById('liveStatus');
let autoTimer=null, stream=null, isLive=false, isPaused=false, isThinking=false;

const API_KEY = "AIzaSyDI5btsG8Wu77sAj8gI9Ug8E_9Lr_FvN5A";

function getLangName(code){
  if(code==='ur-PK') return 'Urdu';
  if(code==='en-US') return 'English';
  if(code==='ar-SA') return 'Arabic';
  if(code==='hi-IN') return 'Hindi';
  if(code==='pa-IN') return 'Punjabi';
  return 'Urdu';
}

function speakText(text){
  // اگر پہلے سے بول رہا ہے تو اس کو روک کر نیا بولے گا، بار بار نہیں بولے گا
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=voiceLanguageSelect.value;
  u.rate=0.95;
  window.speechSynthesis.speak(u);
  output.innerText=text;
}

// کیمرہ آن کرنے کا ایک ہی طریقہ - اب کوئی جھنڈا نہیں
async function ensureCameraOn(){
  if(stream && video.srcObject) return true;
  try{
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
    catch(e){ stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false}); }
    video.srcObject=stream;
    return true;
  }catch(e){
    return false;
  }
}

async function analyzeCamera(){
  if(!isLive || isPaused || isThinking) return;
  // اب یہ جھنڈا نہیں دیکھے گا، سیدھا کیمرہ دیکھے گا
  const camOk = await ensureCameraOn();
  if(!camOk){
    speakText('براہ کرم کیمرہ کی اجازت دیں۔');
    return;
  }
  isThinking=true;
  canvas.width=video.videoWidth||640;
  canvas.height=video.videoHeight||480;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  const base64Image=canvas.toDataURL('image/jpeg',0.5).split(',')[1];
  const langCode=voiceLanguageSelect.value;
  const langName=getLangName(langCode);

  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${API_KEY}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[
        {text:`You are Smart King Assistant. Reply ONLY in ${langName}. This is LIVE camera for blind person. Tell in 1 short line what is in front. Describe ANY object - person, bike, car, wall, stairs, dog, hole, table, tree, shop, road. If obstacle close say STOP. If clear say CLEAR.`},
        {inline_data:{mime_type:"image/jpeg",data:base64Image}}
      ]}]})
    });
    const data=await res.json();
    if(data.candidates && data.candidates[0].content){
      speakText(data.candidates[0].content.parts[0].text);
    }
  }catch(e){ console.log(e); }
  isThinking=false;
}

async function startAutoLive(){
  if(isLive) return;
  const camOk = await ensureCameraOn();
  if(!camOk){ speakText('براہ کرم کیمرہ کی اجازت دیں۔'); return; }
  isLive=true; isPaused=false;
  liveStatus.innerText="LIVE - 1 SEC MODE";
  startBtn.style.display="none"; stopBtn.style.display="block";
  const langName=getLangName(voiceLanguageSelect.value);
  if(langName==='Urdu') speakText('میں سمارٹ کنگ اسسٹنٹ ہوں، لائیو آن ہو گیا ہے، اب میں کیمرے سے دیکھ کر بتاؤں گی۔');
  else if(langName==='Hindi') speakText('Main Smart King Assistant hoon, live on ho gaya hai.');
  else if(langName==='Arabic') speakText('أنا مساعد سمارٹ کنگ، تم تشغيل الوضع المباشر.');
  else if(langName==='English') speakText('I am Smart King Assistant, live is on.');
  else speakText('Main Smart King Assistant haan, live on ho gaya hai.');
  autoTimer=setInterval(analyzeCamera, 3000);
  setTimeout(analyzeCamera, 800);
}

function stopLive(){
  isLive=false; if(autoTimer) clearInterval(autoTimer);
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream=null; video.srcObject=null;
  window.speechSynthesis.cancel();
  liveStatus.innerText="OFF";
  startBtn.style.display="block"; stopBtn.style.display="none";
  output.innerText="";
}
startBtn.addEventListener('click', startAutoLive);
stopBtn.addEventListener('click', stopLive);

document.getElementById('voiceBtn').addEventListener('click', ()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ speakText('Chrome use karein'); return; }
  const rec=new SR(); rec.lang=voiceLanguageSelect.value;
  rec.onresult=async (e)=>{
    const q=e.results[0][0].transcript;
    const lower=q.toLowerCase();
    output.innerText='آپ نے کہا: '+q;
    const langName=getLangName(voiceLanguageSelect.value);

    if(lower.includes('نام') || lower.includes('name') || lower.includes('naam') || lower.includes('اسم') || lower.includes('नाम')){
      if(langName==='Urdu') speakText('میرا نام سمارٹ کنگ اسسٹنٹ ہے۔');
      else if(langName==='Hindi') speakText('Mera naam Smart King Assistant hai.');
      else if(langName==='Arabic') speakText('اسمي مساعد سمارٹ کنگ.');
      else if(langName==='English') speakText('My name is Smart King Assistant.');
      else speakText('Mera naam Smart King Assistant hai.');
      return;
    }
    if(lower.includes('رک') || lower.includes('stop') || lower.includes('ruk')){
      isPaused=true;
      speakText(langName==='Urdu' ? 'ٹھیک ہے، میں رک گئی ہوں۔' : 'Okay, I stopped.');
      return;
    }
    if(lower.includes('چلو') || lower.includes('start') || lower.includes('chalo')){
      isPaused=false;
      speakText(langName==='Urdu' ? 'ٹھیک ہے، پھر چلتے ہیں۔' : 'Okay, lets go.');
      return;
    }
    // سامنے کیا ہے - اب یہ کیمرہ آن ہے یا نہیں، یہ نہیں پوچھے گا، سیدھا کیمرہ آن کر کے دیکھے گا
    if(lower.includes('سامنے') || lower.includes('کیا ہے') || lower.includes('kya') || lower.includes('what') || lower.includes('samne')){
      // اگر Live بند ہے تو اس کو آن کر دو
      if(!isLive){
        isLive=true;
        liveStatus.innerText="LIVE";
        startBtn.style.display="none"; stopBtn.style.display="block";
      }
      isPaused=false;
      speakText(langName==='Urdu' ? 'رکیں، میں کیمرے سے دیکھ کر بتاتی ہوں۔' : 'Wait, I am checking camera.');
      setTimeout(()=>{ analyzeCamera(); }, 600);
      return;
    }
    speakText(langName==='Urdu' ? 'میں نے سن لیا، آپ چلتی رہیں، میں آپ کے ساتھ ہوں۔' : 'I heard you.');
  };
  rec.start();
  speakText(getLangName(voiceLanguageSelect.value)==='Urdu' ? 'جی بولیں، میں سن رہی ہوں۔' : 'Yes, I am listening.');
});

document.getElementById('openMapsBtn').addEventListener('click', ()=>{
  const q=document.getElementById('destinationInput').value.trim();
  if(!q){ speakText('Please enter destination first.'); return; }
  window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`,'_blank');
});
</script>
</body>
</html>
