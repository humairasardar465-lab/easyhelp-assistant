<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <title>Your Eyes, Smart Cane</title>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 16px; background: #0a0f1e; color: #fff; font-family: Arial, sans-serif; }
    main { max-width: 620px; margin: auto; padding: 22px; border-radius: 16px; background: #111827; box-shadow: 0 4px 20px rgba(0,0,0,.45); }
    h1, h2 { margin: 0; color: #00ffcc; text-align: center; }
    h1 { font-size: 24px; }
    h2 { font-size: 22px; }
    label { display: block; margin: 14px 0 6px; color: #00ffcc; font-size: 14px; font-weight: 700; }
    input, select { width: 100%; padding: 12px; border: 1px solid #374151; border-radius: 10px; background: #1f2937; color: #fff; font-size: 16px; }
    #languageSearch { margin-top: 14px; }
    video { display: block; width: 100%; height: 280px; margin: 14px 0 10px; border: 3px solid #00ffcc; border-radius: 12px; background: #000; object-fit: cover; }
    button { width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    .primary { background: #00ffcc; color: #000; }
    .stop { background: #ef4444; color: #fff; }
    .secondary { background: #374151; color: #fff; }
    .gold { background: #ca8a04; color: #fff; }
    #status, #locationStatus { min-height: 28px; margin: 12px 0; font-size: 16px; font-weight: 700; line-height: 1.45; text-align: center; overflow-wrap: anywhere; }
    #status { color: #38bdf8; }
    #locationStatus { color: #cbd5e1; font-size: 13px; }
    .view { display: none; }
    .view.active { display: block; }
    .hidden { display: none !important; }
    .rating-option { margin-top: 8px; padding: 12px; border: 1px solid #374151; border-radius: 8px; background: #1f2937; }
    .rating-option button { margin: 0; background: transparent; color: #00ffcc; text-align: left; }
  </style>

  <script src="./languages.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js"></script>
</head>

<body>
<main>
  <section id="homeView" class="view active">
    <h1>Your Eyes, Smart Cane</h1>
    <input id="languageSearch" type="search" aria-label="Search languages">
    <select id="languageSelect" aria-label="Select language"></select>

    <video id="camera" autoplay playsinline muted aria-label="Camera preview"></video>
    <div id="status" aria-live="polite"></div>
    <div id="locationStatus" aria-live="polite"></div>

    <button id="startBtn" class="primary">Start Live AI</button>
    <button id="stopBtn" class="stop hidden">Stop</button>
    <button id="settingsBtn" class="secondary">Settings</button>
  </section>

  <section id="settingsView" class="view">
    <h2>Settings</h2>
    <button id="batteryBtn" class="gold">Battery Saver: OFF</button>

    <label for="voiceSelect">TTS</label>
    <select id="voiceSelect" aria-label="Select text-to-speech voice"></select>
    <button id="testVoiceBtn" class="secondary">Test TTS</button>

    <button id="feedbackBtn" class="secondary">Feedback</button>
    <div id="ratings" class="hidden">
      <div class="rating-option"><button data-rating="1">1 — Major improvement needed</button></div>
      <div class="rating-option"><button data-rating="2">2 — Considerable improvement needed</button></div>
      <div class="rating-option"><button data-rating="3">3 — Some improvement needed</button></div>
      <div class="rating-option"><button data-rating="4">4 — A little improvement needed</button></div>
      <div class="rating-option"><button data-rating="5">5 — No improvement needed</button></div>
    </div>

    <button id="aboutBtn" class="secondary">About</button>
    <button id="backHomeBtn" class="secondary">Back</button>
  </section>

  <section id="aboutView" class="view">
    <h2>About</h2>
    <p>I am confident, capable, and moving forward with courage.</p>
    <p>Created by Humaira Sardar, Okara, Pakistan</p>
    <button id="backAboutBtn" class="secondary">Back</button>
  </section>
</main>

<script>
(() => {
  "use strict";

  const MODEL_URL = "./yolov8n.tflite";
  const INPUT_SIZE = 640;
  const CONFIDENCE_THRESHOLD = 0.5;
  const IOU_THRESHOLD = 0.45;
  const NORMAL_INTERVAL_MS = 120;
  const SAVER_INTERVAL_MS = 450;
  const REPEAT_INTERVAL_MS = 3000;

  // This image-size heuristic is only an approximate estimate, not a measured range.
  const DISTANCE_FACTOR_METERS = 0.35;
  const MAX_ANNOUNCED_DISTANCE_METERS = 4;
  const CENTER_LEFT_BOUNDARY = 0.35;
  const CENTER_RIGHT_BOUNDARY = 0.65;

  const COCO_LABELS = [
    "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat", "traffic light",
    "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat", "dog", "horse", "sheep", "cow",
    "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella", "handbag", "tie", "suitcase", "frisbee",
    "skis", "snowboard", "sports ball", "kite", "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket", "bottle",
    "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich", "orange",
    "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch", "potted plant", "bed",
    "dining table", "toilet", "tv", "laptop", "mouse", "remote", "keyboard", "cell phone", "microwave", "oven",
    "toaster", "sink", "refrigerator", "book", "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"
  ];

  const ENGLISH_SPEECH = {
    active: "Live detection is active.",
    starting: "Starting live detection.",
    stopped: "Detection stopped.",
    cameraError: "Camera unavailable. Allow camera access and use HTTPS or localhost.",
    modelError: "The TFLite model could not be loaded or its output format was not recognized.",
    noCenter: "No close obstacle detected in the center camera view.",
    obstacle: "Stop. About {distance} meters ahead, {object} is {direction}.",
    side: "{direction}: {object}, about {distance} meters away.",
    dark: "The camera image is very dark.",
    locationWaiting: "Location unavailable.",
    locationError: "Location permission or service unavailable.",
    location: "Location: {lat}, {lon}",
    testVoice: "Text to speech is working."
  };

  const URDU_LABELS = {
    person: "شخص", bicycle: "سائیکل", car: "گاڑی", motorcycle: "موٹر سائیکل",
    airplane: "طیارہ", bus: "بس", train: "ٹرین", truck: "ٹرک", boat: "کشتی",
    "traffic light": "ٹریفک لائٹ", "fire hydrant": "فائر ہائیڈرنٹ",
    "stop sign": "اسٹاپ سائن", "parking meter": "پارکنگ میٹر", bench: "بینچ",
    bird: "پرندہ", cat: "بلی", dog: "کتا", horse: "گھوڑا", sheep: "بھیڑ",
    cow: "گائے", elephant: "ہاتھی", bear: "ریچھ", zebra: "زیبرا",
    giraffe: "زرافہ", backpack: "بیگ", umbrella: "چھتری", handbag: "ہینڈ بیگ",
    tie: "ٹائی", suitcase: "سوٹ کیس", frisbee: "فریسبی", skis: "اسکیز",
    snowboard: "اسنو بورڈ", "sports ball": "کھیل کی گیند", kite: "پتنگ",
    "baseball bat": "بیس بال بیٹ", "baseball glove": "بیس بال دستانہ",
    skateboard: "اسکیٹ بورڈ", surfboard: "سرف بورڈ", "tennis racket": "ٹینس ریکٹ",
    bottle: "بوتل", "wine glass": "وائن گلاس", cup: "کپ", fork: "کانٹا",
    knife: "چاقو", spoon: "چمچ", bowl: "پیالہ", banana: "کیلا", apple: "سیب",
    sandwich: "سینڈوچ", orange: "سنگترہ", broccoli: "بروکلی", carrot: "گاجر",
    "hot dog": "ہاٹ ڈاگ", pizza: "پیزا", donut: "ڈونٹ", cake: "کیک",
    chair: "کرسی", couch: "صوفہ", "potted plant": "گملے کا پودا", bed: "بستر",
    "dining table": "کھانے کی میز", toilet: "ٹوائلٹ", tv: "ٹی وی",
    laptop: "لیپ ٹاپ", mouse: "ماؤس", remote: "ریموٹ", keyboard: "کی بورڈ",
    "cell phone": "موبائل فون", microwave: "مائیکروویو", oven: "اوون",
    toaster: "ٹوسٹر", sink: "سنک", refrigerator: "ریفریجریٹر", book: "کتاب",
    clock: "گھڑی", vase: "گلدان", scissors: "قینچی", "teddy bear": "ٹیڈی بیئر",
    "hair drier": "ہیئر ڈرائر", toothbrush: "دانتوں کا برش"
  };

  const $ = (id) => document.getElementById(id);
  const video = $("camera");
  const statusEl = $("status");
  const locationEl = $("locationStatus");
  const languageSelect = $("languageSelect");
  const searchInput = $("languageSearch");
  const voiceSelect = $("voiceSelect");

  const localeCodes = (window.SMART_CANE_LANGUAGES?.locales || [])
    .map((item) => item.code)
    .filter(Boolean);

  if (!localeCodes.includes("en-US")) localeCodes.unshift("en-US");

  let languageCode = readStorage("smartCaneLanguage") || "en-US";
  if (!localeCodes.includes(languageCode)) languageCode = "en-US";

  let model = null;
  let stream = null;
  let running = false;
  let starting = false;
  let sessionId = 0;
  let animationId = 0;
  let inFlight = false;
  let batterySaver = readStorage("smartCaneBatterySaver") === "true";
  let voices = [];
  let selectedVoiceURI = readStorage("smartCaneVoiceURI") || "";
  let manualVoiceChoice = false;
  let lastSceneKey = "";
  let lastSceneSpeechAt = 0;
  let lastInferenceAt = 0;
  let lastTimestamp = 0;
  let lastDarkSpeechAt = 0;
  let noDetectionSince = 0;
  let locationWatchId = null;

  function readStorage(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }

  function writeStorage(key, value) {
    try { localStorage.setItem(key, value); } catch {}
  }

  function say(key, values = {}, display = true) {
    let message = ENGLISH_SPEECH[key] || key;
    for (const [name, value] of Object.entries(values)) {
      message = message.replaceAll(`{${name}}`, String(value));
    }

    if (display) statusEl.textContent = message;
    if (!("speechSynthesis" in window)) return;

    try {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(message);
      utterance.lang = languageCode;
      utterance.rate = 1;

      const voice = voices.find((item) => item.voiceURI === selectedVoiceURI);
      if (voice) utterance.voice = voice;

      speechSynthesis.speak(utterance);
    } catch (error) {
      console.warn("Speech synthesis error:", error);
    }
  }

  function showView(id) {
    document.querySelectorAll(".view").forEach((view) => {
      view.classList.toggle("active", view.id === id);
    });
  }

  function regionLabel(code) {
    try {
      const parts = code.split("-");
      const region = parts.find((part) => part.length === 2 || /^\d{3}$/.test(part));
      const language = new Intl.DisplayNames([code], { type: "language" }).of(parts[0]);
      const regionName = region
        ? new Intl.DisplayNames([code], { type: "region" }).of(region)
        : "";
      return `${language || code}${regionName ? " " + regionName : ""}`;
    } catch {
      return code;
    }
  }

  function renderLanguages(filter = "") {
    const query = filter.trim().toLocaleLowerCase();
    const matches = localeCodes.filter((code) => {
      const label = regionLabel(code).toLocaleLowerCase();
      return !query || label.includes(query) || code.toLowerCase().includes(query);
    });

    languageSelect.innerHTML = "";
    for (const code of matches) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = regionLabel(code);
      languageSelect.append(option);
    }

    if (matches.includes(languageCode)) languageSelect.value = languageCode;
  }

  function updateButtons() {
    $("startBtn").classList.toggle("hidden", running || starting);
    $("startBtn").disabled = running || starting;
    $("stopBtn").classList.toggle("hidden", !running && !starting);
    $("stopBtn").disabled = false;
    $("batteryBtn").textContent = `Battery Saver: ${batterySaver ? "ON" : "OFF"}`;
  }

  function isGoogleVoice(voice) {
    return /google/i.test(`${voice.name} ${voice.voiceURI}`);
  }

  function voiceMatchesLanguage(voice) {
    return voice.lang.toLowerCase().split("-")[0] === languageCode.toLowerCase().split("-")[0];
  }

  function populateVoices() {
    if (!("speechSynthesis" in window)) return;

    voices = speechSynthesis.getVoices() || [];
    voiceSelect.innerHTML = "";

    for (const voice of voices) {
      const option = document.createElement("option");
      option.value = voice.voiceURI;
      option.textContent = `${isGoogleVoice(voice) ? "Google · " : ""}${voice.name} (${voice.lang})`;
      voiceSelect.append(option);
    }

    if (!voices.length) return;

    let chosen = voices.find((voice) => voice.voiceURI === selectedVoiceURI);
    if (!manualVoiceChoice || !chosen) {
      chosen =
        voices.find((voice) => isGoogleVoice(voice) && voiceMatchesLanguage(voice)) ||
        voices.find(isGoogleVoice) ||
        voices.find(voiceMatchesLanguage) ||
        voices[0];

      selectedVoiceURI = chosen.voiceURI;
      writeStorage("smartCaneVoiceURI", selectedVoiceURI);
    }

    voiceSelect.value = selectedVoiceURI;
  }

  async function loadModel() {
    if (model) return model;

    if (!window.tf || !window.tflite ||
        typeof window.tflite.loadTFLiteModel !== "function") {
      throw new Error("TFLite runtime unavailable.");
    }

    await tf.ready();

    if (typeof tflite.setWasmPath === "function") {
      tflite.setWasmPath(
        "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/"
      );
    }

    model = await tflite.loadTFLiteModel("./yolov8n.tflite");
    return model;
  }

  function startLocation() {
    if (!navigator.geolocation) {
      locationEl.textContent = ENGLISH_SPEECH.locationError;
      return;
    }

    locationEl.textContent = ENGLISH_SPEECH.locationWaiting;
    locationWatchId = navigator.geolocation.watchPosition(
      (position) => {
        locationEl.textContent = ENGLISH_SPEECH.location
          .replace("{lat}", position.coords.latitude.toFixed(5))
          .replace("{lon}", position.coords.longitude.toFixed(5));
      },
      () => { locationEl.textContent = ENGLISH_SPEECH.locationError; },
      { enableHighAccuracy: true, maximumAge: 10000, timeout: 15000 }
    );
  }

  function stopLocation() {
    if (locationWatchId !== null && navigator.geolocation) {
      navigator.geolocation.clearWatch(locationWatchId);
      locationWatchId = null;
    }
  }

  function stopCamera() {
    if (stream) {
      stream.getTracks().forEach((track) => track.stop());
      stream = null;
    }
    video.srcObject = null;
  }

  async function start() {
    if (running || starting) return;

    starting = true;
    const thisSession = ++sessionId;
    updateButtons();
    say("starting");

    try {
      if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
        throw new Error("Camera access requires HTTPS or localhost.");
      }

      const cameraPromise = navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 640 },
          height: { ideal: 480 },
          frameRate: { ideal: 30 }
        }
      });

      const [newStream] = await Promise.all([cameraPromise, loadModel()]);

      if (thisSession !== sessionId) {
        newStream.getTracks().forEach((track) => track.stop());
        return;
      }

      stream = newStream;
      video.srcObject = stream;
      await video.play();

      if (thisSession !== sessionId) {
        stopCamera();
        return;
      }

      running = true;
      starting = false;
      lastSceneKey = "";
      lastSceneSpeechAt = 0;
      lastInferenceAt = 0;
      lastTimestamp = 0;
      lastDarkSpeechAt = 0;
      noDetectionSince = 0;
      updateButtons();
      startLocation();
      say("active");
      animationId = requestAnimationFrame(loop);
    } catch (error) {
      console.error(error);
      if (thisSession === sessionId) {
        starting = false;
        running = false;
        stopCamera();
        stopLocation();
        updateButtons();
        say(error?.name === "NotAllowedError" ||
            error?.message?.includes("HTTPS")
          ? "cameraError"
          : "modelError");
      }
    }
  }

  function stop() {
    sessionId++;
    starting = false;
    running = false;
    inFlight = false;
    cancelAnimationFrame(animationId);
    stopCamera();
    stopLocation();
    updateButtons();
    say("stopped");
  }

  function prepareInput() {
    const width = video.videoWidth;
    const height = video.videoHeight;
    const scale = Math.min(INPUT_SIZE / width, INPUT_SIZE / height);
    const scaledWidth = Math.round(width * scale);
    const scaledHeight = Math.round(height * scale);
    const padX = Math.floor((INPUT_SIZE - scaledWidth) / 2);
    const padY = Math.floor((INPUT_SIZE - scaledHeight) / 2);

    const canvas = document.createElement("canvas");
    canvas.width = INPUT_SIZE;
    canvas.height = INPUT_SIZE;
    const context = canvas.getContext("2d", { willReadFrequently: true });

    context.fillStyle = "rgb(114,114,114)";
    context.fillRect(0, 0, INPUT_SIZE, INPUT_SIZE);
    context.drawImage(video, padX, padY, scaledWidth, scaledHeight);

    const rgba = context.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
    const plane = INPUT_SIZE * INPUT_SIZE;
    const chw = new Float32Array(plane * 3);

    for (let i = 0, pixel = 0; i < rgba.length; i += 4, pixel++) {
      chw[pixel] = rgba[i] / 255;
      chw[plane + pixel] = rgba[i + 1] / 255;
      chw[plane * 2 + pixel] = rgba[i + 2] / 255;
    }

    return {
      tensor: tf.tensor(chw, [1, 3, INPUT_SIZE, INPUT_SIZE], "float32"),
      scale, padX, padY, sourceWidth: width, sourceHeight: height
    };
  }

  function outputData(output) {
    const tensor = Array.isArray(output) ? output[0] : output;
    if (!tensor || typeof tensor.dataSync !== "function") {
      throw new Error("Unexpected model output.");
    }
    return { data: tensor.dataSync(), shape: tensor.shape };
  }

  function intersectionOverUnion(a, b) {
    const x1 = Math.max(a.x1, b.x1);
    const y1 = Math.max(a.y1, b.y1);
    const x2 = Math.min(a.x2, b.x2);
    const y2 = Math.min(a.y2, b.y2);
    const intersection = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
    const areaA = (a.x2 - a.x1) * (a.y2 - a.y1);
    const areaB = (b.x2 - b.x1) * (b.y2 - b.y1);
    return intersection / Math.max(1e-8, areaA + areaB - intersection);
  }

  function applyNms(boxes) {
    boxes.sort((a, b) => b.score - a.score);
    const selected = [];

    for (const box of boxes) {
      if (selected.every((item) =>
        item.classId !== box.classId ||
        intersectionOverUnion(item, box) <= IOU_THRESHOLD
      )) {
        selected.push(box);
      }
      if (selected.length >= 50) break;
    }

    return selected;
  }

  function decode(output, transform) {
    const { data, shape } = outputData(output);
    const channelsFirst =
      shape.length === 3 && shape[1] === 84 && shape[2] === 8400;
    const candidatesFirst =
      shape.length === 3 && shape[1] === 8400 && shape[2] === 84;

    if (!channelsFirst && !candidatesFirst) {
      throw new Error(`Unsupported model output shape: ${shape.join("x")}`);
    }

    const read = (channel, candidate) =>
      channelsFirst
        ? Number(data[channel * 8400 + candidate])
        : Number(data[candidate * 84 + channel]);

    const boxes = [];

    for (let i = 0; i < 8400; i++) {
      let classId = -1;
      let confidence = -Infinity;

      for (let c = 0; c < 80; c++) {
        const score = read(c + 4, i);
        if (score > confidence) {
          confidence = score;
          classId = c;
        }
      }

      if (!Number.isFinite(confidence) || confidence < CONFIDENCE_THRESHOLD) continue;

      const cx = read(0, i);
      const cy = read(1, i);
      const width = read(2, i);
      const height = read(3, i);

      if (![cx, cy, width, height].every(Number.isFinite) || width <= 0 || height <= 0) continue;

      const x1Model = cx - width / 2;
      const y1Model = cy - height / 2;
      const x2Model = cx + width / 2;
      const y2Model = cy + height / 2;

      const x1 = Math.max(0, (x1Model - transform.padX) / transform.scale);
      const y1 = Math.max(0, (y1Model - transform.padY) / transform.scale);
      const x2 = Math.min(transform.sourceWidth, (x2Model - transform.padX) / transform.scale);
      const y2 = Math.min(transform.sourceHeight, (y2Model - transform.padY) / transform.scale);

      if (x2 <= x1 || y2 <= y1) continue;
      boxes.push({ x1, y1, x2, y2, score: confidence, classId });
    }

    return applyNms(boxes);
  }

  function estimatedMeters(box) {
    const fraction = (box.y2 - box.y1) / video.videoHeight;
    if (!Number.isFinite(fraction) || fraction <= 0) return null;
    return Math.max(0.5, Math.min(8, DISTANCE_FACTOR_METERS / fraction));
  }

  function zoneFor(box) {
    const x = ((box.x1 + box.x2) / 2) / video.videoWidth;
    if (x < CENTER_LEFT_BOUNDARY) return "left";
    if (x > CENTER_RIGHT_BOUNDARY) return "right";
    return "center";
  }

  function localizedLabel(classId) {
    const label = COCO_LABELS[classId] || "object";
    const translated =
      window.SMART_CANE_TRANSLATIONS?.[languageCode]?.labels?.[label];
    return translated || label;
  }

  function imageIsDark() {
    try {
      const canvas = document.createElement("canvas");
      canvas.width = 24;
      canvas.height = 24;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(video, 0, 0, 24, 24);
      const pixels = context.getImageData(0, 0, 24, 24).data;
      let total = 0;

      for (let i = 0; i < pixels.length; i += 4) {
        total += (pixels[i] + pixels[i + 1] + pixels[i + 2]) / 3;
      }

      return total / (pixels.length / 4) < 22;
    } catch {
      return false;
    }
  }

  function describeScene(boxes, now) {
    const objectsByZone = { left: [], center: [], right: [] };

    for (const box of boxes) {
      const distance = estimatedMeters(box);
      if (distance === null || distance > MAX_ANNOUNCED_DISTANCE_METERS) continue;

      const rounded = Math.round(distance * 2) / 2;
      objectsByZone[zoneFor(box)].push({
        classId: box.classId,
        label: localizedLabel(box.classId),
        distance: rounded,
        score: box.score
      });
    }

    for (const zone of Object.keys(objectsByZone)) {
      objectsByZone[zone].sort((a, b) => b.score - a.score);
    }

    const center = objectsByZone.center[0] || null;
    const left = objectsByZone.left[0] || null;
    const right = objectsByZone.right[0] || null;

    let parts = [];
    if (center) {
      parts.push(
        `Stop. About ${center.distance} meters ahead, ${center.label} is in the center.`
      );
    } else {
      parts.push(ENGLISH_SPEECH.noCenter);
    }

    if (left) {
      parts.push(`Left: ${left.label}, about ${left.distance} meters away.`);
    }
    if (right) {
      parts.push(`Right: ${right.label}, about ${right.distance} meters away.`);
    }

    const signature = [
      center ? `C:${center.classId}:${center.distance}` : "C:none",
      left ? `L:${left.classId}:${left.distance}` : "L:none",
      right ? `R:${right.classId}:${right.distance}` : "R:none"
    ].join("|");

    if (signature !== lastSceneKey) {
      lastSceneKey = signature;
      lastSceneSpeechAt = now;
      const announcement = parts.join(" ");
      statusEl.textContent = announcement;
      speakText(announcement);
    } else if (now - lastSceneSpeechAt >= REPEAT_INTERVAL_MS &&
               (center || left || right)) {
      lastSceneSpeechAt = now;
      const announcement = parts.join(" ");
      statusEl.textContent = announcement;
      speakText(announcement);
    }
  }

  function speakText(message) {
    if (!("speechSynthesis" in window)) return;

    try {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(message);
      utterance.lang = languageCode;
      utterance.rate = 1;
      const voice = voices.find((item) => item.voiceURI === selectedVoiceURI);
      if (voice) utterance.voice = voice;
      speechSynthesis.speak(utterance);
    } catch (error) {
      console.warn("Speech synthesis error:", error);
    }
  }

  async function loop() {
    if (!running) return;

    // Schedule the next frame before checking inFlight so the loop continues.
    animationId = requestAnimationFrame(loop);
    if (inFlight) return;

    if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
        !video.videoWidth || !video.videoHeight) return;

    const now = performance.now();
    const interval = batterySaver ? SAVER_INTERVAL_MS : NORMAL_INTERVAL_MS;
    if (now - lastInferenceAt < interval) return;

    lastInferenceAt = now;
    inFlight = true;
    let inputTensor = null;
    let output = null;

    try {
      if (imageIsDark()) {
        if (now - lastDarkSpeechAt >= 8000) {
          lastDarkSpeechAt = now;
          say("dark");
        }
        noDetectionSince = 0;
        return;
      }

      const prepared = prepareInput();
      inputTensor = prepared.tensor;
      output = model.predict(inputTensor);

      const boxes = decode(output, prepared);
      describeScene(boxes, now);
    } catch (error) {
      console.error("TFLite inference failed:", error);
      statusEl.textContent = ENGLISH_SPEECH.modelError;
    } finally {
      inputTensor?.dispose?.();

      if (Array.isArray(output)) {
        output.forEach((tensor) => tensor?.dispose?.());
      } else {
        output?.dispose?.();
      }

      inFlight = false;
    }
  }

  function prepareInput() {
    const width = video.videoWidth;
    const height = video.videoHeight;
    const scale = Math.min(INPUT_SIZE / width, INPUT_SIZE / height);
    const scaledWidth = Math.round(width * scale);
    const scaledHeight = Math.round(height * scale);
    const padX = Math.floor((INPUT_SIZE - scaledWidth) / 2);
    const padY = Math.floor((INPUT_SIZE - scaledHeight) / 2);

    const canvas = document.createElement("canvas");
    canvas.width = INPUT_SIZE;
    canvas.height = INPUT_SIZE;
    const context = canvas.getContext("2d", { willReadFrequently: true });

    context.fillStyle = "rgb(114,114,114)";
    context.fillRect(0, 0, INPUT_SIZE, INPUT_SIZE);
    context.drawImage(video, padX, padY, scaledWidth, scaledHeight);

    const rgba = context.getImageData(0, 0, INPUT_SIZE, INPUT_SIZE).data;
    const planeSize = INPUT_SIZE * INPUT_SIZE;
    const chw = new Float32Array(planeSize * 3);

    for (let i = 0, pixel = 0; i < rgba.length; i += 4, pixel++) {
      chw[pixel] = rgba[i] / 255;
      chw[planeSize + pixel] = rgba[i + 1] / 255;
      chw[planeSize * 2 + pixel] = rgba[i + 2] / 255;
    }

    return {
      tensor: tf.tensor(chw, [1, 3, INPUT_SIZE, INPUT_SIZE], "float32"),
      scale,
      padX,
      padY,
      sourceWidth: width,
      sourceHeight: height
    };
  }

  $("startBtn").addEventListener("click", start);
  $("stopBtn").addEventListener("click", stop);
  $("settingsBtn").addEventListener("click", () => showView("settingsView"));
  $("backHomeBtn").addEventListener("click", () => showView("homeView"));
  $("aboutBtn").addEventListener("click", () => showView("aboutView"));
  $("backAboutBtn").addEventListener("click", () => showView("settingsView"));

  $("batteryBtn").addEventListener("click", () => {
    batterySaver = !batterySaver;
    writeStorage("smartCaneBatterySaver", String(batterySaver));
    updateButtons();
  });

  $("testVoiceBtn").addEventListener("click", () => say("testVoice"));

  $("feedbackBtn").addEventListener("click", () => {
    $("ratings").classList.toggle("hidden");
  });

  $("ratings").addEventListener("click", (event) => {
    const button = event.target.closest("[data-rating]");
    if (!button) return;

    const rating = Number(button.dataset.rating);
    const descriptions = {
      1: "Major improvement needed",
      2: "Considerable improvement needed",
      3: "Some improvement needed",
      4: "A little improvement needed",
      5: "No improvement needed"
    };

    const subject = encodeURIComponent("Smart Cane Feedback / Review");
    const body = encodeURIComponent(
      `My rating: ${rating}/5 — ${descriptions[rating]}`
    );

    window.location.href =
      `mailto:humairasardar10@gmail.com?subject=${subject}&body=${body}`;
  });

  searchInput.addEventListener("input", () => renderLanguages(searchInput.value));

  languageSelect.addEventListener("change", () => {
    languageCode = languageSelect.value;
    writeStorage("smartCaneLanguage", languageCode);
    populateVoices();
  });

  voiceSelect.addEventListener("change", () => {
    selectedVoiceURI = voiceSelect.value;
    manualVoiceChoice = true;
    writeStorage("smartCaneVoiceURI", selectedVoiceURI);
  });

  renderLanguages();
  languageSelect.value = languageCode;
  updateButtons();

  if ("speechSynthesis" in window) {
    populateVoices();
    speechSynthesis.onvoiceschanged = populateVoices;
  }

  window.addEventListener("pagehide", stop);
})();
</script>
