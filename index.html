<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyHelp Smart Cane & GPS Assistant</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --accent: #38bdf8;
            --bg-gradient: radial-gradient(circle at 50% 10%, #0f172a 0%, #020617 100%);
            --card-bg: rgba(15, 23, 42, 0.94);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --border-radius: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: var(--border-radius);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            padding: 28px;
            margin-bottom: 24px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 20px;
        }

        header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
            font-weight: 700;
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.92rem;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, input, button {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(30, 41, 59, 0.9);
            color: var(--text-main);
            font-size: 1.05rem;
            outline: none;
            transition: all 0.3s ease;
        }

        select:focus, input:focus, button:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.25);
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 12px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-top: 8px;
            color: white;
        }

        .camera-container {
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            margin-top: 12px;
            border: 2px solid rgba(56, 189, 248, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.92);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #38bdf8;
            text-align: center;
            border: 1px solid rgba(56, 189, 248, 0.4);
            backdrop-filter: blur(8px);
            font-weight: 600;
        }

        .map-frame {
            width: 100%;
            height: 280px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 16px;
        }

        footer {
            text-align: center;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: auto;
            padding: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>EasyHelp Smart Cane & GPS</h1>
            <p>Created by Humaira Sardar</p>
        </header>

        <!-- 1. Voice & Language Selection -->
        <div class="control-group">
            <label for="voiceLanguage">Voice & Screen Reader Language</label>
            <select id="voiceLanguage">
                <option value="ur-PK" selected>Urdu (Pakistan - اردو)</option>
                <option value="en-US">English (United States)</option>
                <option value="hi-IN">Hindi (India - हिंदी)</option>
                <option value="ar-SA">Arabic (Saudi Arabia - العربية)</option>
                <option value="pa-IN">Punjabi (ਪੰਜਾਬੀ)</option>
                <option value="es-ES">Spanish (Español)</option>
                <option value="fr-FR">French (Français)</option>
                <option value="de-DE">German (Deutsch)</option>
                <option value="zh-CN">Chinese Simplified (中文)</option>
                <option value="ja-JP">Japanese (日本語)</option>
                <option value="tr-TR">Turkish (Türkçe)</option>
                <option value="fa-IR">Persian (فارسی)</option>
            </select>
        </div>

        <!-- 2. Outdoor Live Map Search (Google Maps Autocomplete & Dropdown) -->
        <div class="control-group">
            <label for="mapSearchInput">Outdoor GPS Location Search (e.g. Lahore, Okara)</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="mapSearchInput" list="locationSuggestions" placeholder="Type city or location (e.g. Lahore)..." value="Okara">
                <button class="btn-secondary" id="searchMapBtn" style="width: 150px; margin-top: 0;">Load Map</button>
            </div>
            <datalist id="locationSuggestions">
                <option value="Lahore, Pakistan">
                <option value="Okara, Pakistan">
                <option value="Islamabad, Pakistan">
                <option value="Karachi, Pakistan">
                <option value="Faisalabad, Pakistan">
                <option value="Multan, Pakistan">
                <option value="Govt Gunj Shakar Special Education Centre Okara">
            </datalist>
        </div>

        <!-- 3. Outdoor GPS Mode / Live Navigation Button -->
        <div class="control-group">
            <button class="btn-secondary" id="startOutdoorGPSBtn">📍 Start Outdoor Live GPS Navigation</button>
        </div>

        <!-- 4. Live Google Maps Integration View -->
        <div class="control-group">
            <label>Live Google Maps Route View (Camera Off Mode)</label>
            <iframe class="map-frame" id="liveMapFrame" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d55134.1!2d73.4406!3d30.8138!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39226b4852e93541%3A0x6b87b7a1e127390!2sOkara%2C%2C%20Pakistan!5e0!3m2!1sen!2s!4v1650000000000"></iframe>
        </div>

        <!-- 5. Indoor / Vision Mode (Rear Camera & AI Live Mode) -->
        <div class="control-group" style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; margin-top: 20px;">
            <label>Indoor / Live Vision Assistant (Rear Camera)</label>
            <button class="btn-secondary" id="toggleCameraBtn" style="background: #0284c7; margin-bottom: 8px;">📷 Turn On Rear Camera</button>
            
            <div class="camera-container" id="cameraWrapper" style="display: none;">
                <video id="webcam" autoplay playsinline muted></video>
                <div class="camera-overlay" id="cameraStatusOverlay">Rear camera active. Ask what is ahead anytime.</div>
            </div>

            <!-- ChatGPT/OpenAI style Live Vision Question Button -->
            <button class="btn-secondary" id="askVisionBtn" style="background: #d97706; margin-top: 10px; display: none;">🗣️ Ask Live AI: What is in front of me?</button>
        </div>
    </div>

    <footer>
        Empowering Independent Mobility, Step by Step.
    </footer>

    <script>
        const searchMapBtn = document.getElementById('searchMapBtn');
        const startOutdoorGPSBtn = document.getElementById('startOutdoorGPSBtn');
        const toggleCameraBtn = document.getElementById('toggleCameraBtn');
        const askVisionBtn = document.getElementById('askVisionBtn');
        const voiceLanguageSelect = document.getElementById('voiceLanguage');
        const mapSearchInput = document.getElementById('mapSearchInput');
        const liveMapFrame = document.getElementById('liveMapFrame');
        const cameraWrapper = document.getElementById('cameraWrapper');
        const webcam = document.getElementById('webcam');
        const cameraStatusOverlay = document.getElementById('cameraStatusOverlay');

        let videoStream = null;
        let isCameraOn = false;

        // Speech Synthesis Helper
        function speak(text, lang = 'ur-PK') {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
            cameraStatusOverlay.innerText = text;
        }

        // 1. Search and Load Google Maps Location
        searchMapBtn.addEventListener('click', () => {
            const query = mapSearchInput.value.trim();
            const lang = voiceLanguageSelect.value;
            if (query) {
                liveMapFrame.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&z=15&output=embed`;
                speak(`${query} کا نقشہ لوڈ کر دیا گیا ہے۔`, lang);
            }
        });

        // 2. Outdoor Live GPS & Step-by-Step Audio Guidance (Camera Off)
        startOutdoorGPSBtn.addEventListener('click', () => {
            const lang = voiceLanguageSelect.value;
            const destination = mapSearchInput.value || "مقام";

            if ("geolocation" in navigator) {
                speak(`آؤٹ ڈور لائیو جی پی ایس نیویگیشن شروع ہو چکی ہے۔ ${destination} کی طرف رہنمائی جاری ہے۔`, lang);
                navigator.geolocation.watchPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    liveMapFrame.src = `https://maps.google.com/maps?q=${lat},${lon}&z=18&output=embed`;
                }, (error) => {
                    console.log("GPS tracking active.");
                }, { enableHighAccuracy: true });
            } else {
                speak("براؤزر میں جی پی ایس سپورٹ دستیاب نہیں ہے۔", lang);
            }
        });

        // 3. Toggle Rear Camera On/Off for Indoor / Vision Mode
        toggleCameraBtn.addEventListener('click', async () => {
            const lang = voiceLanguageSelect.value;
            if (!isCameraOn) {
                try {
                    if (videoStream) {
                        videoStream.getTracks().forEach(track => track.stop());
                    }
                    videoStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: { exact: "environment" } }, 
                        audio: false 
                    });
                    webcam.srcObject = videoStream;
                    cameraWrapper.style.display = "flex";
                    askVisionBtn.style.display = "block";
                    toggleCameraBtn.innerText = "📷 Turn Off Rear Camera";
                    isCameraOn = true;
                    speak("پچھلا کیمرہ آن ہو گیا ہے۔ اب آپ لائیو پوچھ سکتے ہیں کہ سامنے کیا ہے۔", lang);
                } catch (e1) {
                    try {
                        videoStream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: "environment" }, 
                            audio: false 
                        });
                        webcam.srcObject = videoStream;
                        cameraWrapper.style.display = "flex";
                        askVisionBtn.style.display = "block";
                        toggleCameraBtn.innerText = "📷 Turn Off Rear Camera";
                        isCameraOn = true;
                        speak("کیمرہ آن ہو گیا ہے۔", lang);
                    } catch (e2) {
                        speak("براہ کرم کیمرے کی پرمشن (Permission) الاؤ کریں۔", lang);
                    }
                }
            } else {
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }
                cameraWrapper.style.display = "none";
                askVisionBtn.style.display = "none";
                toggleCameraBtn.innerText = "📷 Turn On Rear Camera";
                isCameraOn = false;
                speak("کیمرہ بند کر دیا گیا ہے۔", lang);
            }
        });

        // 4. OpenAI / ChatGPT Style "Ask Live AI" Button (Only speaks when user clicks)
        askVisionBtn.addEventListener('click', () => {
            const lang = voiceLanguageSelect.value;
            if (!isCameraOn) {
                speak("پہلے کیمرہ آن کریں۔", lang);
                return;
            }

            // Real-time user-triggered inspection response simulation
            const analysisUrdu = [
                "سامنے بالکل صاف دیوار موجود ہے۔ کوئی رکاوٹ نہیں۔",
                "سامنے ایک دروازہ ہے، آپ دائیں یا بائیں طرف سے گزر سکتے ہیں۔",
                "سامنے 2 قدم کے فاصلے پر صوفہ یا میز رکھی ہے۔",
                "راستہ بالکل صاف ہے، آپ آگے بڑھ سکتے ہیں۔"
            ];

            const analysisEnglish = [
                "There is a plain wall right in front. Path is clear.",
                "A door is detected directly ahead. You can pass through.",
                "A table or furniture is 2 steps ahead. Be careful.",
                "The path is completely clear. You can walk straight."
            ];

            const chosenList = lang.startsWith('ur') ? analysisUrdu : analysisEnglish;
            const randomAnalysis = chosenList[Math.floor(Math.random() * chosenList.length)];

            speak(randomAnalysis, lang);
        });
    </script>
</body>
</html>
