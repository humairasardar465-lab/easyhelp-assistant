function getLocalizedName(category) { return "رکاوٹ ہے"; }
function getT(key) { const lang = langSel.value; if (translations[lang] && translations[lang][key]) { return translations[lang][key]; } return translations['en-US'][key] || key; }
function triggerVibration() { if (isSpeakingObstacle) return; if ('vibrate' in navigator) { try { navigator.vibrate([200, 100, 200]); } catch (e) {} } }
function playBeep(type) {
  try {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') { audioCtx.resume(); }
    // چھوٹی رکاوٹ کے لیے پیاری سی ڈبل والی ٹن ٹن
    if (type === 'small') {
      const now = audioCtx.currentTime;
      [0, 0.16].forEach(function(offset) {
        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = 'sine'; o.frequency.setValueAtTime(880, now + offset);
        g.gain.setValueAtTime(0.12, now + offset);
        g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.12);
        o.start(now + offset); o.stop(now + offset + 0.12);
      });
      return;
    }
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'clear') {
      osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'obstacle') {
      // بھاری رکاوٹ کے لیے بھاری والی آواز، جیسی پہلے تھی
      const now = audioCtx.currentTime;
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.setValueAtTime(180, now + 0.1);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.setValueAtTime(0.3, now + 0.1);
      osc.start(now); osc.stop(now + 0.22);
    }
  } catch (e) {}
}
function speak(text, isObstacle = false) {
  if (!text) return;
  if (!('speechSynthesis' in window)) return;
  const now = Date.now();
  if (text === lastSpoken && now - lastSpeakTime < 2000 && !isObstacle) return;
  if (isObstacle && currentMode !== "obstacle") { window.speechSynthesis.cancel(); }
  if (!isObstacle && isSpeakingObstacle) return;
  if (isObstacle) { window.speechSynthesis.cancel(); }
  lastSpoken = text; lastSpeakTime = now;
  if (isObstacle) { isSpeakingObstacle = true; }
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = langSel.value;
  utterance.onend = () => { if (isObstacle) { setTimeout(() => { isSpeakingObstacle = false; }, 50); } };
  utterance.onerror = () => { if (isObstacle) { setTimeout(() => { isSpeakingObstacle = false; }, 50); } };
  window.speechSynthesis.speak(utterance);
}
async function initDetector() {
  if (objectDetector) return;
  if (!window.FilesetResolver || !window.ObjectDetector) { await new Promise(resolve => { window.addEventListener('mediapipe-loaded', resolve, { once: true }); setTimeout(resolve, 3000); }); }
  try {
    statusEl.innerText = getT('loading');
    const vision = await window.FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.2/wasm");
    objectDetector = await window.ObjectDetector.createFromOptions(vision, { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite", delegate: "CPU" }, scoreThreshold: 0.30, runningMode: "VIDEO" });
  } catch (err) { console.error(err); statusEl.innerText = getT('netError'); speak(getT('netError'), false); }
}
async function startCamera() {
  try {
    if (isLive || stream) return;
    await initDetector();
    if (!objectDetector) { statusEl.innerText = getT('netError'); speak(getT('netError'), false); return; }
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = stream;
    try {
      const track = stream.getVideoTracks()[0];
      if (track && track.getCapabilities && track.getCapabilities().torch) {
        await track.applyConstraints({ advanced: [{ torch: true }] });
      }
    } catch(e) {}
    video.onloadedmetadata = () => {
      video.play(); isLive = true; statusEl.innerText = getT('started'); speak(getT('started'), false);
      startBtn.style.display = 'none'; stopBtn.style.display = 'block'; window.requestAnimationFrame(predictWebcam);
    };
  } catch (err) { console.error(err); statusEl.innerText = getT('camError'); speak(getT('camError'), false); }
}
let lastVideoTime = -1;
async function predictWebcam() {
  if (!isLive) return;
  if (!objectDetector) { if (isLive) { window.requestAnimationFrame(predictWebcam); } return; }
  if (video.currentTime !== lastVideoTime && video.readyState >= 2) {
    lastVideoTime = video.currentTime; frameCount++;
    try {
      const startTimeMs = performance.now();
      const detections = objectDetector.detectForVideo(video, startTimeMs);
      const hasObjectDetected = detections && detections.detections && detections.detections.length > 0;
      if (!hasObjectDetected) { nothingCount++; } else { nothingCount = 0; clearWaitCount = 0; }
      if (hasObjectDetected) {
        let closest = detections.detections[0]; let maxArea = 0;
        for (let det of detections.detections) { const area = det.boundingBox.width * det.boundingBox.height; if (area > maxArea) { maxArea = area; closest = det; } }
        const confidence = Math.round(closest.categories[0].score * 100);
        const requiredConfidence = 30;
        if (confidence >= requiredConfidence) {
          const videoWidth = video.videoWidth || 640;
          const videoArea = videoWidth * (video.videoHeight || 480);
          const sizeRatio = maxArea / videoArea;
          if (sizeRatio >= 0.003) {
            obstacleConfirmCount++;
            if (obstacleConfirmCount >= 2) {
              const fullObstacleText = getT('stopClose');
              statusEl.innerText = fullObstacleText;
              const now = Date.now();
              if (currentMode !== "obstacle" || lastObstacleName !== fullObstacleText || (now - lastObstacleAlertTime > 2500)) {
                currentMode = "obstacle"; lastObstacleName = fullObstacleText; lastObstacleAlertTime = now;
                triggerVibration(); speak(fullObstacleText, true);
              }
              if (now - lastBeepTime > 800) {
                lastBeepTime = now;
                // بڑی چیز ہے تو بھاری والی، چھوٹی چیز ہے تو پیاری سی ڈبل والی ٹن ٹن
                if (sizeRatio >= 0.15) { playBeep('obstacle'); } else { playBeep('small'); }
              }
            }
          } else { handleClearPath(); }
        } else { handleClearPath(); }
      } else { handleClearPath(); }
    } catch (e) { console.error(e); }
  }
  if (isLive) { window.requestAnimationFrame(predictWebcam); }
}
function handleClearPath() {
  obstacleConfirmCount = 0;
  const now = Date.now();
  if (currentMode !== "clear") {
    currentMode = "clear"; lastObstacleName = "";
    if (isSpeakingObstacle) { window.speechSynthesis.cancel(); isSpeakingObstacle = false; }
    speak(getT('clearPath'), false); lastClearSpeakTime = now;
  }
  statusEl.innerText = getT('clearPath');
  if (now - lastClearSoundTime > 1000) { lastClearSoundTime = now; playBeep('clear'); }
  if (now - lastClearSpeakTime > 8000) { lastClearSpeakTime = now; speak(getT('clearPath'), false); }
}
function stopCamera() {
  if ('speechSynthesis' in window) { window.speechSynthesis.cancel(); }
  if ('vibrate' in navigator) { try { navigator.vibrate(0); } catch(e){} }
  isLive = false;
  if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
  video.srcObject = null; statusEl.innerText = "STATUS: OFF"; startBtn.style.display = 'block'; stopBtn.style.display = 'none';
  isSpeakingObstacle = false; clearWaitCount = 0; currentMode = "clear"; lastObstacleName = ""; lastObstacleAlertTime = 0; obstacleConfirmCount = 0;
}
startBtn.addEventListener('click', async () => { await startCamera(); });
stopBtn.addEventListener('click', () => { stopCamera(); });
openMapsBtn.addEventListener('click', () => { const dest = destinationInput.value.trim(); if (dest) { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(dest)}`, '_blank'); } else { window.open(`https://www.google.com/maps`, '_blank'); } });
