<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE AI CAMERA - Humaira Sardar</title>
<style>
  body{ font-family: Arial; background:#000; color:#fff; margin:0; padding:10px; text-align:center; }
  h2{ color:#f59e0b; margin:5px; }
  select, button{ width:100%; padding:14px; font-size:16px; border-radius:10px; border:none; margin-top:10px; font-weight:700; cursor:pointer; }
  select{ background:#fff; color:#000; }
  #startBtn{ background:#22c55e; color:#000; }
  #status{ margin-top:10px; font-size:15px; color:#fde68a; min-height:22px; }
  #result{ margin-top:10px; font-size:20px; font-weight:700; color:#fff; min-height:30px; }
  video{ width:100%; max-height:55vh; border-radius:12px; background:#111; object-fit:cover; }
  .note{ font-size:13px; color:#aaa; margin-top:8px; }
</style>
</head>
<body>

<h2>LIVE AI CAMERA</h2>

<!-- LANGUAGE SELECTOR -->
<label>SELECT LANGUAGE</label>
<select id="langSelect">
  <option value="ur-PK">Urdu - اردو</option>
  <option value="en-US">English</option>
  <option value="hi-IN">Hindi - हिन्दी</option>
  <option value="ar-SA">Arabic - العربية</option>
</select>

<video id="video" autoplay playsinline muted></video>
<div id="status">Camera off</div>
<div id="result"></div>

<button id="startBtn">START CAMERA</button>
<!-- REMEMBER and PLACE buttons will come automatically from tracker.js -->

<div class="note">Created for Humaira Sardar - Smart Cane Project<br>Code inside is English only. Voice is in selected language.</div>

<!-- 1. OBJECTS + TRANSLATIONS FILE - THIS HAS objects.json DATA INSIDE -->
<script src="custom-objects.js"></script>
<!-- 2. TRACKER FILE - REMEMBER + PLACE + STEPS + TURNS + STAIRS -->
<script src="tracker.js"></script>

<script>
// liveai.html - MAIN FILE
// NO RESTRICTION NOW - If obstacle comes, speak immediately. No silence on obstacle.

var video = document.getElementById("video");
var statusEl = document.getElementById("status");
var resultEl = document.getElementById("result");
var langSelect = document.getElementById("langSelect");
var startBtn = document.getElementById("startBtn");
var stream = null;
var isRunning = false;
var lastSpoken = "";
var lastSpokenTime = 0;
var lastClearSpokenTime = 0;
var detectionInterval = null;

// Language - tracker.js will also use this same variable
window.CUSTOM_SELECTED_LANG = langSelect.value;

langSelect.addEventListener("change", function(){
  window.CUSTOM_SELECTED_LANG = langSelect.value;
  speakGuide(getText("langChanged") + " " + langSelect.options[langSelect.selectedIndex].text);
});

// All guide sentences in user's language
var TEXTS = {
  "ur-PK": {
    langChanged: "زبان بدل گئی ہے",
    cameraStarted: "کیمرہ شروع ہو گیا ہے۔ میں اب راستہ دیکھ رہی ہوں۔",
    cameraStopped: "کیمرہ بند ہو گیا ہے",
    cameraError: "کیمرہ نہیں کھل سکا۔ اجازت دیں",
    pathClear: "سامنے راستہ صاف ہے",
    obstacleAhead: "سامنے ",
    isAhead: " ہے، ذرا دھیان سے",
    noCamera: "کیمرہ نہیں ملا"
  },
  "en-US": {
    langChanged: "Language changed",
    cameraStarted: "Camera started. I am now watching the road.",
    cameraStopped: "Camera stopped",
    cameraError: "Camera could not open. Please allow permission",
    pathClear: "Path ahead is clear",
    obstacleAhead: "Ahead ",
    isAhead: " is there, be careful",
    noCamera: "No camera found"
  },
  "hi-IN": {
    langChanged: "भाषा बदल गई है",
    cameraStarted: "कैमरा शुरू हो गया है। मैं अब रास्ता देख रही हूँ।",
    cameraStopped: "कैमरा बंद हो गया है",
    cameraError: "कैमरा नहीं खुल सका। अनुमति दें",
    pathClear: "सामने रास्ता साफ है",
    obstacleAhead: "सामने ",
    isAhead: " है, ज़रा ध्यान से",
    noCamera: "कैमरा नहीं मिला"
  },
  "ar-SA": {
    langChanged: "تم تغيير اللغة",
    cameraStarted: "بدأت الكاميرا. أنا الآن أراقب الطريق.",
    cameraStopped: "تم إيقاف الكاميرا",
    cameraError: "تعذر فتح الكاميرا. اسمح بالإذن",
    pathClear: "الطريق أمامك واضح",
    obstacleAhead: "أمامك ",
    isAhead: " انتبه",
    noCamera: "لم يتم العثور على كاميرا"
  }
};

function getLang(){
  return window.CUSTOM_SELECTED_LANG || "ur-PK";
}
function getText(key){
  var pack = TEXTS[getLang()] || TEXTS["en-US"];
  return pack[key] || TEXTS["en-US"][key] || "";
}

// Speak in selected language - NO RESTRICTION
function speakGuide(text){
  if(!text) return;
  if(!("speechSynthesis" in window)) return;
  try{
    window.speechSynthesis.cancel();
    setTimeout(function(){
      var u = new SpeechSynthesisUtterance(text);
      u.lang = getLang();
      u.rate = 0.9;
      window.speechSynthesis.speak(u);
    }, 100);
  }catch(e){}
}

// Get translated object name from custom-objects.js
// custom-objects.js has function getObjectName(id, lang)
function getNameInUserLang(englishId){
  if(window.getObjectName){
    try{
      var n = window.getObjectName(englishId, getLang());
      if(n) return n;
    }catch(e){}
  }
  return englishId;
}

// ---------- MAIN OBSTACLE FUNCTION - NO RESTRICTION ----------
// OLD CODE HAD RESTRICTION: if obstacle, stay silent. WE REMOVED IT.
// NEW CODE: if obstacle comes, SPEAK IMMEDIATELY. Never stay silent on obstacle.
function onObstacleDetected(englishId){
  if(!englishId) return;
  // Save for tracker.js also, so tracker can remember this obstacle with steps
  window.__LIVEAI_LAST_OBSTACLE__ = englishId;

  var translatedName = getNameInUserLang(englishId);
  resultEl.innerText = translatedName;
  statusEl.innerText = getText("obstacleAhead") + translatedName;

  var now = Date.now();
  // Speak immediately, only avoid speaking same name again and again within 2 seconds
  // This is NOT a restriction, this is only to avoid repeating same word 10 times in 1 second
  if(translatedName === lastSpoken && (now - lastSpokenTime) < 2000){
    return;
  }
  lastSpoken = translatedName;
  lastSpokenTime = now;

  // Speak obstacle name in user's language
  speakGuide(getText("obstacleAhead") + translatedName + getText("isAhead"));

  if("vibrate" in navigator){
    try{ navigator.vibrate([200,100,200]); }catch(e){}
  }
}

// When path is clear - speak only once in 6 seconds, not again and again
function onPathClear(){
  window.__LIVEAI_LAST_OBSTACLE__ = "";
  resultEl.innerText = getText("pathClear");
  statusEl.innerText = getText("pathClear");
  var now = Date.now();
  if(now - lastClearSpokenTime < 6000) return;
  lastClearSpokenTime = now;
  lastSpoken = "";
  speakGuide(getText("pathClear"));
}

// ---------- CAMERA ----------
startBtn.addEventListener("click", async function(){
  if(isRunning){
    stopCamera();
    return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    video.srcObject = stream;
    isRunning = true;
    startBtn.innerText = "STOP CAMERA";
    startBtn.style.background = "#ef4444";
    statusEl.innerText = getText("cameraStarted");
    speakGuide(getText("cameraStarted"));
    startDetection();
  }catch(e){
    statusEl.innerText = getText("cameraError");
    speakGuide(getText("cameraError"));
  }
});

function stopCamera(){
  isRunning = false;
  if(detectionInterval) clearInterval(detectionInterval);
  if(stream){
    stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null;
  }
  video.srcObject = null;
  startBtn.innerText = "START CAMERA";
  startBtn.style.background = "#22c55e";
  statusEl.innerText = getText("cameraStopped");
  speakGuide(getText("cameraStopped"));
}

// ---------- DETECTION LOOP ----------
// Here your Gemini / AI detection will call onObstacleDetected("chair") etc.
// For now this is connected to custom-objects.js list.
// IMPORTANT: NO RESTRICTION HERE - Every detected object will speak.
function startDetection(){
  // This is a demo loop - Replace this with your real Gemini Live AI result
  // When your real AI says "chair", just call: onObstacleDetected("chair")
  // When your real AI says nothing, call: onPathClear()
  // We keep this loop empty so it does NOT speak fake obstacles.
  // Your real AI code should be pasted here.
  console.log("Detection ready. Waiting for AI result. Call onObstacleDetected(id) when obstacle comes.");
}

// Make functions global so tracker.js and AI code can use them
window.onObstacleDetected = onObstacleDetected;
window.onPathClear = onPathClear;
window.speakGuideLiveAI = speakGuide;
window.getLiveAILang = getLang;
</script>
</body>
</html>
